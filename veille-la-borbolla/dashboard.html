lle illustre l'efficacité potentielle de programmes structurés de mindfulness combinant régulation émotionnelle pour réduire stress/anxiété/dépression — un principe transposable de façon générale aux ateliers de mindfulness de Braña Sana, sans que le contexte carcéral permette une transposition directe aux publics du centre (nature et sévérité du stress très différentes).","pertinence_brana_sana":1,"doi":"10.15649/cuidarte.5159","lien":"https://pubmed.ncbi.nlm.nih.gov/43011718/","source":"PubMed","pmid":"43011718","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"A tailored online mindfulness intervention for junior doctors: a mixed-methods study.","auteurs":"Moore S, Ngo H, Auret K, Toffoli A, O'Sullivan L, Cuesta-Briand B, Hassed C, Chambers R, Mavaddat N","date":"2026 Aug 12","type_etude":"RCT","mecanisme_evalue":"Pleine conscience trait, stress perçu, auto-compassion, stress professionnel et engagement au travail chez des médecins juniors, via un programme de mindfulness en ligne de 8 semaines (essai randomisé contrôlé en liste d'attente, avec volet qualitatif)","resultat_principal":"Le programme de mindfulness en ligne n'a pas été associé à des améliorations des mesures quantitatives (pleine conscience trait, stress perçu, auto-compassion, stress professionnel, engagement au travail) chez les médecins juniors — le stress perçu a même augmenté et l'engagement au travail diminué dans le groupe intervention à l'issue du programme — alors que les entretiens qualitatifs rapportaient des bénéfices perçus (auto-conscience, régulation émotionnelle, auto-compassion, productivité, relations).","niveau_de_preuve_et_limites":"Essai randomisé contrôlé (liste d'attente) mais petit échantillon final (55 participants analysés sur 72 randomisés, avec 17 perdus avant les mesures de base) ; adhérence et qualité de la pratique formelle/informelle jugées faibles par les auteurs eux-mêmes ; résultats quantitatifs négatifs ou défavorables contrastant avec des données qualitatives positives obtenues sur un sous-groupe restreint (13 participants) ; les auteurs soulignent l'influence de facteurs organisationnels (charge de travail, contraintes de temps) limitant l'impact mesuré de l'intervention ; comparaison avec un essai similaire chez des étudiants en médecine où l'adhérence était meilleure.","doi":"10.1186/s12909-026-09947-5","lien":"https://pubmed.ncbi.nlm.nih.gov/43009971/","source":"PubMed","pmid":"43009971","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Effectiveness of mindfulness-based interventions in UHR individuals and patients experiencing a first episode of psychosis: a systematic review and meta-analysis.","auteurs":"Dalfin W, Tursini K, Laruelle F, Buschmann S, Krebs M-O, Bernardin F, Laprévote V","date":"2026 Oct 26","type_etude":"méta-analyse","mecanisme_evalue":"Symptômes négatifs, qualité de vie, fonctionnement social et capacité de mindfulness chez des personnes à haut risque de psychose (UHR) ou en premier épisode psychotique (FEP)","resultat_principal":"La méta-analyse (basée sur seulement 2 RCT) montre un effet significatif post-intervention des interventions basées sur la mindfulness sur les symptômes négatifs (SMD=-0,67), mais cet effet n'est plus significatif à 3 mois de suivi, et aucun effet significatif n'a été observé sur la qualité de vie, le fonctionnement social ou la capacité de mindfulness.","niveau_de_preuve_et_limites":"Preuve limitée : seulement 3 RCT, 3 études prospectives, 1 étude qualitative et 1 étude de cas (2013-2023) inclus au total ; la méta-analyse quantitative repose sur seulement 2 RCT comparant MBI à un traitement habituel, ce qui constitue un échantillon très restreint. Les auteurs signalent eux-mêmes une hétérogénéité des patients et des interventions de mindfulness étudiées, ainsi qu'une durabilité limitée de l'effet observé au suivi à 3 mois. Les auteurs appellent explicitement à des RCT mieux conçus avec des protocoles standardisés avant de conclure à une utilité confirmée.","angle_brana_sana":"Cette étude concerne une population clinique spécifique (UHR/premier épisode psychotique) suivie en contexte psychiatrique structuré, très éloignée du public et du cadre de Braña Sana (bien-être général, prévention, bain de forêt, retour au travail manuel). Aucun lien concret et honnête ne se justifie pour un centre de bien-être non clinique.","pertinence_brana_sana":0,"doi":"10.1016/j.psychres.2026.117554","lien":"https://pubmed.ncbi.nlm.nih.gov/43008376/","source":"PubMed","pmid":"43008376","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Understanding implementation breakdown: lessons from a type 2 hybrid effectiveness-implementation study in residential aged care.","auteurs":"Andrews Sharon, Edwards Kelly, Stirling Christine, Lees David, Van Dam Pieter, Klatt Maryanna, Caputo Jacqueline, Kornhaber Rachel, Williams Peter","date":"2026-10-26","type_etude":"autre","mecanisme_evalue":"Burnout, stress, résilience et engagement au travail chez le personnel soignant, dans le cadre d'un programme de mindfulness (Mindfulness in Motion, MIM)","resultat_principal":"L'adoption du programme MIM a été très faible (22 inscrits, 11 ayant commencé, seulement 8 participants avec données complètes pré/post) ; les données qualitatives indiquent que le programme était perçu comme acceptable et bénéfique par les participants, mais des barrières organisationnelles (pénurie de personnel, charge de travail, scepticisme, faible engagement du management intermédiaire, silos de communication) ont empêché une mise en œuvre conforme au plan prévu ; les tendances favorables sur le bien-être restent exploratoires et non concluantes.","niveau_de_preuve_et_limites":"Étude hybride effectiveness-implementation de Type 2, méthodes mixtes, menée sur 5 sites. Échantillon final très réduit et auto-sélectionné (n=8 avec données appariées T1-T2 sur 22 inscrits initialement), ce qui empêche toute conclusion définitive sur l'efficacité du programme. Les auteurs soulignent eux-mêmes que la petite taille d'échantillon et le biais de sélection limitent la portée des résultats quantitatifs ; les enseignements principaux concernent les barrières d'implémentation plutôt que l'efficacité clinique.","doi":"10.3389/frhs.2026.1813706","lien":"https://pubmed.ncbi.nlm.nih.gov/43005233/","source":"PubMed","pmid":"43005233","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Minds \"at attention\": mindfulness training curbs attentional lapses in military cohorts.","auteurs":"Jha Amishi P, Morrison Alexandra B, Dainer-Best Justin, Parker Suzanne, Rostrup Nina, Stanley Elizabeth A","date":"2015-02-11","type_etude":"RCT","mecanisme_evalue":"Attention soutenue et lapses attentionnels liés au mind wandering (performance cognitive, résilience attentionnelle)","resultat_principal":"Dans des cohortes militaires en période de pré-déploiement à forte charge, l'entraînement à la mindfulness centré sur la pratique (training-focused MT) a été associé à moins de lapses attentionnels et à une stabilité de la performance (mesurée par A' au SART) comparé à un entraînement centré sur le contenu didactique ou à l'absence d'entraînement, dont la performance s'est dégradée entre T1 et T2.","niveau_de_preuve_et_limites":"Essai contrôlé randomisé avec plusieurs groupes (training-focused MT n=40, didactic-focused MT n=40, contrôle sans entraînement n=24, groupe civil n=45), mais effectifs modérés par groupe. Le résumé ne précise pas de randomisation explicite des groupes militaires aux conditions (termes \"provided\" et \"received\" suggèrent une attribution de groupe, mais le détail du processus de randomisation n'est pas donné dans l'abstract) ni d'aveuglement. Population spécifique (militaires en pré-déploiement) limitant la généralisabilité directe. Aucune autre limite méthodologique (hétérogénéité, biais d'attrition, etc.) n'est mentionnée explicitement dans le résumé — non précisé dans le résumé au-delà de ces éléments.","doi":"10.1371/journal.pone.0116889","lien":"https://pubmed.ncbi.nlm.nih.gov/25671579/","source":"PubMed","pmid":"25671579","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"reference","chercheur_reference":"Amishi Jha","ajoute_le":"2026-11-16"},{"titre":"Asymptomatic fasting-associated ketosis with high-anion-gap metabolic acidosis during phentermine-assisted weight loss: a case report.","auteurs":"Snoddy Kristina, Pugh Chandler, Maddux Andreas","date":"2026 Aug 19","type_etude":"cas clinique","mecanisme_evalue":"Équilibre acido-basique et cétogenèse (β-hydroxybutyrate, trou anionique, kaliémie) lors d'une restriction calorique/jeûne intermittent associée à un traitement par phentermine","resultat_principal":"Chez un homme de 59 ans sous jeûne intermittent et phentermine, une cétose liée au jeûne avec acidose métabolique à trou anionique élevé et hyperkaliémie a été observée, sans symptômes cliniques, évoquant une probable acidocétose de jeûne potentiellement amplifiée par la phentermine.","niveau_de_preuve_et_limites":"Rapport de cas unique (n=1), sans groupe contrôle, non généralisable. Les auteurs précisent eux-mêmes des limites méthodologiques importantes : absence de gaz du sang veineux empêchant de confirmer l'acidémie ou la compensation respiratoire ; le bicarbonate bas provient du CO2 total sérique d'un bilan métabolique de base et non d'une mesure directe de gaz du sang ; l'élévation du β-hydroxybutyrate établit une cétogenèse significative mais pas nécessairement une acidocétose confirmée ; données de suivi biochimique non disponibles. Le lien causal avec la phentermine reste présenté comme un facteur \"possible\" ou \"amplificateur\", non démontré.","angle_brana_sana":"Ce cas invite à la prudence dans les programmes de jeûne intermittent ou de restriction calorique proposés à des participants, notamment s'ils sont sous traitement pharmacologique amaigrissant (non pratiqué à Braña Sana) : il souligne l'importance d'un encadrement médical et d'une vigilance sur l'hydratation/électrolytes lors de restrictions caloriques marquées, même en l'absence de symptômes. Pertinent pour informer les protocoles de jeûne doux ou de diète proposés dans le pilier nutrition, en insistant sur la modération et le suivi plutôt que sur l'restriction agressive.","doi":"10.1186/s12902-026-02468-8","lien":"https://pubmed.ncbi.nlm.nih.gov/43035686/","source":"PubMed","pmid":"43035686","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Time-Restricted Eating and Blood Pressure: Disentangling the Components of a Multidimensional Intervention.","auteurs":"González-Correa C, Couto-Alfonso S, Iguacel I, Duarte J, Cenit MC","date":"2026 Nov 14","type_etude":"revue systématique","mecanisme_evalue":"Pression artérielle (phénotype circadien), régulation liée au jeûne restreint dans le temps (durée de jeûne, timing circadien, balance énergétique, qualité nutritionnelle, dynamique du poids corporel)","resultat_principal":"La revue propose un cadre conceptuel multidimensionnel distinguant les composantes biologiques (durée de jeûne, timing circadien, balance énergétique, qualité du régime, poids corporel) de la dimension méthodologique de mesure de la pression artérielle, afin de déterminer si le timing des repas a un effet antihypertenseur intrinsèque ; aucune conclusion causale définitive n'est établie à ce stade.","niveau_de_preuve_et_limites":"Il s'agit d'un article conceptuel/revue proposant un cadre d'analyse plutôt que des données primaires nouvelles ; les auteurs soulignent explicitement que l'attribution d'un effet spécifique au timing des repas (par opposition aux autres composantes confondues comme la durée de jeûne, l'apport énergétique ou la qualité alimentaire) reste difficile en l'état actuel des preuves humaines et expérimentales, et que la mesure de la pression artérielle elle-même est compliquée par sa nature circadienne. Aucune taille d'échantillon, méta-donnée statistique ou limite méthodologique chiffrée n'est précisée dans le résumé.","angle_brana_sana":"Le jeûne restreint dans le temps et la régularité des repas en lien avec les rythmes circadiens peuvent être intégrés de façon prudente dans les discussions sur la nutrition et le sommeil/repos proposées au centre, en insistant sur le fait que le lien causal avec la tension artérielle n'est pas encore établi et que l'effet dépend possiblement du contexte métabolique et circadien de chaque personne.","pertinence_brana_sana":2,"doi":"10.1093/nutrit/nuag167","lien":"https://pubmed.ncbi.nlm.nih.gov/43033823/","source":"PubMed","pmid":"43033823","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Lifestyle Changes for the Treatment of Hypertension.","auteurs":"Stein Jacob, Thompson Anthony, Thomas Angeli, Janakiraman Arun, Cohen Jordana B","date":"2026 Nov 14","type_etude":"revue systématique","mecanisme_evalue":"Pression artérielle et facteurs de risque cardiovasculaire (poids, apport sodium/potassium, activité physique, stress, alcool, substances pressives)","resultat_principal":"Les interventions sur le mode de vie (gestion du poids, patterns alimentaires type DASH, réduction du sodium/augmentation du potassium, activité physique, réduction de l'alcool) sont associées à des bénéfices sur la pression artérielle et le risque cardiovasculaire, avec des preuves solides pour la substitution sodium/potassium et la réduction de l'alcool chez les gros consommateurs, mais des preuves incertaines pour le jeûne intermittent (time-restricted eating) et les stratégies de réduction du stress.","niveau_de_preuve_et_limites":"Revue narrative synthétisant des essais récents hétérogènes ; les auteurs signalent explicitement que les preuves pour le time-restricted eating et les stratégies de réduction du stress sont incertaines, que la substitution potassium/sodium nécessite une surveillance du risque d'hyperkaliémie, et que l'adhérence durable et l'accès équitable restent des barrières majeures non résolues ; pas de méta-analyse quantitative propre, les études sources varient en méthodologie.","angle_brana_sana":"Les piliers nutrition/longévité et repos de Braña Sana peuvent légitimement s'appuyer sur les bénéfices documentés d'un régime type DASH, d'une activité physique régulière et d'une réduction de l'alcool pour accompagner des participants concernés par l'hypertension ; toutefois, les composantes stress/mindfulness et jeûne intermittent (time-restricted eating) ne doivent pas être présentées comme bénéfiques pour la tension artérielle, la preuve étant jugée incertaine par les auteurs.","pertinence_brana_sana":2,"doi":"10.1007/s11906-026-01401-7","lien":"https://pubmed.ncbi.nlm.nih.gov/43033324/","source":"PubMed","pmid":"43033324","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"The Effects of Time-Restricted Eating on Glycemic Control, Lipid Profiles, Androgen Levels, and Blood Pressure in PMOS: A Systematic Review and Meta-Analysis.","auteurs":"Yang Yang, Liu Zheng, Zhang Jing","date":"2026 Oct 27","type_etude":"méta-analyse","mecanisme_evalue":"Contrôle glycémique (glycémie à jeun, insuline à jeun, HOMA-IR, QUICKI, HbA1c), profil lipidique, taux d'androgènes et pression artérielle chez des femmes atteintes de PMOS (syndrome métabolique ovarien polyendocrinien)","resultat_principal":"Le jeûne à horaires restreints (TRE) améliore significativement plusieurs marqueurs de sensibilité à l'insuline (glycémie à jeun, insuline à jeun, HOMA-IR, QUICKI, HbA1c) chez les femmes avec PMOS, mais ne montre pas d'effet significatif sur le poids, l'IMC, le tour de taille, le profil lipidique, les androgènes ou la pression artérielle.","niveau_de_preuve_et_limites":"Méta-analyse incluant 8 études (363 participantes) en revue systématique, dont seulement 5 études contrôlées (4 ECR + 1 essai croisé randomisé, 264 participantes) pour la synthèse quantitative. Les intervalles de confiance pour certains résultats sont larges (ex. HbA1c: -3.18 à -0.22), suggérant une incertitude notable. Les auteurs appellent explicitement à des essais plus larges et de plus longue durée pour confirmer ces bénéfices, signalant implicitement une limite de puissance statistique et de durée de suivi dans les études actuelles.","angle_brana_sana":"Bien que le TRE (jeûne à horaires restreints) relève d'une approche nutritionnelle intéressante pour la sensibilité à l'insuline, cette étude porte spécifiquement sur une population clinique (PMOS) et ne concerne pas directement les piliers actuels de Braña Sana (bain de forêt, repos, travail manuel, mindfulness). Un lien nutritionnel général pourrait être évoqué avec prudence dans un futur programme nutrition/longévité, mais pas sur cette pathologie spécifique.","doi":"10.3390/jcm15218350","lien":"https://pubmed.ncbi.nlm.nih.gov/43030494/","source":"PubMed","pmid":"43030494","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"The Circadian Diet in Age-Related Neurodegeneration: Nutrient Timing, Sleep, and Mitochondrial Mechanisms.","auteurs":"Drăgoi Cristina Manuela, Nicolae Alina-Crengurţa, Dumitrescu Ion-Bogdan","date":"2026 Nov 06","type_etude":"revue systématique","mecanisme_evalue":"Rythmes circadiens, horloges périphériques, métabolisme mitochondrial (NAD+, sirtuines, AMPK), sommeil et régulation nutritionnelle (chrononutrition)","resultat_principal":"La revue identifie une plausibilité mécanistique reliant le timing alimentaire, le sommeil et le métabolisme mitochondrial à la neurodégénérescence (Alzheimer, Parkinson), mais souligne qu'aucune preuve clinique ne démontre à ce jour que restaurer l'alignement circadien par l'alimentation modifie réellement la progression de ces maladies.","niveau_de_preuve_et_limites":"Revue narrative combinant des données hétérogènes issues de modèles cellulaires, animaux, d'études observationnelles et d'essais cliniques ; les auteurs précisent explicitement que les améliorations métaboliques observées expérimentalement n'ont pas été traduites en neuroprotection démontrée chez l'humain, et appellent à des essais correctement dimensionnés avec évaluation de la phase circadienne, contrôle de l'apport énergétique et critères de jugement neurologiques cliniquement pertinents. Aucune taille d'échantillon spécifique n'est fournie puisqu'il s'agit d'une synthèse de littérature, pas d'une étude primaire.","angle_brana_sana":"Cette revue invite à la prudence plutôt qu'à l'application directe : elle appuie l'intérêt général d'un programme de repos structuré (horaires de sommeil réguliers, repas synchronisés, lumière naturelle via le bain de forêt) comme hygiène circadienne de bon sens, mais ne permet pas d'affirmer un effet protecteur contre le déclin cognitif. Utile comme référence scientifique de fond pour le pilier sommeil/nutrition, sans promettre de bénéfice neuroprotecteur non prouvé.","pertinence_brana_sana":2,"doi":"10.3390/nu18213682","lien":"https://pubmed.ncbi.nlm.nih.gov/43030309/","source":"PubMed","pmid":"43030309","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Time-Restricted Eating as a Dietary Intervention for Polyendocrine Metabolic Ovarian Syndrome (PMOS): Protocol for a Randomized Controlled Trial.","auteurs":"Pieczyńska-Zając Joanna Maria, Drzymała-Czyż Sławomira, Pruszyńska-Oszmałek Ewa, Kołodziejski Paweł Antoni, Bajerska Joanna","date":"2026 Oct 28","type_etude":"essai en cours","mecanisme_evalue":"Résistance à l'insuline (HOMA-IR), métabolisme glucido-lipidique, composition du microbiote intestinal et métabolites microbiens, composés neuroactifs circulants (GABA, kisspeptine) chez des femmes atteintes de PMOS","resultat_principal":"Il s'agit du protocole d'un essai contrôlé randomisé non encore débuté (recrutement non commencé) ; aucun résultat n'est encore disponible, l'étude vise à tester si l'ajout d'un jeûne à fenêtre restreinte (TRE 8h) aux recommandations Healthy Eating Plate améliore davantage la résistance à l'insuline que ces recommandations seules, sur 8 semaines.","niveau_de_preuve_et_limites":"Protocole d'étude (pas encore de données) : essai randomisé contrôlé à deux bras parallèles, allocation 1:1, population ciblée de femmes de 18-40 ans avec PMOS et IMC 25-40 kg/m2. Le résumé précise que les preuves actuelles sur le TRE dans le PMOS sont limitées, et que les analyses sur microbiote/métabolites/composés neuroactifs sont qualifiées d'exploratoires par les auteurs eux-mêmes. Aucune donnée de résultat, taille d'échantillon finale, ni limites méthodologiques post-hoc ne sont mentionnées puisque le recrutement n'a pas encore commencé.","doi":"10.3390/nu18213559","lien":"https://pubmed.ncbi.nlm.nih.gov/43030186/","source":"PubMed","pmid":"43030186","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Short-Term Effects of a Low-FODMAP Diet, Adapted NICE Dietary Advice, and Adapted NICE Dietary Advice Combined with Intermittent Fasting on Symptoms and Quality of Life in Irritable Bowel Syndrome: A Three-Arm, Non-Randomized Controlled Dietary Intervention Study","auteurs":"Ozman Nur Ecem Baydı, Gönen Can, Gençalp Cansu, Kahrıman Aydemir Meryem, Baş Murat","date":"2026 Oct 26","type_etude":"autre","mecanisme_evalue":"Symptômes digestifs fonctionnels (sévérité des symptômes du syndrome de l'intestin irritable), qualité de vie spécifique à la maladie, état psychologique (anxiété/dépression) et consistance des selles","resultat_principal":"Les trois interventions diététiques (low-FODMAP, conseils NICE adaptés, NICE combiné au jeûne intermittent) sont associées à une amélioration à court terme des symptômes et de la qualité de vie liés au SII ; une différence brute plus marquée en faveur du low-FODMAP par rapport au NICE pour la sévérité des symptômes n'a pas résisté à l'ajustement sur les valeurs de base, et aucune différence significative entre groupes n'a persisté pour la qualité de vie après ajustement.","niveau_de_preuve_et_limites":"Étude prospective à trois bras mais non randomisée (donc risque de biais de confusion/sélection), échantillon modeste (81 participants complets), durée courte (2 semaines) sans suivi à long terme ; les différences entre groupes observées en analyse brute ne sont plus significatives après ajustement sur les valeurs de base (ANCOVA), ce qui affaiblit la robustesse des résultats comparatifs ; les auteurs appellent explicitement à des études randomisées de plus grande taille avec suivi plus long pour confirmer ces résultats.","doi":"10.3390/nu18213526","lien":"https://pubmed.ncbi.nlm.nih.gov/43030155/","source":"PubMed","pmid":"43030155","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Time-Restricted Eating, Intermittent Fasting, and Fasting-Mimicking Diets in Weight Loss.","auteurs":"Fanti Maura, Mishra Amrendra, Longo Valter D, Brandhorst Sebastian","date":"2021 Jun 29","type_etude":"revue systématique","mecanisme_evalue":"Physiologie du jeûne (restriction temporelle de l'alimentation, jeûne intermittent, régimes mimant le jeûne) et son impact métabolique sur la perte de poids","resultat_principal":"De nombreux régimes populaires basés sur le jeûne (TRE, IF, FMD) peuvent induire une perte de poids, mais seul un nombre limité d'études démontre réellement une efficacité à long terme.","niveau_de_preuve_et_limites":"Revue narrative de la littérature existante ; les auteurs soulignent eux-mêmes que peu d'études disponibles démontrent une efficacité de perte de poids à long terme, suggérant une hétérogénéité méthodologique et un manque de données robustes sur la durabilité des effets. Aucune précision supplémentaire sur taille d'échantillon ou groupes contrôle n'est donnée dans ce résumé.","angle_brana_sana":"Les approches de jeûne intermittent ou de restriction temporelle de l'alimentation pourraient être intégrées avec prudence dans un programme de nutrition/longévité de Braña Sana, en insistant sur le manque de preuves de durabilité à long terme plutôt que sur une promesse de perte de poids garantie.","pertinence_brana_sana":2,"doi":"10.1007/s13679-021-00424-2","lien":"https://pubmed.ncbi.nlm.nih.gov/33512641/","source":"PubMed","pmid":"33512641","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"Valter Longo","ajoute_le":"2026-11-16"},{"titre":"Intermittent and periodic fasting, longevity and disease.","auteurs":"Longo Valter D, Di Tano Maira, Mattson Mark P, Guidi Novella","date":"2021 Jan 14","type_etude":"revue systématique","mecanisme_evalue":"Voies de signalisation liées à la détection des nutriments (nutrient-sensing), vieillissement cellulaire, et effets du jeûne intermittent/périodique sur la longévité et le risque de maladie","resultat_principal":"Le jeûne intermittent et périodique est associé à des effets potentiellement bénéfiques sur la longévité et la santé (prévention/traitement de cancer, maladies auto-immunes, neurodégénératives, métaboliques et cardiovasculaires), via des mécanismes moléculaires encore en cours d'élucidation, allant de la levure à l'humain.","niveau_de_preuve_et_limites":"Il s'agit d'une revue narrative synthétisant des résultats provenant de modèles allant de la levure aux humains ; les auteurs précisent eux-mêmes que les mécanismes moléculaires impliqués ne sont « qu'au début d'être dévoilés » (only beginning to be unraveled), ce qui indique un niveau de preuve encore préliminaire pour les effets chez l'humain. Le résumé ne fournit pas de données quantitatives (tailles d'échantillon, groupes contrôle) car il s'agit d'une synthèse de littérature et non d'une étude primaire ; des effets secondaires potentiels sont également mentionnés sans détail chiffré.","angle_brana_sana":"Les protocoles de jeûne intermittent/périodique pourraient éclairer la conception de programmes nutritionnels ou de séjours de restriction alimentaire temporaire proposés par Braña Sana, en lien avec le pilier nutrition/longévité, à condition de rester prudent sur les preuves encore préliminaires chez l'humain et de ne pas présenter ces pratiques comme des traitements validés.","pertinence_brana_sana":3,"doi":"10.1038/s43587-020-00013-3","lien":"https://pubmed.ncbi.nlm.nih.gov/35310455/","source":"PubMed","pmid":"35310455","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"Valter Longo","ajoute_le":"2026-11-16"},{"titre":"Periodic and Intermittent Fasting in Diabetes and Cardiovascular Disease","auteurs":"Crupi Annunziata Nancy, Haase Jonathan, Brandhorst Sebastian, Longo Valter D","date":"2020 Dec 10","type_etude":"revue systématique","mecanisme_evalue":"Facteurs de risque cardiométabolique (adiposité, glycémie, pression artérielle, cholestérol, inflammation) en lien avec le jeûne intermittent, le jeûne prolongé, l'alimentation à horaires restreints (TRE) et les régimes mimant le jeûne (FMD)","resultat_principal":"Le jeûne intermittent, prolongé, le TRE et les FMD sont associés à une réduction de plusieurs facteurs de risque cardiovasculaire, souvent indépendamment de la perte de poids, mais sans preuve directe établie de réduction des événements cardiovasculaires eux-mêmes.","niveau_de_preuve_et_limites":"Revue narrative synthétisant des données existantes ; les auteurs soulignent explicitement l'absence d'études à long terme sur l'effet réel de ces approches sur la maladie cardiovasculaire (CVD), les données actuelles portant surtout sur les facteurs de risque intermédiaires et non sur des issues cliniques dures.","angle_brana_sana":"Les principes de jeûne périodique/TRE pourraient informer un volet nutritionnel du programme de santé préventive de Braña Sana (ex. fenêtres alimentaires lors de séjours, sensibilisation nutritionnelle), à présenter avec prudence compte tenu du manque de données à long terme.","pertinence_brana_sana":2,"doi":"10.1007/s11892-020-01362-4","lien":"https://pubmed.ncbi.nlm.nih.gov/33301104/","source":"PubMed","pmid":"33301104","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"Valter Longo","ajoute_le":"2026-11-16"},{"titre":"Fasting in diabetes treatment (FIT) trial: study protocol for a randomised, controlled, assessor-blinded intervention trial on the effects of intermittent use of a fasting-mimicking diet in patients with type 2 diabetes.","auteurs":"van den Burg Elske L, Schoonakker Marjolein P, van Peet Petra G, van den Akker-van Marle M Elske, Willems van Dijk Ko, Longo Valter D, Lamb Hildo J, Numans Mattijs E, Pijl Hanno","date":"2020 Jun 24","type_etude":"essai en cours","mecanisme_evalue":"Paramètres métaboliques (HbA1c, besoin en médication antidiabétique), profils lipidiques, composition corporelle, fonction cardiaque et microbiome, dans le cadre d'une diète mimant le jeûne (FMD) appliquée de façon intermittente","resultat_principal":"Il s'agit d'un protocole d'essai clinique (non encore de résultats) : l'étude vise à déterminer si des cycles mensuels de 5 jours de diète mimant le jeûne pendant un an améliorent les paramètres métaboliques et/ou réduisent le besoin en médication chez des patients diabétiques de type 2, comparé aux soins usuels.","niveau_de_preuve_et_limites":"Protocole d'essai randomisé contrôlé en simple aveugle (évaluateur) avec 100 patients prévus — c'est un plan d'étude, aucun résultat d'efficacité n'est encore disponible. L'enregistrement de l'essai a été fait rétrospectivement (21 janvier 2019). Les limites méthodologiques propres aux résultats ne peuvent pas être évaluées à ce stade puisque l'étude n'a pas encore produit de données.","angle_brana_sana":"Si les résultats futurs confirment un bénéfice, l'approche de restriction calorique intermittente et de rythme nutritionnel cyclique pourrait informer les programmes de nutrition/longévité proposés en lien avec les séjours de retraite à Braña Sana — mais cela reste à ce stade purement prospectif, sans preuve d'effet disponible.","pertinence_brana_sana":1,"doi":"10.1186/s12902-020-00576-7","lien":"https://pubmed.ncbi.nlm.nih.gov/32580710/","source":"PubMed","pmid":"32580710","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"Valter Longo","ajoute_le":"2026-11-16"},{"titre":"Programmed longevity, youthspan, and juventology.","auteurs":"Longo Valter D","date":"2019 Feb 17","type_etude":"autre","mecanisme_evalue":"Gènes et voies de signalisation conservés liés aux nutriments (ex. restriction calorique/jeûne) régulant la durée de vie, la santé fonctionnelle et des processus de régénération/rajeunissement cellulaire","resultat_principal":"L'article propose un cadre conceptuel (\"juventology\") selon lequel le jeûne périodique et d'autres restrictions alimentaires peuvent activer un \"programme de longévité\" associé à une protection cellulaire et à des processus régénératifs, indépendamment du rythme de vieillissement antérieur — il s'agit d'une synthèse théorique et non d'une démonstration expérimentale directe d'effet causal chez l'humain.","niveau_de_preuve_et_limites":"Article de synthèse/perspective (pas une étude originale avec méthodologie expérimentale propre) ; non précisé dans le résumé concernant taille d'échantillon, groupe contrôle ou modèle biologique spécifique (humain vs animal). Les affirmations reposent sur l'intégration de données préexistantes (génétique, signalisation nutriments) sans détail sur leur robustesse individuelle dans ce résumé.","angle_brana_sana":"Le concept de jeûne périodique / restriction alimentaire comme levier potentiel de \"programme de longévité\" peut nourrir une réflexion pour le pilier nutrition/longévité de Braña Sana (ex. ateliers ou séjours intégrant des périodes de restriction alimentaire encadrée), mais il s'agit d'un cadre théorique général et non d'un protocole validé à appliquer tel quel.","pertinence_brana_sana":2,"doi":"10.1111/acel.12843","lien":"https://pubmed.ncbi.nlm.nih.gov/30334314/","source":"PubMed","pmid":"30334314","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"Valter Longo","ajoute_le":"2026-11-16"},{"titre":"Fasting and Caloric Restriction in Cancer Prevention and Treatment","auteurs":"Brandhorst Sebastian, Longo Valter D","date":"2016-08-26","type_etude":"revue systématique","mecanisme_evalue":"Effets métaboliques et cellulaires de la restriction calorique et du jeûne (jeûne périodique, régimes mimant le jeûne, restriction diététique) sur la prévention du cancer et la réponse à la chimiothérapie, incluant protection cellulaire et sensibilisation différentielle des cellules saines vs tumorales","resultat_principal":"La revue rapporte, sur la base d'études précliniques et d'essais cliniques préliminaires, que le jeûne périodique, les régimes mimant le jeûne et la restriction diététique sans réduction calorique montrent des effets bénéfiques potentiels pour prévenir certains cancers et augmenter l'efficacité des traitements de chimiothérapie, alors que la restriction calorique chronique présente à la fois des effets bénéfiques et délétères ainsi que des problèmes majeurs d'observance.","niveau_de_preuve_et_limites":"Revue narrative synthétisant des études précliniques (modèles animaux) et des études cliniques décrites comme \"préliminaires\" ; les auteurs eux-mêmes soulignent le caractère préliminaire des données cliniques et l'absence de directives claires sur le type de nutrition à recommander aux patients atteints de cancer ; aucune taille d'échantillon spécifique, groupe contrôle ou méthodologie détaillée n'est précisée dans le résumé.","angle_brana_sana":"Les données concernent spécifiquement la prévention et le traitement du cancer, contexte médical encadré qui dépasse le cadre d'un centre bien-être généraliste ; aucun lien concret et honnête avec les programmes de jeûne/nutrition proposés à Braña Sana ne peut être établi sans risquer une interprétation thérapeutique inappropriée pour une population non malade.","pertinence_brana_sana":0,"doi":"10.1007/978-3-319-42118-6_12","lien":"https://pubmed.ncbi.nlm.nih.gov/27557543/","source":"PubMed","pmid":"27557543","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"Valter Longo","ajoute_le":"2026-11-16"},{"titre":"Interventions to Slow Aging in Humans: Are We Ready?","auteurs":"Longo Valter D, Antebi Adam, Bartke Andrzej, Barzilai Nir, Brown-Borg Holly M, Caruso Calogero, Curiel Tyler J, de Cabo Rafael, Franceschi Claudio, Gems David, Ingram Donald K, Johnson Thomas E, Kennedy Brian K, Kenyon Cynthia, Klein Samuel, Kopchick John J, Lepperdinger Guenter, Madeo Frank, Mirisola Mario G, Mitchell James R, Passarino Giuseppe, Rudolph Karl L, Sedivy John M, Shadel Gerald S, Sinclair David A, Spindler Stephen R, Suh Yousin, Vijg Jan, Vinciguerra Manlio, Fontana Luigi","date":"2015 Aug 22","type_etude":"revue systématique","mecanisme_evalue":"Voies biologiques du vieillissement : axe GH/IGF-1, mTOR-S6K, AMPK, sirtuines ; effets de la restriction calorique/protéique et du jeûne périodique","resultat_principal":"Consensus d'experts (workshop d'Erice 2013) identifiant quatre catégories d'interventions prometteuses pour retarder le vieillissement et prévenir les maladies liées à l'âge chez l'humain : régimes mimant la restriction calorique/protéique (dont jeûne périodique), inhibiteurs de l'axe GH/IGF-1, inhibiteurs de mTOR-S6K, et activateurs d'AMPK ou de sirtuines spécifiques — ce consensus repose principalement sur des preuves issues d'organismes modèles et de rongeurs, pas encore d'essais humains robustes.","doi":"10.1111/acel.12338","lien":"https://pubmed.ncbi.nlm.nih.gov/25902704/","source":"PubMed","pmid":"25902704","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"David Sinclair","ajoute_le":"2026-11-16"},{"titre":"A blueprint for developing therapeutic approaches that increase healthspan and delay death.","auteurs":"Le Couteur David G, Sinclair David A","date":"2010 Jul 07","type_etude":"autre","mecanisme_evalue":"Non précisé dans le résumé (aucun résumé disponible ; titre suggère un cadre conceptuel pour des approches thérapeutiques visant la longévité en santé, sans mécanisme physiologique spécifique identifié)","resultat_principal":"Aucun résultat ne peut être extrait, car il s'agit d'un éditorial sans résumé disponible — le titre indique seulement qu'il propose un cadre (\"blueprint\") pour développer des approches thérapeutiques augmentant la durée de vie en bonne santé et retardant la mort.","niveau_de_preuve_et_limites":"Non précisé dans le résumé : aucun abstract n'est disponible. Il s'agit d'un éditorial (type de publication déclaré), ce qui signifie typiquement une opinion ou perspective d'experts plutôt qu'une étude empirique avec données primaires. Aucune information sur méthodologie, échantillon, groupe contrôle ou limites n'est disponible pour évaluation.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1093/gerona/glq048","lien":"https://pubmed.ncbi.nlm.nih.gov/20375077/","source":"PubMed","pmid":"20375077","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"David Sinclair","ajoute_le":"2026-11-16"},{"titre":"What is Xenohormesis?","auteurs":"Baur Joseph A, Sinclair David A","date":"2008 Mar 31","type_etude":"autre","mecanisme_evalue":"Activation des sirtuines par des polyphénols d'origine végétale (ex. resvératrol, quercétine) comme vecteur hypothétique des effets de la restriction calorique sur la longévité","resultat_principal":"Article de revue/hypothèse proposant que des phytochimiques produits par des plantes stressées pourraient activer chez les animaux des voies de réponse au stress (sirtuines), par un mécanisme adaptatif nommé xénohormèse ; aucune preuve causale directe n'est établie, il s'agit d'une discussion conceptuelle des preuves existantes et d'hypothèses alternatives.","niveau_de_preuve_et_limites":"Il s'agit d'un article de revue/opinion théorique, non d'une étude expérimentale originale avec échantillon ou groupe contrôle. Les auteurs eux-mêmes indiquent explicitement que l'hypothèse de xénohormèse reste à confirmer et que son rôle (total, partiel ou nul) dans les effets bénéfiques du resvératrol et autres phytochimiques \"reste à voir\" (remains to be seen). Aucune donnée quantitative, taille d'échantillon ou méthodologie expérimentale n'est fournie dans ce résumé.","angle_brana_sana":"Cadre conceptuel intéressant pour justifier l'intérêt nutritionnel des légumes/plantes \"stressées\" (ex. cultures en conditions naturelles, jardin médicinal) dans un discours pédagogique sur la longévité, mais à présenter avec prudence comme hypothèse scientifique non confirmée plutôt que comme fait établi.","pertinence_brana_sana":2,"doi":"10.3844/ajptsp.2008.152.159","lien":"https://pubmed.ncbi.nlm.nih.gov/26949380/","source":"PubMed","pmid":"26949380","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"David Sinclair","ajoute_le":"2026-11-16"},{"titre":"Caloric restriction and life span determination of yeast cells.","auteurs":"Medvedik Oliver, Sinclair David A","date":"2007-07-20","type_etude":"autre","mecanisme_evalue":"Restriction calorique et déterminants moléculaires de la durée de vie (réplicative) chez la levure Saccharomyces cerevisiae, notamment la fréquence de recombinaison au locus de l'ADNr et la formation de cercles extrachromosomiques d'ADNr (ERCs)","resultat_principal":"Il s'agit d'un article méthodologique décrivant les protocoles permettant de restreindre caloriquement des levures, de mesurer leur durée de vie réplicative et d'analyser les ERCs, sans présenter de nouveaux résultats expérimentaux propres ; le texte rappelle que la restriction calorique est connue pour prolonger la durée de vie chez de nombreuses espèces (rongeurs, organismes unicellulaires, invertébrés, probablement primates).","niveau_de_preuve_et_limites":"Non précisé dans le résumé pour les protocoles eux-mêmes (il s'agit d'un chapitre méthodologique, pas d'une étude expérimentale originale avec échantillon ou groupe contrôle propres). Les affirmations générales sur l'effet de la restriction calorique chez diverses espèces s'appuient sur des références externes citées (1-8) non détaillées ici ; l'extrapolation des résultats obtenus chez la levure (organisme unicellulaire) à l'humain reste indirecte et non démontrée par ce travail.","angle_brana_sana":"Bien que la restriction calorique soit un thème pertinent pour le pilier nutrition/longévité de Braña Sana, cet article est un protocole technique de biologie moléculaire sur la levure (mesure de durée de vie réplicative, analyse d'ERCs) sans application pratique directe transposable à un programme nutritionnel ou à l'accompagnement des visiteurs. Aucun lien concret et actionnable ne se justifie ici.","pertinence_brana_sana":0,"doi":"10.1007/978-1-59745-361-5_9","lien":"https://pubmed.ncbi.nlm.nih.gov/17634577/","source":"PubMed","pmid":"17634577","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"David Sinclair","ajoute_le":"2026-11-16"},{"titre":"Toward a unified theory of caloric restriction and longevity regulation.","auteurs":"Sinclair David A","date":"2005 Sep 22","type_etude":"autre","mecanisme_evalue":"Restriction calorique comme réponse au stress conservée évolutivement, régulation de la longévité et de la résistance aux maladies (voies métaboliques et moléculaires associées, ex. sirtuines évoquées implicitement par le contexte de la revue)","resultat_principal":"Il s'agit d'une revue théorique (perspective) proposant que la restriction calorique ne soit pas un simple effet métabolique passif mais une réponse de stress active et conservée évolutivement, et l'auteur avance une hypothèse unificatrice synthétisant plusieurs modèles existants pour expliquer l'extension de la durée de vie observée chez la levure, le ver, la mouche et les mammifères — ceci reste une proposition théorique et non une démonstration expérimentale nouvelle.","niveau_de_preuve_et_limites":"Il s'agit d'un article de synthèse/perspective (review) et non d'une étude primaire : l'auteur compile et interprète des données issues de plusieurs organismes modèles (levure, vers, mouches, mammifères) pour proposer une hypothèse théorique unificatrice. Le résumé ne précise ni taille d'échantillon, ni groupe contrôle, ni méthodologie expérimentale propre, puisque ce n'est pas une étude de données primaires. Aucune limite méthodologique spécifique n'est mentionnée dans le résumé au-delà de la nature synthétique/théorique du travail.","angle_brana_sana":"Bien que la restriction calorique stricte ne soit pas un axe pratiqué à Braña Sana, cette revue peut nourrir une réflexion générale sur le pilier nutrition/longévité (ex. discussion sur le jeûne intermittent modéré ou les habitudes alimentaires sobres proposées en atelier), à condition de rester prudent : il s'agit de mécanismes étudiés chez des organismes modèles et d'une hypothèse théorique, pas d'une recommandation pratique validée chez l'humain en contexte de bien-être.","pertinence_brana_sana":1,"doi":"10.1016/j.mad.2005.03.019","lien":"https://pubmed.ncbi.nlm.nih.gov/15893363/","source":"PubMed","pmid":"15893363","thematique_id":"nutrition-longevite","thematique":"Nutrition & science de la longévité","origine_recherche":"reference","chercheur_reference":"David Sinclair","ajoute_le":"2026-11-16"},{"titre":"Skin Longevity Medicine: A Hierarchical Framework for Personalized Skin Health and Aging Intervention.","auteurs":"Zhao Liangsen, Liao Yong","date":"2026 Oct 15","type_etude":"revue systématique","mecanisme_evalue":"Vieillissement cutané (hallmarks of aging appliqués à la peau, sénescence des fibroblastes dermiques, dégradation de la matrice extracellulaire) et régulation psychoneurobiologique associée","resultat_principal":"Les auteurs proposent un cadre conceptuel hiérarchique en cinq piliers (optimisation métabolique/nutritionnelle systémique, régulation du mode de vie et psychoneurobiologique, maintien de la barrière épidermique et épigénétique locale, homéostasie de la matrice extracellulaire et injectables régénératifs, dispositifs énergétiques) pour structurer une médecine personnalisée de la longévité cutanée ; il s'agit d'une proposition théorique de priorisation et de synergie des interventions, non d'une démonstration empirique d'efficacité.","niveau_de_preuve_et_limites":"Revue narrative/perspective proposant un cadre conceptuel plutôt qu'une synthèse quantitative d'essais cliniques ; le résumé ne précise pas de méthodologie systématique (pas de critères de sélection d'études, pas de méta-analyse), ni de taille d'échantillon ou de groupe contrôle puisqu'il s'agit d'un article de synthèse/positionnement. Aucune limite méthodologique spécifique n'est mentionnée explicitement dans le résumé au-delà de son caractère programmatique visant à \"stimuler le débat scientifique\".","angle_brana_sana":"Le deuxième pilier proposé par les auteurs (régulation du mode de vie et psychoneurobiologique) recoupe conceptuellement les approches de Braña Sana (repos, sommeil, bain de forêt, mindfulness) comme leviers potentiels de résilience tissulaire et de santé cutanée, dans une logique de prévention globale plutôt que de traitement esthétique isolé ; toutefois ce lien reste théorique et non étayé par des données spécifiques dans ce résumé.","pertinence_brana_sana":1,"doi":"10.7759/cureus.117987","lien":"https://pubmed.ncbi.nlm.nih.gov/43036749/","source":"PubMed","pmid":"43036749","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Rationale and methodology of an ongoing Maltese longitudinal cohort study focusing on obesity: a decade of population health surveillance.","auteurs":"Grech Elizabeth, Calleja Neville, Calleja Keith, Tonna Axel, Magro Grazia, Cuschieri Sarah","date":"2026 Dec 04","type_etude":"étude observationnelle","mecanisme_evalue":"Adiposité (surpoids/obésité) et facteurs socio-démographiques, socio-économiques, de mode de vie, cliniques et biologiques associés à son évolution","resultat_principal":"Il s'agit d'un article de méthodologie décrivant le protocole d'une cohorte de suivi à 10 ans (SAHHTEK 2.0) en cours ; aucun résultat d'association ou de changement d'adiposité n'est encore rapporté (recrutement en cours : 268/455 participants ciblés).","niveau_de_preuve_et_limites":"Étude de cohorte longitudinale en cours (pas encore de résultats finaux) ; échantillon de suivi restreint (455 participants sélectionnés sur 1861 initiaux, taux d'attrition potentiel important sur 10 ans) ; recrutement partiel au moment de la publication (268/455) ; absence de groupe contrôle externe (cohorte unique nationale maltaise) ; les auteurs ne précisent pas d'autres limites méthodologiques dans le résumé.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1016/j.gloepi.2026.100298","lien":"https://pubmed.ncbi.nlm.nih.gov/43036660/","source":"PubMed","pmid":"43036660","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Association of HBB gene variants with cardiometabolic and renal phenotypes in a Taiwanese genomic cohort: a cross-sectional study","auteurs":"Chang Ke-Xin, Hsiao Tzu-Hung, Chen Chi-Yen, Lin Guan-Cheng, Li Meng-Hua, Chen I-Chieh, Wang Jiaan-Der","date":"2026 Aug 15","type_etude":"étude observationnelle","mecanisme_evalue":"Variants du gène HBB (porteurs de bêta-thalassémie) et leur association avec le diabète, l'hyperlipidémie et la fonction rénale (eGFR)","resultat_principal":"Dans une cohorte génomique taïwanaise, le portage de variants HBB (statut de porteur de bêta-thalassémie) est associé à une prévalence plus faible de diabète et d'hyperlipidémie ainsi qu'à un eGFR plus élevé, cette association statistique restant significative après correction pour tests multiples, mais sans établir de causalité ni de mécanisme physiologique confirmé.","niveau_de_preuve_et_limites":"Étude observationnelle transversale (478 porteurs vs 4780 témoins appariés), donc limitée à des associations statistiques sans preuve de causalité ni de directionnalité. Les auteurs soulignent eux-mêmes que l'eGFR plus élevé pourrait refléter des limites liées à la méthode de mesure (basée sur la créatinine) plutôt qu'une fonction rénale réellement supérieure. Ils appellent à des études prospectives avec d'autres marqueurs glycémiques et rénaux pour clarifier les mécanismes et la causalité. Population limitée à l'Asie de l'Est (Taïwan), ce qui limite la généralisabilité.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1186/s12864-026-13268-8","lien":"https://pubmed.ncbi.nlm.nih.gov/43009751/","source":"PubMed","pmid":"43009751","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Multilevel Integration of Artificial Intelligence and Wearable Biosensors for Precision Health and Clinical Translation.","auteurs":"Ding Longhua, Wang Aizhu, Cai Lihan, Chen Mengxiao, Han Xun, Yu Xin","date":"2026 Nov 10","type_etude":"revue systématique","mecanisme_evalue":"Biosignaux physiologiques collectés par capteurs portables (biosenseurs) et leur interprétation par IA pour le suivi du stress, des troubles métaboliques, neurologiques et ophtalmiques","resultat_principal":"Cette revue propose un cadre conceptuel à trois niveaux d'intégration IA-biosenseurs (interprétation du signal, co-optimisation du capteur, jugement de santé au niveau système) et décrit comment cette approche pourrait faire évoluer les biosenseurs portables vers une détection et gestion plus précoces de certaines pathologies — il s'agit d'une synthèse de l'état de l'art technique, pas d'une démonstration d'effet clinique.","niveau_de_preuve_et_limites":"Revue narrative/conceptuelle de littérature technique, sans méta-analyse ni données quantitatives agrégées propres ; les auteurs signalent eux-mêmes des limites persistantes du domaine (standardisation des données, interprétabilité des modèles, compromis intégration système/consommation énergétique). Aucune taille d'échantillon ni groupe contrôle applicable puisqu'il s'agit d'une revue de technologies, pas d'une étude empirique primaire.","angle_brana_sana":"Pas de lien concret et actionnable pour Braña Sana : il s'agit d'une revue technique sur l'ingénierie de capteurs/IA pour la médecine clinique décentralisée, sans application directe à un programme de bain de forêt, jardin médicinal, atelier manuel ou repos tel que proposé par le centre.","pertinence_brana_sana":0,"doi":"10.1021/acssensors.6c03672","lien":"https://pubmed.ncbi.nlm.nih.gov/43008140/","source":"PubMed","pmid":"43008140","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Adherence to Cancer Screening Guidelines in Employer-Provided Healthcare Programs: A Survey of Companies in Lombardy (Northern Italy)","auteurs":"Scovenna Francesco, Ballotari Paola, Piccinelli Sara, Pedot Andrea, Ferrè Francesca, Barbera Valentina, Celata Corrado, Vimercati Nadia, Tettamanzi Elena, Pregliasco Fabrizio Ernesto, Cereda Danilo, Deandrea Silvia","date":"2026-11-04","type_etude":"étude observationnelle","mecanisme_evalue":"Alignement des pratiques de dépistage oncologique (sein, col de l'utérus, colorectal, prostate, poumon) offertes par les programmes de santé en entreprise avec les recommandations internationales fondées sur les preuves","resultat_principal":"Parmi les 95 entreprises (sur 308 répondantes) offrant des services de médecine préventive, les dépistages du sein et du col utérin sont les plus fréquemment proposés mais majoritairement non conformes aux recommandations (51% des offres de mammographie et 92,6% des frottis Pap sont jugés hors guidelines, traduisant un sur-dépistage), tandis que les dépistages colorectal et pulmonaire sont moins souvent proposés ; les grandes entreprises ont significativement moins de risque d'intervalles de mammographie inappropriés (OR 0,11 ; IC95% 0,02-0,58).","niveau_de_preuve_et_limites":"Étude transversale (enquête) portant sur 308 entreprises participant au programme WHP de Lombardie, dont seulement 95 offrant des services de prévention étudiés en détail ; analyse descriptive et régression logistique univariée (pas de modèle multivarié mentionné) ; échantillon limité à une région spécifique (Lombardie, Italie du Nord), ce qui limite la généralisabilité ; nature observationnelle empêchant toute inférence causale sur les facteurs associés à la non-conformité ; les auteurs ne précisent pas d'autres limites méthodologiques (taille d'échantillon exacte par type de cancer, biais de réponse, etc.) au-delà de ce qui est rapporté.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1177/10732748261491831","lien":"https://pubmed.ncbi.nlm.nih.gov/42981158/","source":"PubMed","pmid":"42981158","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Nutrition knowledge awareness and associating factors among school-age children in Chongqing: a 2023-2024 survey.","auteurs":"Wang Miaoran, Wang Dong, Li Fang, Huo Jiao, Feng Ping, Chen Jingrong","date":"2026-10-19","type_etude":"étude observationnelle","mecanisme_evalue":"Connaissances nutritionnelles et facteurs associés (sexe, repas scolaires, internat, éducation/emploi parental) chez des enfants d'âge scolaire","resultat_principal":"Le taux global de maîtrise des connaissances nutritionnelles atteint 48,51%, diminuant fortement avec le niveau scolaire (de 80,56% en primaire bas niveau à 22,42% au lycée), avec des associations identifiées entre ce niveau de connaissance et le sexe, les repas scolaires, le statut d'internat et l'éducation/l'emploi des parents.","niveau_de_preuve_et_limites":"Étude observationnelle transversale basée sur un échantillonnage stratifié en grappes (n=4980), analysée par régression logistique ; ce type de design permet d'identifier des associations statistiques mais ne permet pas d'établir de lien causal. Le résumé ne précise pas d'autres limites (biais de déclaration, représentativité au-delà de Chongqing, validation du questionnaire, etc.) — non précisé dans le résumé.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.3389/fnut.2026.1935221","lien":"https://pubmed.ncbi.nlm.nih.gov/42973719/","source":"PubMed","pmid":"42973719","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Conventional approaches to mechanism in named psychological treatments for chronic pain in the era of personalized precision health care: a square peg in a round hole.","auteurs":"McCracken Lance M","date":"2026 Dec 01","type_etude":"autre","mecanisme_evalue":"Non précisé dans le résumé — le titre évoque une réflexion sur les mécanismes dans les traitements psychologiques nommés de la douleur chronique, dans le contexte de la médecine personnalisée/de précision.","resultat_principal":"Aucun résultat principal ne peut être extrait : aucun résumé n'est disponible, seul le titre suggère une critique conceptuelle (article d'opinion/position) sur l'inadéquation des approches conventionnelles de mécanisme face aux soins personnalisés de précision pour la douleur chronique.","niveau_de_preuve_et_limites":"Non précisé dans le résumé — aucun abstract fourni, impossible d'évaluer la méthodologie, la taille d'échantillon, la présence d'un groupe contrôle ou toute limite mentionnée par l'auteur. L'analyse se base uniquement sur le titre, qui suggère un article de type commentaire/opinion plutôt qu'une étude empirique.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1097/j.pain.0000000000004135","lien":"https://pubmed.ncbi.nlm.nih.gov/42969624/","source":"PubMed","pmid":"42969624","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Phenoconversion and rural pain inequities: a precision-informed roadmap to advance equity for rural older adults.","auteurs":"Hall Alexis K, Cicali Emily J, Schentrup Denise, Dubin Andrew H","date":"2026 10 14","type_etude":"autre","mecanisme_evalue":"Métabolisme des médicaments via phénoconversion (altération fonctionnelle de l'activité enzymatique, notamment CYP2D6) affectant la réponse analgésique chez les personnes âgées en milieu rural","resultat_principal":"Article de synthèse/positionnement proposant une feuille de route de médecine de précision (pharmacogénomique, décision partagée, plans de soins électroniques interopérables, télésanté) pour réduire les inégalités de prise en charge de la douleur chez les personnes âgées rurales, illustrée par des cas cliniques de phénoconversion non reconnue ; il ne s'agit pas d'une étude expérimentale testant un effet causal.","niveau_de_preuve_et_limites":"Il s'agit d'un article de synthèse narrative / roadmap conceptuel reposant sur des illustrations de cas cliniques et une vignette d'implémentation, sans échantillon quantitatif, sans groupe contrôle ni données statistiques. Le niveau de preuve est donc faible (narratif, basé sur l'expertise et des cas illustratifs) ; aucune limite méthodologique chiffrée n'est précisée dans le résumé.","angle_brana_sana":"Le sujet porte sur la gestion pharmacologique de la douleur chez des personnes âgées rurales via la pharmacogénomique et l'infrastructure de décision clinique — hors du champ d'action concret de Braña Sana (bain de forêt, repos, travail manuel, mindfulness, nutrition). Aucun lien direct et honnête avec les activités du centre ne se justifie.","pertinence_brana_sana":0,"doi":"10.3389/fpain.2026.1883083","lien":"https://pubmed.ncbi.nlm.nih.gov/42952811/","source":"PubMed","pmid":"42952811","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Strengthening public universities in low- and middle-income countries to improve global health equity.","auteurs":"Owolabi Mayowa, Ovbiagele Bruce","date":"2026 Dec 12","type_etude":"autre","mecanisme_evalue":"Aucun mécanisme physiologique ou psychologique évalué — il s'agit d'une analyse de politique de santé publique et de systèmes de formation/recherche (capacité institutionnelle, écosystème de connaissance, équité en santé mondiale).","resultat_principal":"Les auteurs plaident, sous forme d'avis/position (non d'étude empirique), pour un renforcement des universités publiques des pays à revenu faible et intermédiaire via des partenariats équitables avec des institutions de pays à revenu élevé, afin de soutenir la formation du personnel de santé et le développement de solutions de santé de précision adaptées localement.","niveau_de_preuve_et_limites":"Il ne s'agit pas d'une étude avec données empiriques, méthodologie, échantillon ou groupe contrôle — c'est un article d'opinion/position sur les politiques de santé et d'enseignement supérieur. Aucune limite méthodologique n'est mentionnée dans le résumé car aucune donnée primaire n'est présentée ; non précisé dans le résumé au-delà de cette nature argumentative.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1016/j.neuros.2026.100070","lien":"https://pubmed.ncbi.nlm.nih.gov/42948750/","source":"PubMed","pmid":"42948750","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Next-Generation Functional Nanoplatforms: Engineering Plant-Derived Extracellular Vesicles for Targeted Bioactive Delivery and Health Applications.","auteurs":"Awlqadr Farhang Hameed, Saeed Mohammed N, Ramddan Ammar Badran, Sdiq Ahmad F Hama, Hama Hamza Kamaran, Hossain Md Sakhawot, Noreen Sobia, Raza Hassan, Kiss Attila Péter","date":"2026 Oct 19","type_etude":"revue systématique","mecanisme_evalue":"Biogenèse, architecture moléculaire et cargaison (lipides, protéines, microARN, phytochimiques) des vésicules extracellulaires d'origine végétale (PDEVs), et leurs effets biologiques potentiels (anti-inflammatoire, antioxydant, anti-cancer, modulation du microbiote intestinal)","resultat_principal":"Cette revue synthétise les connaissances sur les PDEVs comme nanocarriers naturels pour la délivrance de bioactifs, nutraceutiques et probiotiques, en soulignant leur biocompatibilité et stabilité variables selon la source végétale et la méthode d'isolation, sans fournir de preuve clinique d'efficacité chez l'humain.","niveau_de_preuve_et_limites":"Revue narrative/technique (pas une méta-analyse quantitative) compilant des données précliniques et méthodologiques hétérogènes ; les auteurs signalent eux-mêmes que les propriétés des PDEVs dépendent fortement de la source végétale, de la méthode d'isolation, du cargo, de la formulation et du modèle expérimental utilisé, ce qui limite la généralisation des résultats ; des barrières majeures de scalabilité, standardisation et pureté sont explicitement mentionnées comme obstacles à la translation industrielle ; aucune donnée clinique humaine n'est rapportée dans le résumé.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.3390/molecules31203754","lien":"https://pubmed.ncbi.nlm.nih.gov/42943823/","source":"PubMed","pmid":"42943823","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"From Association to Action: Personalizing Lifestyle Interventions in Multiple Sclerosis-A Critical Narrative Review","auteurs":"Caminero Ana Belén","date":"2026 Oct 09","type_etude":"revue systématique","mecanisme_evalue":"Facteurs de mode de vie (activité physique, tabac, obésité/santé cardiométabolique, alimentation, sommeil, stress psychologique, vitamine D/exposition solaire, réserve cognitive, alcool) et leur rôle pronostique/thérapeutique dans la sclérose en plaques (SEP)","resultat_principal":"La revue établit que, parmi les facteurs de mode de vie étudiés dans la SEP, seuls l'arrêt du tabac et l'activité physique disposent de preuves suffisamment solides pour justifier une action clinique directe ; pour les autres domaines (alimentation, sommeil, stress, vitamine D, réserve cognitive, alcool), il existe un écart important entre l'association pronostique observée et la preuve d'un bénéfice clinique démontré suite à une intervention ciblée.","niveau_de_preuve_et_limites":"Revue narrative critique (non systématique au sens strict), qui par nature synthétise une littérature hétérogène sans méta-analyse quantitative propre ; l'autrice souligne elle-même que la force et la complétude des preuves varient fortement selon les domaines examinés, et que l'association statistique observée dans de nombreux domaines ne constitue pas une preuve d'effet causal ni de modification du cours de la maladie. Le résumé ne précise pas de taille d'échantillon ni de méthodologie de sélection des études incluses (non précisé dans le résumé).","angle_brana_sana":"Cette revue conceptuelle sur la personnalisation des interventions de mode de vie (activité physique, sommeil, stress, nutrition) pourrait éclairer la conception de programmes Braña Sana destinés à des publics avec pathologies chroniques, en rappelant la nécessité de distinguer bénéfice général pour la santé et preuve d'effet spécifique sur une maladie — utile notamment pour cadrer honnêtement la communication autour des ateliers bien-être, sans promettre d'effet thérapeutique non démontré sur une pathologie précise comme la SEP.","pertinence_brana_sana":2,"doi":"10.3390/jpm16100523","lien":"https://pubmed.ncbi.nlm.nih.gov/42930798/","source":"PubMed","pmid":"42930798","thematique_id":"prevention-personnalisee","thematique":"Santé préventive & médecine personnalisée","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"}]</script>
<script id="theme-meta" type="application/json">{"shinrin-yoku":{"label":"Bain de forêt / shinrin-yoku","color":{"light":"#2a78d6","dark":"#3987e5"}},"sommeil":{"label":"Repos / sommeil","color":{"light":"#eb6834","dark":"#d95926"}},"manuel":{"label":"Retour au manuel","color":{"light":"#1baf7a","dark":"#199e70"}},"mindfulness":{"label":"Mindfulness & performance mentale","color":{"light":"#eda100","dark":"#c98500"}},"nutrition-longevite":{"label":"Nutrition & science de la longévité","color":{"light":"#e87ba4","dark":"#d55181"}},"prevention-personnalisee":{"label":"Santé préventive & médecine personnalisée","color":{"light":"#008300","dark":"#008300"}},"_non-classe":{"label":"Non classé","color":{"light":"#898781","dark":"#898781"}}}</script>
<script>
(function () {
  const fiches = JSON.parse(document.getElementById('fiches-data').textContent);
  const themeMeta = JSON.parse(document.getElementById('theme-meta').textContent);

  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

  function themeColor(id) {
    const meta = themeMeta[id] || themeMeta['_non-classe'];
    return isDark() ? meta.color.dark : meta.color.light;
  }

  // --- thème clair/sombre ---
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    render();
  });

  // --- dates de run disponibles (plus récent en premier) ---
  const runDates = [...new Set(fiches.map((f) => f.ajoute_le).filter(Boolean))].sort().reverse();
  const runSelect = document.getElementById('runSelect');
  const allOption = document.createElement('option');
  allOption.value = '__all__';
  allOption.textContent = 'Toute la base (' + fiches.length + ' fiches)';
  runSelect.appendChild(allOption);
  runDates.forEach((d) => {
    const opt = document.createElement('option');
    opt.value = d;
    const n = fiches.filter((f) => f.ajoute_le === d).length;
    opt.textContent = d + ' (' + n + ' nouvelle' + (n > 1 ? 's' : '') + ')';
    runSelect.appendChild(opt);
  });
  if (runDates.length) runSelect.value = runDates[0];

  // --- filtre types d'étude ---
  const typeSelect = document.getElementById('typeSelect');
  [...new Set(fiches.map((f) => f.type_etude).filter(Boolean))].sort().forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  });

  // --- état des filtres ---
  const state = { themes: new Set(), search: '', type: '', onlyAngle: false };
  const expanded = new Set();

  const themeChipsEl = document.getElementById('themeChips');
  const searchEl = document.getElementById('search');
  const onlyAngleEl = document.getElementById('onlyAngle');
  const listEl = document.getElementById('list');
  const countLineEl = document.getElementById('countLine');

  runSelect.addEventListener('change', render);
  typeSelect.addEventListener('change', () => { state.type = typeSelect.value; render(); });
  searchEl.addEventListener('input', () => { state.search = searchEl.value.trim().toLowerCase(); render(); });
  onlyAngleEl.addEventListener('change', () => { state.onlyAngle = onlyAngleEl.checked; render(); });
  document.getElementById('expandAll').addEventListener('click', () => {
    currentVisible().forEach((f) => expanded.add(f._key));
    render();
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    expanded.clear();
    render();
  });

  fiches.forEach((f, i) => { f._key = (f.doi || f.titre || '') + '::' + i; });

  function currentRunFiches() {
    const val = runSelect.value;
    if (val === '__all__') return fiches;
    return fiches.filter((f) => f.ajoute_le === val);
  }

  function currentVisible() {
    let list = currentRunFiches();
    if (state.themes.size) list = list.filter((f) => state.themes.has(f.thematique_id));
    if (state.type) list = list.filter((f) => f.type_etude === state.type);
    if (state.onlyAngle) list = list.filter((f) => (f.angle_brana_sana || '').trim().length > 0);
    if (state.search) {
      const q = state.search;
      list = list.filter((f) =>
        (f.titre || '').toLowerCase().includes(q) ||
        (f.auteurs || '').toLowerCase().includes(q) ||
        (f.resultat_principal || '').toLowerCase().includes(q) ||
        (f.mecanisme_evalue || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function renderChips() {
    const runFiches = currentRunFiches();
    const counts = {};
    runFiches.forEach((f) => { counts[f.thematique_id] = (counts[f.thematique_id] || 0) + 1; });
    themeChipsEl.innerHTML = '';
    Object.keys(themeMeta).forEach((id) => {
      const n = counts[id] || 0;
      if (n === 0 && !state.themes.has(id)) return;
      const chip = document.createElement('div');
      chip.className = 'chip' + (state.themes.has(id) ? ' active' : '');
      chip.innerHTML = '<span class="dot" style="background:' + themeColor(id) + '"></span>' +
        themeMeta[id].label + ' <span class="count">' + n + '</span>';
      chip.addEventListener('click', () => {
        if (state.themes.has(id)) state.themes.delete(id); else state.themes.add(id);
        render();
      });
      themeChipsEl.appendChild(chip);
    });
  }

  function fmtDate(d) {
    return d || '—';
  }

  function renderList() {
    const visible = currentVisible();
    countLineEl.textContent = visible.length + ' fiche' + (visible.length > 1 ? 's' : '') +
      (state.themes.size || state.type || state.onlyAngle || state.search ? ' (filtrées)' : '');
    listEl.innerHTML = '';
    if (!visible.length) {
      listEl.innerHTML = '<div class="empty">Aucune fiche ne correspond à ces filtres.</div>';
      return;
    }
    const byTheme = {};
    visible.forEach((f) => {
      (byTheme[f.thematique_id] = byTheme[f.thematique_id] || []).push(f);
    });
    Object.keys(byTheme)
      .sort((a, b) => (themeMeta[a]?.label || '').localeCompare(themeMeta[b]?.label || ''))
      .forEach((id) => {
        const section = document.createElement('div');
        section.className = 'section-title';
        section.textContent = (themeMeta[id]?.label || id) + ' — ' + byTheme[id].length;
        listEl.appendChild(section);
        // Les fiches avec un angle Braña Sana concret remontent en tête, triées par
        // pertinence décroissante — pour repérer vite ce qui compte parmi 60+ articles.
        byTheme[id]
          .slice()
          .sort((a, b) => (b.pertinence_brana_sana || 0) - (a.pertinence_brana_sana || 0))
          .forEach((f) => listEl.appendChild(renderCard(f, id)));
      });
  }

  function renderCard(f, themeId) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--card-color', themeColor(themeId));
    const open = expanded.has(f._key);

    const head = document.createElement('div');
    head.className = 'card-head';
    const pertinence = f.angle_brana_sana ? (f.pertinence_brana_sana || 0) : null;
    head.innerHTML =
      '<p class="card-title">' + escapeHtml(f.titre) + '</p>' +
      (pertinence ? '<span class="badge badge-pertinence">pertinence ' + pertinence + '/5</span>' : '') +
      '<span class="badge">' + escapeHtml(f.type_etude || '?') + '</span>';
    card.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'meta-line';
    meta.textContent = [f.auteurs, f.date, f.ajoute_le ? 'ajouté le ' + f.ajoute_le : null]
      .filter(Boolean).join(' · ');
    card.appendChild(meta);

    if (!open) {
      const snippet = document.createElement('div');
      snippet.className = 'snippet';
      snippet.textContent = f.resultat_principal || '';
      card.appendChild(snippet);
    } else {
      const details = document.createElement('dl');
      details.className = 'details open';
      const rows = [
        ['Mécanisme évalué', f.mecanisme_evalue],
        ['Résultat principal', f.resultat_principal],
        ['Niveau de preuve et limites', f.niveau_de_preuve_et_limites],
        ['Angle Braña Sana', f.angle_brana_sana || '(aucun angle retenu)'],
      ];
      rows.forEach(([label, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        dd.textContent = value || '—';
        details.appendChild(dt);
        details.appendChild(dd);
      });
      if (f.lien) {
        const dt = document.createElement('dt');
        dt.textContent = 'Source';
        const dd = document.createElement('dd');
        const a = document.createElement('a');
        a.href = f.lien;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = f.lien;
        dd.appendChild(a);
        details.appendChild(dt);
        details.appendChild(dd);
      }
      card.appendChild(details);
    }

    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      if (expanded.has(f._key)) expanded.delete(f._key); else expanded.add(f._key);
      render();
    });
    return card;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function render() {
    renderChips();
    renderList();
  }

  render();
})();
</script>
</body>
</html>
