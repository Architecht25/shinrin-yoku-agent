<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille La Borbolla — tableau de bord</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 16px 12px;
    max-width: 980px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 16px; }
  .theme-toggle {
    position: absolute; top: 16px; right: 16px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; color: var(--text-primary);
    font-size: 0.8rem; cursor: pointer;
  }
  .controls {
    max-width: 980px; margin: 0 auto; padding: 0 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type="text"] {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 0.85rem;
  }
  input[type="text"] { flex: 1; min-width: 200px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 11px; font-size: 0.78rem; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
    user-select: none;
  }
  .chip.active { color: var(--text-primary); font-weight: 600; border-color: currentColor; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip .count { color: var(--text-muted); }
  .chip.active .count { color: inherit; }
  label.checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
  .buttons { display: flex; gap: 8px; margin-left: auto; }
  button.plain {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer;
  }
  main { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  .count-line { color: var(--text-secondary); font-size: 0.85rem; margin: 6px 0 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 4px solid var(--card-color, var(--gridline));
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer;
  }
  .card-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .card-title { font-size: 0.95rem; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 200px; }
  .badge {
    font-size: 0.7rem; padding: 2px 7px; border-radius: 999px;
    background: var(--gridline); color: var(--text-secondary); white-space: nowrap;
  }
  .badge-pertinence {
    background: rgba(12,163,12,0.16); color: #0ca30c; font-weight: 600;
  }
  .meta-line { color: var(--text-secondary); font-size: 0.78rem; margin-top: 4px; }
  .snippet { color: var(--text-secondary); font-size: 0.85rem; margin-top: 6px; }
  .details { display: none; margin-top: 10px; border-top: 1px solid var(--gridline); padding-top: 10px; font-size: 0.85rem; }
  .details.open { display: block; }
  .details dt { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; margin-top: 8px; }
  .details dd { margin: 2px 0 0; color: var(--text-primary); }
  .details a { color: var(--card-color, #2a78d6); }
  .empty { color: var(--text-muted); text-align: center; padding: 40px 0; }
  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 20px 0 8px; }
</style>
</head>
<body>
<header style="position: relative;">
  <button class="theme-toggle" id="themeToggle">🌓 thème</button>
  <h1>Veille scientifique — La Borbolla</h1>
  <p class="subtitle">Tableau de bord de tri des fiches extraites depuis PubMed.</p>
</header>
<div class="controls">
  <div class="row">
    <select id="runSelect"></select>
    <input type="text" id="search" placeholder="Rechercher (titre, auteurs, résultat…)">
    <div class="buttons">
      <button class="plain" id="expandAll">Tout déplier</button>
      <button class="plain" id="collapseAll">Tout replier</button>
    </div>
  </div>
  <div class="row" id="themeChips"></div>
  <div class="row">
    <select id="typeSelect"><option value="">Tous types d'étude</option></select>
    <label class="checkbox"><input type="checkbox" id="onlyAngle"> avec angle Braña Sana renseigné</label>
  </div>
</div>
<main>
  <div class="count-line" id="countLine"></div>
  <div id="list"></div>
</main>
<script id="fiches-data" type="application/json">[{"titre":"Association between chronotype, eating behaviors, and Mediterranean diet adherence among overweight and obese women.","auteurs":"Tuysuz Betul, Sayin Kubra","date":"2026 Nov 12","type_etude":"étude observationnelle","mecanisme_evalue":"Chronotype (préférence circadienne) et son association avec les comportements alimentaires et l'adhésion au régime méditerranéen","resultat_principal":"Chez des femmes en surpoids/obèses, le chronotype du matin est associé à une meilleure adhésion au régime méditerranéen, tandis que le chronotype du soir est associé à davantage d'alimentation émotionnelle et externe — il s'agit d'associations statistiques transversales, non d'une preuve d'effet causal.","niveau_de_preuve_et_limites":"Étude observationnelle transversale sur 181 femmes en surpoids/obèses recrutées dans une seule clinique nutritionnelle en Turquie ; échantillon de taille modérée et population spécifique limitant la généralisabilité ; design transversal ne permettant pas d'établir de causalité ; absence de groupe contrôle au sens expérimental ; repose sur des questionnaires auto-rapportés (MEQ, DEBQ, MEDAS) sujets à des biais de déclaration ; aucune autre limite méthodologique n'est précisée dans le résumé.","angle_brana_sana":"Ce résultat illustre un lien entre rythme circadien, comportements alimentaires et alimentation saine, pertinent pour un programme intégrant repos/sommeil et nutrition : sensibiliser les participants (notamment chronotypes du soir) à l'alimentation émotionnelle et proposer un accompagnement nutritionnel adapté au chronotype dans le cadre des séjours.","pertinence_brana_sana":2,"doi":"10.1177/02601060261505230","lien":"https://pubmed.ncbi.nlm.nih.gov/43017882/","source":"PubMed","pmid":"43017882","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Expert consensus on light therapy for the treatment of insomnia disorder (2026 edition)","auteurs":"Chinese Sleep Research Society, Sleep Disorders Rehabilitation Professional Committee of Chinese Association of Rehabilitation Medicine, Community and Primary Care Working Committee of Chinese Sleep Research Society (panel d'experts multidisciplinaire)","date":"2026 Nov 10","type_etude":"autre","mecanisme_evalue":"Modulation de la phase circadienne et du niveau de vigilance via la luminothérapie, dans le cadre du traitement du trouble de l'insomnie","resultat_principal":"Consensus d'experts basé sur le cadre GRADE formulant 27 recommandations sur les mécanismes, indications cliniques, paramètres de traitement, évaluation de l'efficacité, thérapies combinées, contre-indications et gestion des effets indésirables de la luminothérapie pour le traitement de l'insomnie, y compris pour des populations spécifiques (femmes enceintes/post-partum, personnes âgées, adolescents) ; il s'agit d'un document de synthèse et de recommandations, non d'une étude princeps mesurant un effet.","niveau_de_preuve_et_limites":"Document de consensus d'experts (pas un essai clinique ni une méta-analyse quantitative) ; les auteurs signalent eux-mêmes que les études sous-jacentes présentent des échantillons de petite taille, une hétérogénéité importante des populations étudiées, des paramètres d'intervention non standardisés, et des durées de suivi relativement courtes. Le niveau de preuve des recommandations individuelles n'est pas détaillé dans le résumé (grades GRADE non précisés).","doi":"10.3760/cma.j.cn112137-20260602-01440","lien":"https://pubmed.ncbi.nlm.nih.gov/43010753/","source":"PubMed","pmid":"43010753","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Sleep Patterns, Sleep Hygiene, and Behavioral Problems in Primary School Children: A Cross-Sectional Study in İzmir, Turkey","auteurs":"Saykan Balatacı Ece, Gokdemir Ozden, Limnili Gizem, Balatacı Tugrul, Ozcakar Nilgün","date":"2026 Nov 10","type_etude":"autre","mecanisme_evalue":"Non précisé dans le résumé fourni (incohérence entre titre et résumé)","resultat_principal":"Impossible à déterminer : le résumé fourni ne correspond pas au titre annoncé (il décrit une étude sur l'intégration sensorielle chez des nourrissons de 7 à 36 mois, et non une étude sur le sommeil et les problèmes comportementaux chez des enfants d'école primaire).","niveau_de_preuve_et_limites":"Non précisé dans le résumé — incohérence manifeste entre le titre (étude transversale sur le sommeil, les habitudes de sommeil et les problèmes comportementaux chez des enfants d'école primaire à İzmir) et le contenu de l'abstract fourni (étude rétrospective observationnelle sur des interventions d'intégration sensorielle chez des enfants de 7-36 mois, avec groupe intervention n=30 et groupe contrôle n=30). Il n'est donc pas possible d'extraire de façon fiable le mécanisme, le résultat ou les limites réels de l'étude annoncée par le titre sans un résumé correspondant.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1177/00099228261493826","lien":"https://pubmed.ncbi.nlm.nih.gov/43010161/","source":"PubMed","pmid":"43010161","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Parental knowledge, attitudes, and practices regarding healthy sleep hygiene among children in Palestine.","auteurs":"Eleiwi Malak, Daifallah Aiman, Malhis Lana, Malhis Dima, Omar Ruba, Saayda Noora, Saayda Enas, Jaradat Haya Adel","date":"2026 Jul 27","type_etude":"étude observationnelle","mecanisme_evalue":"Connaissances, attitudes et pratiques parentales concernant l'hygiène du sommeil des enfants (durée de sommeil, environnement de sommeil, pratiques au coucher)","resultat_principal":"Les parents palestiniens de cet échantillon montraient de bonnes connaissances générales sur le sommeil mais une mise en pratique plus modeste des habitudes d'hygiène du sommeil ; le niveau d'éducation parental et l'accès antérieur à l'information sur le sommeil étaient associés à de meilleures connaissances, tandis que les contraintes économiques et le stress familial récent étaient associés à de moins bonnes pratiques et connaissances — ces associations sont statistiques et non des preuves d'effet causal.","niveau_de_preuve_et_limites":"Étude observationnelle transversale par questionnaire en ligne (Google Forms), échantillon de 459 participants, à 96,7% des mères (biais de représentativité du genre parental). Données auto-rapportées (biais de déclaration), durées de sommeil et âges implausibles traités comme données manquantes. Analyses bivariées non-paramétriques et régression linéaire multiple permettent d'identifier des associations mais ne permettent pas d'établir de causalité. Pas de groupe contrôle externe (étude descriptive/corrélationnelle). Limites non détaillées au-delà de ces éléments méthodologiques mentionnés dans le résumé.","doi":"10.1186/s12889-026-28679-1","lien":"https://pubmed.ncbi.nlm.nih.gov/43004339/","source":"PubMed","pmid":"43004339","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Rheumatoid Arthritis and Sleep Disturbances: A Narrative Review of Bidirectional Mechanisms.","auteurs":"Fan Xinguo, Zhao Fuyu, Cheng Yahui, Zhang Caihong, Zhu Xijun, Shen Zhongming, He Dongyi","date":"2026 11 04","type_etude":"revue systématique","mecanisme_evalue":"Relation bidirectionnelle entre polyarthrite rhumatoïde et troubles du sommeil : signalisation inflammatoire périphérie-cerveau, métabolisme des monoamines, rythme circadien, axe hypothalamo-hypophyso-surrénalien, hyperactivation autonome, sensibilisation centrale","resultat_principal":"Cette revue narrative synthétise des preuves cliniques et mécanistiques suggérant une association bidirectionnelle entre l'inflammation/douleur liée à la polyarthrite rhumatoïde et les troubles du sommeil, sans établir de causalité directe démontrée.","niveau_de_preuve_et_limites":"Revue narrative (non systématique au sens strict) ; les auteurs précisent explicitement que la plupart des preuves disponibles sont transversales, reposent sur des mesures auto-rapportées du sommeil, ou proviennent de petites études d'intervention, ce qui rend incertaines la causalité directe et la contribution indépendante de chaque voie mécanistique. Les auteurs appellent à des cohortes longitudinales multimodales et des essais suffisamment puissants avec mesures objectives et auto-rapportées du sommeil.","angle_brana_sana":"Le lien entre inflammation/douleur chronique et perturbation du sommeil (et réciproquement) peut éclairer la conception de programmes de repos et de régulation du rythme circadien à Braña Sana pour des publics souffrant de douleurs chroniques ou de troubles inflammatoires, en complément (non substitutif) d'une prise en charge médicale ciblée de la maladie et du type de trouble du sommeil (insomnie, apnée, syndrome des jambes sans repos).","pertinence_brana_sana":2,"doi":"10.2147/JIR.S629423","lien":"https://pubmed.ncbi.nlm.nih.gov/43001183/","source":"PubMed","pmid":"43001183","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Exploring Australian child and youth mental health occupational therapists' perception and utilisation of creative activities: A survey snapshot.","auteurs":"Forbes Hannah, Lo Adam, Steele Michael, Harrington Rosamund","date":"2026 Nov 26","type_etude":"étude observationnelle","mecanisme_evalue":"Perception et utilisation des activités créatives comme médium thérapeutique en ergothérapie (santé mentale enfants/jeunes), incluant confiance professionnelle et besoins de formation","resultat_principal":"Les ergothérapeutes australiens en santé mentale infanto-juvénile perçoivent et utilisent positivement les activités créatives (78% les jugent très efficaces, 66% les utilisent plusieurs fois par semaine), mais malgré une confiance élevée rapportée (67%), 97% identifient un besoin de formation supplémentaire et 64% ne sont pas satisfaits de leur usage actuel.","niveau_de_preuve_et_limites":"Étude transversale par sondage (enquête descriptive), échantillon très réduit (33 réponses complètes), échantillonnage de convenance (non représentatif), analyse mixte quantitative (statistiques descriptives, tests de Mann-Whitney non paramétriques) et qualitative (analyse de contenu inductive). Pas de groupe contrôle, pas de mesure d'effet clinique direct — il s'agit de perceptions autodéclarées, non d'une preuve d'efficacité clinique des activités créatives elles-mêmes.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1177/03080226251412760","lien":"https://pubmed.ncbi.nlm.nih.gov/43036624/","source":"PubMed","pmid":"43036624","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Engaging clergy and congregants as \"lay-scientists\" to promote community health and wellbeing in rural and urban Alaska: a community-engaged pilot study.","auteurs":"West Nathan T, Waddell Megan, King Diane K, Le Shirley T, Portillo Sofia A, Day Kelsey R, Bateman Beverly R, Parker Undra, Reijns Nico, King Abby C","date":"2026-10-29","type_etude":"étude observationnelle","mecanisme_evalue":"Engagement communautaire participatif (méthode \"Our Voice\" de citoyen-scientifique) pour évaluer l'environnement bâti et promouvoir l'activité physique et une alimentation saine au sein de communautés religieuses","resultat_principal":"L'adaptation de la méthode participative \"Our Voice\" à trois églises d'Alaska a permis à des équipes de clergé et de paroissiens (\"lay-scientists\") de collecter 216 photos géolocalisées avec narratifs, aboutissant à des thèmes et plans d'action locaux (évaluations des besoins de santé, signalétique santé, initiatives de jardinage et sommets santé) visant à promouvoir la santé au sein et au-delà de la congrégation.","niveau_de_preuve_et_limites":"Étude pilote qualitative/descriptive sur seulement 3 églises, sans groupe contrôle ni mesure d'effet sur des indicateurs de santé réels ; les résultats rapportés sont des données de processus (engagement, thèmes identifiés, plans d'action) et non des preuves d'efficacité sur la santé des participants. L'échantillon est restreint et contextuellement spécifique (communautés confessionnelles rurales/urbaines d'Alaska), limitant la généralisabilité.","doi":"10.3389/fpubh.2026.1737078","lien":"https://pubmed.ncbi.nlm.nih.gov/43022345/","source":"PubMed","pmid":"43022345","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Community-based infectious disease prevention awareness through children's creative works: outreach embedded in school-based action research.","auteurs":"Oura Asae, Yako-Suketomo Hiroko, Naito Yukiko, Nakata Mayu, Hayashi Tsugushi, Ohnishi Hirofumi","date":"2026-10-28","type_etude":"autre","mecanisme_evalue":"Sensibilisation à la prévention des maladies infectieuses via des activités créatives (posters, Senryu) en milieu scolaire ; engagement communautaire et partenariat académique local","resultat_principal":"Un projet d'action research de 2018 à 2024 mené à Sapporo montre qu'une collaboration soutenue avec les écoles, en particulier via les enseignants Yogo (professionnels de santé scolaire), a permis d'intégrer durablement l'éducation à la santé publique (prévention des maladies infectieuses) dans les pratiques scolaires routinières et de construire un partenariat communauté-recherche à long terme ; il s'agit d'une description de processus/outreach et non d'une mesure d'effet sur des indicateurs de santé.","niveau_de_preuve_et_limites":"Il s'agit d'un rapport de projet d'action research/outreach descriptif, sans groupe contrôle ni mesure quantitative d'impact sanitaire rapportée dans le résumé ; les résultats portent sur la mise en œuvre et la pérennisation du partenariat plutôt que sur une évaluation causale de l'efficacité en matière de prévention des maladies infectieuses. Aucune taille d'échantillon précise (nombre d'écoles, d'enfants, de contributions) n'est mentionnée dans le résumé ; non précisé dans le résumé pour les aspects de biais méthodologiques spécifiques.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.3389/fpubh.2026.1954389","lien":"https://pubmed.ncbi.nlm.nih.gov/43017091/","source":"PubMed","pmid":"43017091","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"In what context and by which mechanisms can creative arts interventions improve wellbeing in older people? A realist review from UK community settings.","auteurs":"Caulfield A, Ferrey A, Roberts N, Leslie-Spinks J, Alvesson HM, Wong G","date":"2026 Nov 10","type_etude":"revue systématique","mecanisme_evalue":"Bien-être émotionnel, social et eudémonique chez les personnes âgées via la participation à des activités artistiques créatives (mécanismes d'autonomie, flow psychologique, socialisation, facilitation)","resultat_principal":"L'impact positif des programmes d'arts créatifs communautaires sur le bien-être des adultes de 65 ans et plus est maximisé par une fréquentation soutenue, une socialisation non contraignante, une facilitation compétente, des thèmes artistiques émotionnellement résonnants et des expériences favorisant l'état de flow ; les freins incluent les obstacles logistiques, la peur d'être infantilisé/stéréotypé et la perception d'exclusivité ou d'exigence de compétence préalable.","niveau_de_preuve_et_limites":"Revue réaliste (realist review) basée sur seulement 9 articles inclus (7 articles évalués par les pairs et 2 littérature grise), avec une forte concentration géographique (89% des programmes en Angleterre), limitant la généralisabilité. Il s'agit d'une synthèse de configurations contexte-mécanisme-résultat (CMOC) issue de littérature hétérogène et non d'un essai contrôlé ; les résultats relèvent d'associations théoriques et de modélisation causale plutôt que d'une preuve expérimentale d'effet. Les auteurs ne détaillent pas de limites supplémentaires spécifiques au-delà de la taille réduite de l'échantillon d'études et de la portée géographique restreinte.","doi":"10.1177/17579139261495898","lien":"https://pubmed.ncbi.nlm.nih.gov/43010724/","source":"PubMed","pmid":"43010724","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"The health and wellbeing impacts of creative activity for people who have experienced homelessness: a rapid scoping review","auteurs":"Riley F, Cooper C, Lhussier M, Bilby C, Astley T","date":"2026 Nov 10","type_etude":"revue systématique","mecanisme_evalue":"Bien-être physique, psychologique, émotionnel et social (stress, humeur, estime de soi, résilience, connexion sociale, identité positive) via des activités créatives (arts, musique, jardinage, exercice)","resultat_principal":"Cette revue de portée rapide (33 études, majoritairement qualitatives) montre des associations entre participation à des activités créatives et des améliorations autorapportées du bien-être physique, psychologique, émotionnel et social chez des personnes ayant vécu l'itinérance, sans établir de preuve causale d'effet.","niveau_de_preuve_et_limites":"Revue de portée (scoping review) basée sur 33 études hétérogènes (4 quantitatives, 4 mixtes, 25 qualitatives), principalement nord-américaines ; les auteurs signalent que les données quantitatives sont limitées et centrées sur la santé physique, les preuves les plus solides étant qualitatives (entretiens, groupes de discussion) donc sujettes à des biais subjectifs et de sélection ; les auteurs appellent à davantage de recherche pour comprendre les effets selon les types d'activités et les populations dans le temps, ce qui souligne l'absence de preuve causale robuste à ce stade.","angle_brana_sana":"Les activités créatives et manuelles (jardinage, arts, musique) favorisent l'estime de soi, la reconnexion sociale et l'identité positive — des bénéfices alignés avec les ateliers manuels et de jardin médicinal proposés par Braña Sana, bien que la population étudiée (personnes en situation d'itinérance) diffère du public cible habituel du centre.","pertinence_brana_sana":2,"doi":"10.1177/17579139261502674","lien":"https://pubmed.ncbi.nlm.nih.gov/43006694/","source":"PubMed","pmid":"43006694","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Supporting health and wellbeing through creativity: a qualitative study with parents in economically deprived coastal communities.","auteurs":"Kennedy S, Sawyer A, Boseley R, Salami-Oru T, Johnson H, Aicken C, Sherriff N","date":"2026 Nov 10","type_etude":"étude observationnelle","mecanisme_evalue":"Bien-être et santé mentale perçue en lien avec l'engagement dans des activités créatives (identité, connexion sociale, gestion du stress)","resultat_principal":"Les parents vivant dans des zones côtières défavorisées rapportent que les activités créatives (quotidiennes ou artistiques/culturelles) soutiennent leur santé mentale, leur identité et leurs liens sociaux, mais ils font face à des obstacles (coût, transport, garde d'enfants, manque de confiance) limitant cet engagement.","niveau_de_preuve_et_limites":"Étude qualitative transversale (entretiens semi-structurés + photo-élicitation) auprès de 28 parents (27 mères) de trois villes côtières anglaises, menée sur une courte période (février-mars 2025). Échantillon restreint et très majoritairement féminin, résultats basés sur du ressenti déclaratif sans groupe témoin ni mesure quantitative, non généralisables au-delà du contexte local étudié ; pas de causalité établie entre créativité et amélioration objective de la santé.","angle_brana_sana":"L'étude souligne la valeur perçue des activités créatives \"du quotidien\" (artisanat, cuisine, ateliers manuels) pour le bien-être mental et l'identité — cela peut nourrir la réflexion sur l'accessibilité et la communication autour des ateliers manuels proposés à Braña Sana, notamment pour des publics ayant peu de confiance ou de moyens, en valorisant des activités simples plutôt qu'exclusivement artistiques.","pertinence_brana_sana":2,"doi":"10.1177/17579139261497958","lien":"https://pubmed.ncbi.nlm.nih.gov/43006679/","source":"PubMed","pmid":"43006679","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Interactive Gardening Intervention for Preschoolers With Developmental Delays: A Family-Centered Feasibility Study","auteurs":"Pan Chieh-Yu, Tsai Yuan-Ching, Hong Jia-Pei, Kuo Fen-Ling","date":"2026 Nov 05","type_etude":"étude observationnelle","mecanisme_evalue":"Fonctionnement social, intégration sensorielle, stress parental et sentiment de compétence parentale chez des enfants d'âge préscolaire avec retard de développement et leurs aidants","resultat_principal":"Le fonctionnement social s'est amélioré de façon statistiquement significative dans le groupe ayant suivi l'intervention de jardinage familial (p=.007) mais pas dans le groupe contrôle (p=.269), sans changement significatif sur l'intégration sensorielle ou les indicateurs liés aux aidants ; les aidants ont rapporté satisfaction et perception d'amélioration de l'interaction parent-enfant.","niveau_de_preuve_et_limites":"Étude pilote de faisabilité, conception non randomisée (pretest-posttest avec groupe contrôle), échantillon réduit (60 dyades, 30 par groupe), effet mesuré uniquement sur le fonctionnement social (significatif mais avec écarts-types très larges relatifs à la moyenne : 3.34 ± 9.47), absence d'effet significatif sur plusieurs autres mesures (intégration sensorielle, stress et compétence parentale), durée d'intervention courte (6 semaines). Les auteurs présentent explicitement les résultats comme préliminaires et visant la faisabilité plutôt qu'une preuve d'efficacité robuste.","angle_brana_sana":"Bien que l'étude porte sur une population pédiatrique clinique spécifique (enfants avec retard de développement) et un contexte de rééducation ambulatoire, elle illustre un principe transposable : une activité de jardinage structurée et partagée (type \"atelier manuel\"/jardin médicinal) peut favoriser l'engagement, l'interaction et la participation sociale. À utiliser avec prudence car le public et le cadre clinique diffèrent fortement du contexte adulte/bien-être de Braña Sana.","pertinence_brana_sana":1,"doi":"10.1080/01942638.2026.2756903","lien":"https://pubmed.ncbi.nlm.nih.gov/42988743/","source":"PubMed","pmid":"42988743","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"[Experience with art therapy methods for patients with idiopathic scoliosis during the early phase of medical rehabilitation]","auteurs":"Eremushkina S M, Guseva M E, Yatsun N A, Morozova N S","date":"2026 11 3","type_etude":"étude observationnelle","mecanisme_evalue":"Régulation émotionnelle (classification b1521 de la Classification Internationale du Fonctionnement) évaluée via l'expression artistique projective (choix de couleurs et contenu thématique des dessins)","resultat_principal":"Chez 15 patients atteints de scoliose idiopathique, l'analyse qualitative et quantitative des dessins projectifs (technique \"Image de la santé et de la maladie\") a révélé des préférences de couleurs et des thèmes/symboles récurrents associés à leur vécu émotionnel de la maladie, du traitement et de leur état corporel ; il s'agit d'une description de caractéristiques observées, non d'une preuve d'effet thérapeutique.","niveau_de_preuve_et_limites":"Étude observationnelle descriptive sur un très petit échantillon (n=15), sans groupe contrôle ni comparaison statistique mentionnée ; méthode projective à interprétation qualitative, sujette à subjectivité ; aucune limite supplémentaire n'est précisée dans le résumé.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.17116/jnevro202612610171","lien":"https://pubmed.ncbi.nlm.nih.gov/42973256/","source":"PubMed","pmid":"42973256","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"The association between green space and mental health, physical activity, and sedentary behaviour in rural populations: A systematic review.","auteurs":"Roba Hirbo Shore, Biddle Stuart J H, Kalra Anjani, Kolbe-Alexander Tracy","date":"2026 Oct 23","type_etude":"revue systématique","mecanisme_evalue":"Santé mentale (dépression, anxiété), activité physique et comportement sédentaire en lien avec l'exposition aux espaces verts","resultat_principal":"Les associations entre espaces verts et santé mentale/activité physique sont globalement mixtes et hétérogènes, mais les espaces verts privés (ex. jardinage) et de haute qualité sont associés à de meilleurs résultats de santé mentale, et l'accessibilité/qualité des espaces verts est associée positivement à l'activité physique modérée-à-vigoureuse — il s'agit d'associations statistiques, non de preuves d'effet causal.","niveau_de_preuve_et_limites":"25 études incluses sur 4 441 identifiées, dont 80% sont des études transversales (cross-sectional), limitant toute inférence causale. Les auteurs signalent une forte hétérogénéité méthodologique ayant contraint à une synthèse narrative plutôt qu'une méta-analyse. Les résultats sur la santé mentale sont qualifiés de \"mixtes\". Les auteurs appellent explicitement à davantage de recherches longitudinales et qualitatives pour renforcer les conclusions.","angle_brana_sana":"Cette revue soutient l'intérêt du jardinage (espace vert privé, de qualité) comme activité de retour au manuel favorisant à la fois le bien-être mental et l'activité physique en contexte rural — en cohérence avec un atelier jardin médicinal ou potager à Braña Sana, tout en gardant à l'esprit le caractère encore limité et associatif de la preuve.","pertinence_brana_sana":3,"doi":"10.1016/j.anzjph.2026.100606","lien":"https://pubmed.ncbi.nlm.nih.gov/42914876/","source":"PubMed","pmid":"42914876","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Community gardening underpins collective and relational values for urban nature.","auteurs":"Browne Amelia, Hodbod Jennifer, Sait Steven, Yiran Gerald A B, Dzikunu Solomon Quarshie, Dallimer Martin","date":"2026 Nov 17","type_etude":"étude observationnelle","mecanisme_evalue":"Perceptions psychosociales de la nature urbaine et engagement relationnel/biodiversité-santé (via Q-méthodologie, pas de mécanisme physiologique mesuré)","resultat_principal":"L'appartenance à un jardin communautaire est associée à des représentations plus relationnelles et multifonctionnelles de la nature, avec quatre points de vue distincts identifiés (ressource pratique/spirituelle, confort/protection, engagement sélectif lié à la sécurité, espace social/culturel), les préférences étant centrées sur le confort et la familiarité plutôt que sur les bénéfices écologiques, et modulées par le quartier et le genre.","niveau_de_preuve_et_limites":"Étude observationnelle qualitative (Q-méthodologie) sur un échantillon restreint de 60 participants à Accra (Ghana), sans groupe contrôle ni mesure causale ; les résultats reflètent des associations entre appartenance à un jardin et perceptions, et sont spécifiques à un contexte urbain à faible revenu, ce qui limite leur généralisation à d'autres contextes culturels ou géographiques (non précisé si d'autres biais méthodologiques sont signalés par les auteurs).","angle_brana_sana":"Le jardinage communautaire comme espace de travail manuel favorisant une relation incarnée et sociale à la nature pourrait éclairer la conception d'ateliers de jardin médicinal à Braña Sana, en valorisant le lien pratique, sensoriel et communautaire plutôt qu'une approche purement esthétique ou écologique.","pertinence_brana_sana":2,"doi":"10.1016/j.jenvman.2026.131183","lien":"https://pubmed.ncbi.nlm.nih.gov/42892082/","source":"PubMed","pmid":"42892082","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Short-term responses across two sequential plant-based activity sessions: an exploratory fixed-order pilot study.","auteurs":"Chang Li-Li, Ku Yun-Hsien, Chuang Chuen-Yu, Chang Yu-Sen","date":"2026-10-02","type_etude":"étude observationnelle","mecanisme_evalue":"Détresse psychologique (DASS-21), anxiété état (STAI-S), bien-être horticole, variabilité de la fréquence cardiaque (HRV: SDNN, RMSSD), activité EEG frontale","resultat_principal":"Deux sessions d'activités manuelles à base de plantes (artisanat horticole, puis fabrication de baume suivie d'artisanat horticole) ont été associées à des réductions significatives de la détresse (DASS-21) et de l'anxiété état (STAI-S) à court terme, sans différence détectable entre les deux sessions, et avec une augmentation de la HRV (SDNN, RMSSD) ; les résultats EEG n'ont pas résisté à la correction pour comparaisons multiples.","niveau_de_preuve_et_limites":"Étude pilote exploratoire à groupe unique et ordre fixe (sans randomisation ni groupe contrôle), échantillon très réduit (25 participants, 23 ayant complété les deux sessions, avec perte supplémentaire lors des analyses en cas complet pour certaines mesures, ex. n=17 pour DASS-21 en session 2). Les auteurs précisent explicitement que, compte tenu de l'ordre fixe et de l'absence de groupe contrôle, les résultats sont préliminaires et ne constituent pas une preuve causale ou spécifique à la modalité. Les tests d'équivalence (TOST) n'ont été satisfaits qu'à une borne large (±0.50), et les résultats EEG ne sont pas restés significatifs après correction pour multiplicité.","doi":"10.3389/fpsyg.2026.1962154","lien":"https://pubmed.ncbi.nlm.nih.gov/42890974/","source":"PubMed","pmid":"42890974","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Exploring Barriers and Facilitators to Maintaining Cardiovascular Health Among Syrian Refugees: A Qualitative Study in a Refugee Camp Setting.","auteurs":"Alharthi Abeer, Alzahrani Hind, Behnam Rawnaq, Al-Rousan Tala, Himmelfarb Cheryl, Commodore-Mensah Yvonne","date":"2026 Oct 13","type_etude":"étude observationnelle","mecanisme_evalue":"Santé cardiovasculaire et déterminants sociaux associés (activité physique, alimentation, stress psychologique, accès aux soins) chez des réfugiés en camp","resultat_principal":"L'étude identifie, via analyse thématique de focus groups, des freins (contraintes financières, mauvaises conditions de vie, stress psychologique chronique, accès limité aux soins et aux infrastructures sportives, rôles de genre traditionnels) et des facilitateurs (marche, sport informel, jardinage domestique, soutien communautaire, usage d'internet pour l'information santé) à la gestion de la santé cardiovasculaire chez des réfugiés syriens du camp de Zaatari ; il s'agit d'une description qualitative des perceptions et expériences, non d'une mesure d'effet causal sur des indicateurs cardiovasculaires.","niveau_de_preuve_et_limites":"Étude qualitative basée sur des focus groups avec seulement 13 participants dans un seul camp de réfugiés (Zaatari), ce qui limite fortement la généralisabilité ; pas de groupe contrôle ni de mesure quantitative des issues cardiovasculaires ; données déclaratives soumises à biais de traduction/transcription et à l'influence contextuelle du cadre (camp spécifique, population spécifique) ; les limites méthodologiques détaillées (ex. biais de sélection, saturation des données) ne sont pas explicitement discutées dans le résumé au-delà de la description de la méthode de codage.","doi":"10.1111/jan.70770","lien":"https://pubmed.ncbi.nlm.nih.gov/42867091/","source":"PubMed","pmid":"42867091","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Understanding wellbeing together with children from migrant backgrounds living in socio-economically disadvantaged neighborhoods- A participatory photovoice study.","auteurs":"Ramji Rathi, Sterner Therese","date":"2026 Oct 12","type_etude":"étude observationnelle","mecanisme_evalue":"Bien-être subjectif et déterminants sociaux de la santé chez des enfants issus de l'immigration en quartiers défavorisés (sécurité émotionnelle, appartenance, développement personnel)","resultat_principal":"Via une démarche participative (photovoice), les enfants définissent le bien-être selon trois thèmes - se sentir en sécurité et soutenu, appartenance/inclusion, et grandir/se développer - révélant des inégalités dans l'accès à des conditions souvent présumées acquises par les cadres existants ; il s'agit d'une analyse qualitative descriptive des représentations des enfants, non d'une mesure d'effet causal.","niveau_de_preuve_et_limites":"Étude qualitative participative (recherche-action) sur un échantillon restreint de 31 enfants (10-12 ans) dans trois centres de loisirs d'une seule grande ville du sud de la Suède ; pas de groupe contrôle, résultats non généralisables statistiquement, données issues d'auto-rapport et de co-construction thématique par les enfants eux-mêmes, ce qui peut introduire des biais d'interprétation ; le résumé ne précise pas d'autres limites méthodologiques (ex. attrition sur la durée d'un an).","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1186/s12889-026-29910-9","lien":"https://pubmed.ncbi.nlm.nih.gov/42864643/","source":"PubMed","pmid":"42864643","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"A Systematic Review and Meta-Analysis on the Effectiveness of Horticultural Therapy in Cancer Survivors","auteurs":"Obembe Adebimpe, Alfaro Liliana, Wong Haylie, Shelite Anna, Smith Mary, Chipy Nicole","date":"2026 Oct 08","type_etude":"méta-analyse","mecanisme_evalue":"Fonctionnement physique, comportements liés au mode de vie (alimentation), bien-être psychosocial et qualité de vie chez des survivants du cancer","resultat_principal":"Sur 3 essais contrôlés randomisés regroupés en méta-analyse, l'horticulture thérapeutique montre des effets significatifs modérés sur la santé physique (SMD=-0,38), la performance physique (SMD=0,19) et les comportements de mode de vie (SMD=0,67), mais aucun effet significatif sur le bien-être psychosocial ; dans l'ensemble des 8 études (n=634), 7 rapportent une hausse de la consommation de fruits et légumes et la douleur reste inchangée dans 5 études.","niveau_de_preuve_et_limites":"Les auteurs qualifient ces résultats de \"préliminaires\" et soulignent la nécessité d'essais contrôlés plus rigoureux pour confirmer l'efficacité ; la méta-analyse statistique ne repose que sur 3 ECR parmi les 8 études incluses (n total=634), avec une durée d'intervention très variable (6 semaines à 1 an) et des résultats mixtes selon les dimensions évaluées (fonctionnement physique, psychosocial).","angle_brana_sana":"Le jardinage thérapeutique en extérieur illustre un format concret de \"retour au manuel\" pouvant s'intégrer à un atelier de jardin médicinal/potager à Braña Sana, avec un bénéfice documenté sur l'adoption de comportements alimentaires sains et certains aspects physiques, même si l'effet sur le bien-être psychologique reste incertain selon cette étude spécifique sur des survivants du cancer.","pertinence_brana_sana":3,"doi":"10.1177/19437676261493016","lien":"https://pubmed.ncbi.nlm.nih.gov/42847607/","source":"PubMed","pmid":"42847607","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Stress in context: Social determinants, coping, and policy implications in a quota-matched Austrian sample.","auteurs":"Nitschke Jonas P, Ali Nida, Lamm Claus","date":"2026 Nov 30","type_etude":"étude observationnelle","mecanisme_evalue":"Stress perçu, stratégies de coping et bien-être subjectif","resultat_principal":"Dans un échantillon autrichien quota-matché (N=1099), 7,3% des participants rapportent un stress extrême (pression auto-imposée, trajets domicile-travail, disponibilité constante comme stresseurs dominants) ; un coping auto-sélectionné (ex. jardinage, yoga) est associé à une relation transversale plus faible entre stress et bien-être, sans que cela établisse de causalité.","niveau_de_preuve_et_limites":"Étude observationnelle préenregistrée, transversale (pas de suivi longitudinal mentionné), basée sur des associations statistiques et non sur une preuve d'effet causal ; les différences de stress entre femmes et hommes observées descriptivement disparaissent après ajustement sur covariables, ce qui souligne un risque de confusion. Aucune mention explicite de taille d'échantillon insuffisante, de groupe contrôle absent (non applicable au design observationnel) ou d'hétérogénéité méthodologique dans le résumé au-delà de ces points.","angle_brana_sana":"L'étude identifie le jardinage comme activité de coping auto-sélectionnée associée à une moindre relation négative entre stress et bien-être, ce qui résonne avec l'atelier de jardin médicinal et le travail manuel proposés à Braña Sana — mais il s'agit d'une association transversale, pas d'une preuve d'efficacité du jardinage en soi.","pertinence_brana_sana":2,"doi":"10.1016/j.socscimed.2026.119885","lien":"https://pubmed.ncbi.nlm.nih.gov/42828826/","source":"PubMed","pmid":"42828826","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Differential pathways from arts and creative activities to student learning and wellbeing: the roles of belonging, self-efficacy, and self-regulation.","auteurs":"Dong Song, Wang Boda, Wei Jianyun","date":"2026-09-17","type_etude":"étude observationnelle","mecanisme_evalue":"Appartenance scolaire, auto-efficacité, autorégulation et pensée créative comme variables intermédiaires reliant la participation à des activités artistiques/créatives à la performance en lecture et au bien-être subjectif (satisfaction de vie)","resultat_principal":"La participation à des activités artistiques et créatives est positivement associée, de façon transversale (association, pas causalité), à la performance en lecture (β=0.18) et à la satisfaction de vie (β=0.24), avec une association indirecte conjointe via les quatre construits intermédiaires (β=0.11 pour la lecture, β=0.15 pour la satisfaction de vie).","niveau_de_preuve_et_limites":"Étude observationnelle transversale à grande échelle (n=441 183 élèves de 15 ans, 64 pays, données PISA 2022) utilisant la modélisation par équations structurelles. Les auteurs précisent explicitement que le design transversal ne permet pas d'établir de médiation temporelle ou causale ; les variables étant mesurées dans le même cycle, les relations proposées sont des patterns d'association transversaux et non des mécanismes établis. Une analyse de sensibilité par ajustement mutuel montre que le classement des médiateurs pour la lecture n'est pas stable. Les estimations multi-pays sont des moyennes pondérées et ne supposent pas de relations structurelles identiques dans chaque pays. Les résultats concernent une mesure hétérogène de participation large et ne démontrent pas d'effet de l'éducation artistique formelle ou d'une forme d'art spécifique.","doi":"10.3389/fpsyg.2026.1905846","lien":"https://pubmed.ncbi.nlm.nih.gov/42824323/","source":"PubMed","pmid":"42824323","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Effectiveness of green health prescribing and nature-based interventions in primary care and community settings for older adults: a systematic review of health, wellbeing and social outcomes.","auteurs":"Butt Furqan, Donoghue Jeremiah, Ley Cameron, Dracup Naila, Staniszewska Sophie, Al-Khudairy Lena, Smith Tilli M, Corp Nadia, Parsons Jo, Frost Helen, Grove Amy, Chen Yen-Fu, van der Windt Danielle A","date":"2026 Oct 01","type_etude":"revue systématique","mecanisme_evalue":"Effets de la prescription verte et d'interventions basées sur la nature (activités en plein air, exercice en espaces verts, jardinage d'intérieur, horticulture thérapeutique) sur la santé, le bien-être et les liens sociaux des personnes âgées","resultat_principal":"Sur 21 études (dont 11 essais randomisés) chez des adultes de 50 ans et plus, de nombreuses études rapportent une amélioration sur au moins un résultat de santé ou de bien-être (qualité de vie, santé mentale, fonction physique, fatigue, solitude, lien social), mais les effets statistiquement significatifs par rapport aux conditions contrôle sont rares et les résultats restent incohérents d'une étude à l'autre.","niveau_de_preuve_et_limites":"Certitude globale de la preuve jugée faible à très faible par les auteurs, principalement en raison de petits échantillons, d'un risque de biais, et d'un manque de réplication des résultats entre les différentes études. Les auteurs appellent explicitement à des essais pragmatiques de haute qualité et des études d'implémentation pour évaluer de façon robuste les effets sur la santé, le rapport coût-efficacité et l'usage des ressources de soins en pratique courante.","doi":"10.1186/s12916-026-05194-z","lien":"https://pubmed.ncbi.nlm.nih.gov/42823701/","source":"PubMed","pmid":"42823701","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Integrating art-based activities in racial stress and trauma treatment: Therapists' perspectives on benefits, challenges, and techniques.","auteurs":"Birnkammer Susanne, Gran-Ruaz Sophia M, Calvano Claudia, Mikhail Monica, Williams Monnica T","date":"2026 Oct 01","type_etude":"étude observationnelle","mecanisme_evalue":"Perceptions thérapeutiques sur l'intégration d'activités créatives/artistiques dans le traitement du stress et du trauma racial (engagement émotionnel, expression, insight)","resultat_principal":"Les thérapeutes interrogés associent les activités créatives intégrées au Healing Racial Trauma Protocol à un engagement accru, une meilleure expression émotionnelle et plus d'insight chez les clients, notamment ceux ayant une expression verbale limitée, tout en identifiant des freins (hésitation des clients, considérations culturelles, contraintes pratiques) et un inconfort chez les thérapeutes blancs à aborder la dynamique raciale.","niveau_de_preuve_et_limites":"Étude qualitative basée sur des entretiens semi-structurés avec un échantillon très restreint de 10 thérapeutes ; analyse par cadre thématique (framework analysis) sans groupe contrôle ni mesure quantitative des effets cliniques ; les résultats reflètent des perceptions subjectives des thérapeutes et non des données sur les patients eux-mêmes ; généralisabilité limitée du fait de la petite taille d'échantillon et du contexte spécifique (protocole manualisé de trauma racial).","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1037/tra0002274","lien":"https://pubmed.ncbi.nlm.nih.gov/42821394/","source":"PubMed","pmid":"42821394","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Adolescent-reported household food security and dietary diversity with associative factors before and during the COVID-19 pandemic: a cross-sectional survey with follow-up in Nagcarlan, Laguna Province, Philippines","auteurs":"Mughal Lowela P, Felix Angelina dR, Barba Corazon Veron Cruz, Feskens Edith J M, Melse-Boonstra Alida","date":"2026 Sep 28","type_etude":"étude observationnelle","mecanisme_evalue":"Sécurité alimentaire perçue et diversité alimentaire chez des adolescents ruraux, et leurs facteurs associés (mobilité, genre, santé mentale, taille du ménage, richesse, troc alimentaire, jardinage vivrier)","resultat_principal":"La sécurité alimentaire perçue et la diversité alimentaire des adolescents ruraux philippins ne se sont pas détériorées durant les premiers mois du confinement COVID-19 ; les restrictions de mobilité étaient associées négativement à ces deux indicateurs, tandis que le troc alimentaire et le jardinage vivrier étaient associés positivement à la sécurité alimentaire (associations statistiques, non des preuves causales).","niveau_de_preuve_et_limites":"Étude observationnelle transversale avec suivi (deux temps de mesure, T1 N=285, T2 N=152), analyse par régression de Poisson multivariée. Réduction importante de l'échantillon entre T1 et T2 (perte de suivi non quantifiée dans le résumé), données auto-rapportées par les adolescents et rappel alimentaire de 24h (sujet à biais de mémoire), absence de groupe contrôle au sens expérimental, contexte géographique et culturel très spécifique (zone rurale des Philippines) limitant la généralisabilité. Les auteurs eux-mêmes appellent à des investigations supplémentaires pour clarifier certaines relations observées (ex. richesse vs diversité alimentaire).","doi":"10.1017/S0007114526108265","lien":"https://pubmed.ncbi.nlm.nih.gov/42803336/","source":"PubMed","pmid":"42803336","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Reliability and Validity of the Chinese Version of the ERS-ACA Scale Among Chinese College Students.","auteurs":"Yu Xiyue, Luo Xinyu, Zhang Sina, Chen Qingfei, Fan Jialin","date":"2026 Sep 16","type_etude":"autre","mecanisme_evalue":"Stratégies de régulation émotionnelle mobilisées lors d'activités créatives artistiques (régulation émotionnelle, bien-être, personnalité positive)","resultat_principal":"La version chinoise à 18 items de l'échelle ERS-ACA montre une structure à trois facteurs confirmée, une bonne cohérence interne, et des associations positives avec la réévaluation cognitive, le bien-être et la personnalité positive, mais pas (ou faiblement) avec la suppression expressive — il s'agit d'associations statistiques, non de preuves d'effet causal.","niveau_de_preuve_et_limites":"Étude de validation psychométrique transversale sur 885 étudiants universitaires chinois de plusieurs disciplines ; pas de groupe contrôle ni de suivi longitudinal ; les auteurs soulignent eux-mêmes que d'autres validations sont nécessaires dans d'autres populations, ce qui limite la généralisabilité des résultats au-delà de cet échantillon étudiant chinois.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.3390/bs16091661","lien":"https://pubmed.ncbi.nlm.nih.gov/42792461/","source":"PubMed","pmid":"42792461","thematique_id":"manuel","thematique":"Retour au manuel","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Psychosocial interventions for adolescent substance use and related outcomes: a systematic review of randomized controlled trials.","auteurs":"Mateu-Mollá Joaquín, Mesas-Fernández Javier, Villanueva-Blasco Víctor José","date":"2026 Nov 11","type_etude":"revue systématique","mecanisme_evalue":"Consommation de substances chez les adolescents et issues psychiatriques/psychosociales associées, via interventions psychosociales (cognitivo-comportementales, motivationnelles, mindfulness, numériques, scolaires)","resultat_principal":"Les interventions psychosociales montrent des effets hétérogènes sur la consommation de substances chez les adolescents : certaines interventions ciblées (cognitivo-comportementale orientée personnalité, programme scolaire) réduisent significativement certains risques (OR 0,66 et 0,65 respectivement), mais une intervention basée sur la mindfulness n'a montré aucun avantage par rapport au traitement usuel pour réduire la consommation de cannabis (d=0,02, p=0,930), et une intervention numérique n'a eu aucun effet significatif sur le tabagisme.","niveau_de_preuve_et_limites":"Revue systématique de 34 ECR suivant PRISMA, enregistrée sur PROSPERO. Risque de biais évalué avec Cochrane RoB 2 : préoccupations modérées dans 58,82% des études (n=20) et risque élevé dans 41,18% (n=14). Les auteurs signalent eux-mêmes une forte hétérogénéité méthodologique, une variabilité des mesures de résultats, l'absence de synthèse quantitative poolée (pas de méta-analyse), empêchant des conclusions fermes sur l'efficacité comparative et la significativité clinique. La supériorité comparative entre approches cognitivo-comportementales et motivationnelles n'a pas pu être établie.","doi":"10.1016/j.addbeh.2026.108909","lien":"https://pubmed.ncbi.nlm.nih.gov/43033561/","source":"PubMed","pmid":"43033561","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Interventions to reduce perinatal suicidality: a global systematic review.","auteurs":"Despotis A, Fellmeth G, Daskalopoulou Z, Simmons E, Roberts N, Harrison S, Alderdice F, Duhig K, Carson C","date":"2026 Nov 14","type_etude":"revue systématique","mecanisme_evalue":"Suicidalité périnatale (pensées, comportements, plans et tentatives suicidaires) et effet des interventions non pharmacologiques, dont certaines incluent une composante de mindfulness","resultat_principal":"Sur 6 études incluses, deux interventions (programmes communautaires multidisciplinaires et thérapie d'activation comportementale) ont montré une association avec une réduction de la suicidalité périnatale, mais une seule a montré une réduction significative à 3-4 mois postpartum (non maintenue à 7-8 mois) ; les études évaluant la suicidalité comme simple critère de sécurité (dont une intervention de mindfulness électronique) n'étaient pas suffisamment puissantes pour conclure à un effet.","niveau_de_preuve_et_limites":"Revue systématique de seulement 6 études (5 ECR + 1 essai contrôlé historique), très petit nombre d'études disponibles sur le sujet ; trois études seulement ont évalué la suicidalité comme critère principal/secondaire, les trois autres uniquement comme suivi de sécurité et donc non dimensionnées (sous-puissantes) pour détecter un effet réel ; les auteurs soulignent explicitement que des preuves robustes issues d'interventions spécifiquement conçues pour réduire la suicidalité périnatale font encore défaut ; association observée, pas preuve causale solide.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1080/02646838.2026.2757842","lien":"https://pubmed.ncbi.nlm.nih.gov/43033196/","source":"PubMed","pmid":"43033196","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Effects of mindfulness-based interventions on negative emotions in patients with hypertension: a systematic review and meta-analysis","auteurs":"Lin Jiawei, Lian Changqun, Zhou Guiting, Liu Jiantao, Hua Yanlang, Liu Peijian","date":"2026-10-30","type_etude":"méta-analyse","mecanisme_evalue":"Symptômes dépressifs, anxiété, stress perçu, qualité de vie et pression artérielle (systolique/diastolique) chez des patients hypertendus","resultat_principal":"Les interventions basées sur la pleine conscience sont associées à une réduction significative des symptômes dépressifs, de l'anxiété et du stress perçu, ainsi qu'à une réduction modeste de la pression artérielle systolique et diastolique chez des adultes hypertendus, sur la base de 9 essais randomisés (n=780).","niveau_de_preuve_et_limites":"Méta-analyse de 9 ARC (780 participants) suivant PRISMA, risque de biais globalement faible à modéré (outil Cochrane). Certitude de la preuve évaluée par GRADE : modérée pour la dépression et la pression artérielle systolique/diastolique, mais faible pour l'anxiété, le stress perçu et la qualité de vie. Le nombre d'essais et la taille d'échantillon totale restent limités ; les intervalles de confiance pour certains effets (notamment anxiété et pression artérielle) sont larges, suggérant une incertitude substantielle. Association démontrée dans le cadre d'essais randomisés, mais l'ampleur clinique de la réduction tensionnelle reste modeste et la généralisabilité à d'autres contextes culturels/cliniques n'est pas discutée dans le résumé.","angle_brana_sana":"Ces résultats soutiennent l'intégration de pratiques de mindfulness (méditation guidée, scan corporel, respiration consciente) dans un programme de repos/santé préventive pour les visiteurs présentant une hypertension ou un stress cardiovasculaire, en complément — non en remplacement — d'un suivi médical, avec un bénéfice attendu surtout sur le plan émotionnel (anxiété, stress, humeur) plutôt que comme traitement tensionnel à part entière.","pertinence_brana_sana":3,"doi":"10.3389/fcvm.2026.1941304","lien":"https://pubmed.ncbi.nlm.nih.gov/43031733/","source":"PubMed","pmid":"43031733","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Psychological interventions for functional/dissociative seizures: A systematic review.","auteurs":"Hawkes Sarah, Koychev Ivan, Gallacher John, Edwards Mark","date":"2026 Nov 13","type_etude":"revue systématique","mecanisme_evalue":"Efficacité des interventions psychologiques (dont thérapie cognitivo-comportementale, psychoéducation, thérapie basée sur la mindfulness, hypnose, thérapies comportementales) sur les crises fonctionnelles/dissociatives (FDS)","resultat_principal":"Sur 55 études incluses, la thérapie cognitivo-comportementale présente la base de preuve la plus solide pour traiter les FDS, tandis que la communication diagnostique, la psychoéducation, la thérapie psychodynamique, la thérapie basée sur la mindfulness, la thérapie comportementale et les approches combinées montrent des résultats prometteurs mais sans preuve claire de supériorité pour des sous-groupes spécifiques de patients.","niveau_de_preuve_et_limites":"Revue systématique de 55 études (58 publications) avec une grande variété d'interventions et de méthodologies ; les auteurs soulignent explicitement l'absence de preuve claire quant à l'intervention la plus appropriée selon les sous-groupes de patients, et appellent à des études de plus grande taille, de meilleure qualité méthodologique et avec des suivis plus longs pour établir les traitements les plus efficaces. Aucune indication précise sur la taille des échantillons individuels ou l'hétérogénéité méthodologique détaillée n'est fournie dans le résumé au-delà de ces mentions générales.","angle_brana_sana":"Cette revue concerne une population clinique spécifique (crises fonctionnelles/dissociatives) et non une population générale en quête de bien-être ; bien que la mindfulness soit mentionnée comme piste prometteuse dans ce contexte médical précis, il serait trompeur de l'extrapoler directement aux ateliers ou programmes de mindfulness de Braña Sana destinés à un public non clinique.","pertinence_brana_sana":0,"doi":"10.1016/j.yebeh.2026.111345","lien":"https://pubmed.ncbi.nlm.nih.gov/43025181/","source":"PubMed","pmid":"43025181","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Online mindfulness-based cognitive therapy for people with multiple sclerosis with mild-to-moderate depression- protocol for a type 1 hybrid effectiveness-implementation study","auteurs":"Simpson Robert, Scandiffio Jillian, Langer Laura, Munce Sarah, Sureshkumar Ashvene, Feinstein Anthony, Bayley Mark, Bowman Caroline, Bruno Tania R, Ehde Dawn, Knox Katherine, Lai Nanette, Smyth Penelope, Sud Abhimanyu, Donkers Sarah J","date":"2026-11-13","type_etude":"essai en cours","mecanisme_evalue":"Dépression légère à modérée chez les personnes atteintes de sclérose en plaques (PwMS), mesurée via HADS-D ; effets de la thérapie cognitive basée sur la pleine conscience (MBCT) en ligne","resultat_principal":"Il s'agit d'un protocole d'étude décrivant un essai contrôlé randomisé avec liste d'attente (hybride effectiveness-implementation de type 1) visant à évaluer l'efficacité d'un programme de MBCT en ligne de 8 semaines chez au moins 152 PwMS présentant une dépression légère à modérée ; aucun résultat d'efficacité n'est encore disponible, l'étude n'étant qu'au stade protocolaire.","niveau_de_preuve_et_limites":"Il s'agit d'un protocole d'essai contrôlé randomisé (pas encore de résultats), donc aucun niveau de preuve d'efficacité ne peut être établi à ce stade. Le résumé précise une taille d'échantillon cible (minimum 152 participants pour la partie quantitative, 30-40 pour la partie qualitative) et une conception mixte avec groupe liste d'attente comme contrôle ; aucune limite méthodologique supplémentaire (biais, hétérogénéité) n'est mentionnée dans le résumé pour l'instant, s'agissant d'un protocole.","doi":"10.1371/journal.pone.0362553","lien":"https://pubmed.ncbi.nlm.nih.gov/43024620/","source":"PubMed","pmid":"43024620","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Broadening global health knowledge: epistemic pluralism through Asian philosophical traditions.","auteurs":"Hewage Bhadrajee, Joshi Bishal, Poudyal Yogesh, Banik Shuma, Hanbookunuparkarn Borimas, Ishioka Haruhiko, Ding Junjie, Acharya Sanjaya, Mishra Shiva Raj, Adhikari Bipin","date":"2026 Nov 13","type_etude":"autre","mecanisme_evalue":"Cet article est une réflexion théorique/épistémologique sur les cadres conceptuels de la santé globale (relationalité, compassion, adaptabilité issues des traditions taoïste, confucéenne et bouddhiste) ; il n'évalue pas un mécanisme physiologique ou psychologique mesuré empiriquement.","resultat_principal":"L'article argumente (sans donnée empirique nouvelle) que les traditions philosophiques asiatiques (taoïsme, confucianisme, bouddhisme) offrent des cadres alternatifs sous-exploités pour repenser la santé globale au-delà du modèle biomédical, et appelle à une intégration plus réflexive de pratiques comme la mindfulness avec leurs fondements philosophiques plutôt qu'à leur simple transfert technique.","niveau_de_preuve_et_limites":"Il s'agit d'un article de positionnement/opinion académique (essai conceptuel), pas d'une étude empirique : aucune donnée quantitative, aucun échantillon, aucun groupe contrôle n'est mentionné. Le niveau de preuve est donc celui d'un argumentaire théorique et non d'une preuve d'effet ; les auteurs eux-mêmes reconnaissent une lecture \"sélective\" des traditions, ce qui limite la généralisabilité et introduit un risque de biais d'interprétation.","doi":"10.7189/jogh.16.03038","lien":"https://pubmed.ncbi.nlm.nih.gov/43023571/","source":"PubMed","pmid":"43023571","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Interventions for anxiety, burnout, and resilience in university students: a systematic review with implications for mental health nursing practice.","auteurs":"Woime Ashenafi Woldemichael","date":"2026-11-07","type_etude":"revue systématique","mecanisme_evalue":"Anxiété, burnout et résilience chez les étudiants universitaires ; facteurs contributifs (pression académique, isolement social, stress numérique) et facteurs protecteurs (résilience, soutien social)","resultat_principal":"Sur 38 études incluses, les interventions les plus efficaces identifiées associent thérapie cognitivo-comportementale, approches basées sur la mindfulness, programmes de soutien par les pairs et outils numériques de santé mentale, mais ces résultats reflètent des associations issues de la littérature existante plutôt qu'une preuve directe d'efficacité des interventions infirmières.","niveau_de_preuve_et_limites":"Revue systématique (PRISMA 2020, enregistrée PROSPERO) portant sur 38 études hétérogènes en méthodologie et en population ; les auteurs précisent explicitement que la plupart des études incluses n'évaluaient pas directement des interventions délivrées par des infirmiers, limitant la portée des conclusions à des recommandations translationnelles plutôt qu'à une preuve d'efficacité spécifique. L'hétérogénéité des interventions et des contextes culturels limite la généralisation.","angle_brana_sana":"Les approches basées sur la mindfulness ressortent comme une catégorie d'intervention efficace contre l'anxiété et le burnout étudiant, ce qui conforte l'intérêt d'ateliers de mindfulness et de temps de récupération proposés par Braña Sana pour un public en situation de stress académique ou professionnel, en complément d'un soutien social/pair à valoriser dans les séjours de groupe.","pertinence_brana_sana":2,"doi":"10.1080/28324765.2026.2756009","lien":"https://pubmed.ncbi.nlm.nih.gov/43023119/","source":"PubMed","pmid":"43023119","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Depression in autism spectrum disorder: a scoping review of pharmacologic, neuromodulation, and psychosocial interventions.","auteurs":"Ghumman Usman, Shafee Celine, Altarawneh Lina, Iorini Maria, Kandel Hagar, Anand Nikhilesh, Lopez Alissa, Mendoza Jacqueline, Romero Emma, Dang Anthony, Saeed Aisha, Magisano-Lamraoui Leonardo, Ceranoglu Tolga Atilla, Belmares Ricardo, Joshi Gagan, Gadad Bharathi","date":"2026-10-29","type_etude":"revue systématique","mecanisme_evalue":"Symptômes dépressifs dans le trouble du spectre autistique (TSA) et efficacité des interventions pharmacologiques, de neuromodulation et psychosociales (dont la thérapie basée sur la mindfulness)","resultat_principal":"Les interventions psychosociales (dont la thérapie basée sur la mindfulness, la TCC adaptée à l'autisme, la DBT-informée, l'activation comportementale, PEERS, l'exercice et la thérapie assistée par l'animal) sont associées à des améliorations des symptômes dépressifs dans des études ouvertes et de petits essais randomisés, mais les preuves pour la neuromodulation restent préliminaires et celles pour la pharmacothérapie reposent surtout sur un consensus d'experts plutôt que sur des essais contrôlés spécifiques au TSA.","niveau_de_preuve_et_limites":"Revue de portée (scoping review) basée sur des études hétérogènes : études ouvertes et petits essais randomisés pour les interventions psychosociales, données préliminaires pour la neuromodulation, preuves principalement issues de cas cliniques pour l'électroconvulsivothérapie et la stimulation cérébrale profonde, et recommandations pharmacologiques fondées sur un consensus d'experts et des preuves indirectes plutôt que sur des essais contrôlés spécifiques au TSA. Les auteurs soulignent eux-mêmes le besoin d'essais contrôlés de plus grande ampleur, utilisant des mesures de dépression validées pour le TSA, avec une représentation plus large des besoins de soutien et une évaluation des résultats fonctionnels à long terme.","doi":"10.3389/fpsyt.2026.1906750","lien":"https://pubmed.ncbi.nlm.nih.gov/43021987/","source":"PubMed","pmid":"43021987","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Effects of mindfulness-based interventions on sleep quality in university students: a meta-analysis of randomized controlled trials.","auteurs":"Wang Hongwei, Guo Longkang, Wang Junbo, Chen Zhaoxuan, Han Wei","date":"2026-10-29","type_etude":"méta-analyse","mecanisme_evalue":"Qualité du sommeil (via interventions basées sur la pleine conscience, MBIs)","resultat_principal":"Les interventions basées sur la pleine conscience améliorent significativement la qualité du sommeil chez les étudiants universitaires (SMD = -0.97, IC 95% [-1.43, -0.51], p < 0.001), bien qu'il s'agisse d'un effet mesuré sur des essais contrôlés randomisés et non d'une association simple.","niveau_de_preuve_et_limites":"Méta-analyse de 10 RCTs (638 participants au total, 335 en intervention, 303 en contrôle), avec hétérogénéité substantielle entre études (I²=85.1%) partiellement expliquée par l'instrument de mesure du sommeil, le type d'intervention et la durée des sessions. Le test d'Egger n'a pas révélé de biais de publication significatif (p=0.270), et les analyses de sensibilité confirment la robustesse des résultats poolés. Toutefois, la certitude globale des preuves est jugée faible selon le cadre GRADE, et les auteurs appellent explicitement à des RCTs de meilleure qualité pour confirmer ces résultats.","angle_brana_sana":"Ces résultats soutiennent l'intérêt des pratiques de pleine conscience proposées dans le cadre du pilier mindfulness de Braña Sana comme complément non-pharmacologique pour améliorer la qualité du sommeil, en cohérence avec le pilier repos/sommeil — notamment pour un public en situation de stress (étudiants, mais extrapolable à des profils professionnels en quête de récupération). L'angle reste toutefois à nuancer compte tenu de la faible certitude des preuves (GRADE bas) et de la forte hétérogénéité méthodologique.","pertinence_brana_sana":3,"doi":"10.3389/fpubh.2026.1988584","lien":"https://pubmed.ncbi.nlm.nih.gov/43021860/","source":"PubMed","pmid":"43021860","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"The Tinnitus Integrated Digital Ecosystem Model for Digital Tinnitus Rehabilitation: A Clinical Framework.","auteurs":"Tubul Zahi","date":"2026 Nov 12","type_etude":"autre","mecanisme_evalue":"Régulation de l'attention, de l'appraisal cognitif et de la détresse liée aux acouphènes (incluant des approches basées sur la pleine conscience, les stratégies cognitivo-comportementales et les interventions sonores)","resultat_principal":"Cet article propose un modèle conceptuel (TIDE) organisant quatre domaines thérapeutiques existants (psychoéducation, stratégies cognitivo-comportementales, pleine conscience/régulation attentionnelle, stratégies sonores) au sein d'une plateforme numérique structurée guidée par un clinicien, sans présenter de nouvelle intervention ni de données empiriques d'efficacité.","niveau_de_preuve_et_limites":"Il s'agit d'un article de synthèse conceptuelle/clinique (clinical focus article) proposant un cadre théorique, et non d'une étude empirique testant une intervention : aucun échantillon, aucun groupe contrôle, aucune donnée de résultat clinique n'est rapporté. Le résumé indique explicitement que le modèle doit encore faire l'objet d'une mise en œuvre clinique et d'un test empirique ; il ne constitue donc pas une preuve d'efficacité mais une proposition structurante s'appuyant sur la littérature existante.","angle_brana_sana":"Bien que le pilier mindfulness soit mentionné comme composante du modèle, celui-ci concerne spécifiquement la réhabilitation clinique numérique des acouphènes (contexte médical/audiologique très spécifique), sans lien concret avec les activités de Braña Sana (sentier, jardin, ateliers, repos). Aucun rapprochement honnête ne se justifie.","pertinence_brana_sana":0,"doi":"10.1044/2026_AJA-26-00156","lien":"https://pubmed.ncbi.nlm.nih.gov/43018965/","source":"PubMed","pmid":"43018965","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Feasibility and acceptability of a mindfulness-based vitality promotion program in a lifelong learning setting: a single-arm mixed-methods study.","auteurs":"Yoon Seok-In, Park Hui-Yeong, Yoo Jae-Hong, Chung Sun-Yong, Kim Jong Woo","date":"2026 10 28","type_etude":"autre","mecanisme_evalue":"Vitalité intégrative, bien-être, dépression, fatigue, anxiété, douleur, sommeil, symptômes digestifs, colère et mindfulness (auto-rapportés)","resultat_principal":"Dans cette étude pilote à un seul bras, le programme MVP (8 semaines, 35 participants) a montré une bonne faisabilité/acceptabilité (88,6% de rétention, forte satisfaction) et des améliorations pré-post significatives en vitalité intégrative, bien-être, dépression, fatigue et anxiété, sans changement significatif sur la douleur, le sommeil, les symptômes digestifs, la colère ou le niveau de mindfulness.","niveau_de_preuve_et_limites":"Étude de faisabilité à un seul bras (sans groupe contrôle), échantillon réduit (35 participants, 31 ayant complété le programme), données auto-rapportées ; les auteurs précisent explicitement que des études contrôlées supplémentaires sont nécessaires pour établir l'efficacité du programme. Les résultats pré-post ne permettent pas de conclure à une causalité (absence de contrôle pour effet temps, régression vers la moyenne, attentes des participants, etc.).","angle_brana_sana":"Ce programme de mindfulness orienté vitalité, délivré en format groupe sur 8 semaines (séances de 90 min) dans un cadre d'apprentissage tout au long de la vie, pourrait inspirer un module mindfulness/vitalité intégré aux ateliers ou séjours de Braña Sana visant le bien-être et la réduction de la fatigue/anxiété — à titre d'intervention complémentaire et non comme méthode validée d'efficacité clinique.","pertinence_brana_sana":2,"doi":"10.3389/fpubh.2026.1990679","lien":"https://pubmed.ncbi.nlm.nih.gov/43016939/","source":"PubMed","pmid":"43016939","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"The Complex Relationship Between ADHD and Alcohol Use Disorder: A Narrative Review","auteurs":"Skryabin Valentin, Makartseva Polina, Sokolova Svetlana, Martinotti Giovanni","date":"2026 Nov 01","type_etude":"revue systématique","mecanisme_evalue":"Impulsivité, dysfonction exécutive, dérégulation dopaminergique, et mécanismes psychosociaux sous-tendant la comorbidité TDAH-trouble de l'usage de l'alcool (TUA)","resultat_principal":"Le TDAH augmente le risque d'initiation précoce à l'alcool, de schémas de consommation plus sévères et de moins bons résultats thérapeutiques ; les approches intégrées combinant traitements pharmacologiques (non-stimulants, agents anti-craving) et interventions comportementales (dont la mindfulness) sont présentées comme prometteuses, sans qu'une preuve d'effet causal unique ne soit établie.","niveau_de_preuve_et_limites":"Revue narrative (non systématique) : par nature synthétique et non quantitative, sans méta-analyse des effets. Le résumé souligne explicitement un manque de données longitudinales à long terme sur le traitement du TDAH dans les populations avec TUA, et une incertitude persistante sur le rôle des stimulants dans la prévention du mésusage d'alcool.","angle_brana_sana":"Mention des interventions basées sur la mindfulness comme piste prometteuse pour les comportements liés à l'alcool chez les personnes TDAH, mais le contexte est clinique (comorbidité psychiatrique sévère, addictologie) et ne correspond pas directement au public ou au cadre de Braña Sana ; lien trop indirect pour une application concrète du centre.","pertinence_brana_sana":1,"doi":"10.1097/PRA.0000000000000957","lien":"https://pubmed.ncbi.nlm.nih.gov/43013859/","source":"PubMed","pmid":"43013859","thematique_id":"mindfulness","thematique":"Mindfulness & performance mentale","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-16"},{"titre":"Mindfulness for reducing stress, anxiety, and depression in incarcerated individuals: a scoping review","auteurs":"Mateo-Cristóstomo Yadira, Camacho Rodríguez Doriam Esperanza, Aguilar Zavala Herlinda, Herrera Paredes José Manuel, Zamorano Espero Jesús Antonio","date":"2026-10-22","type_etude":"revue systématique","mecanisme_evalue":"Stress, anxiété et dépression (régulation émotionnelle) via interventions basées sur la mindfulness","resultat_principal":"Sur 10 interventions de mindfulness analysées chez des personnes incarcérées, six des sept interventions revues ont montré une réduction significative d'au moins une des variables (stress, anxiété, dépression), le programme adapté \"Path of Freedom\" se distinguant comme le plus efficace.","niveau_de_preuve_et_limites":"Scoping review (cadre méthodologique Arksey et O'Malley) incluant seulement 10 articles hétérogènes en termes d'interventions, de durée des programmes et de composants intégrés ; échantillons majoritairement masculins (seulement 3 études sur femmes et 1 étude mixte), ce qui limite la généralisation par genre ; l'hétérogénéité méthodologique entre les 10 interventions est explicitement soulignée par les auteurs comme facteur limitant la comparabilité des résultats ; absence de méta-analyse quantitative, résultats présentés de façon narrative/descriptive.","angle_brana_sana":"Bien que l'étude porte sur une population incarcérée très spécifique (contexte carcéral, contraintes et stress propres à l'enfermement), e
