<!doctype html>

<head>

<title>Veille La Borbolla — tableau de bord</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 16px 12px;
    max-width: 980px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 16px; }
  .theme-toggle {
    position: absolute; top: 16px; right: 16px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; color: var(--text-primary);
    font-size: 0.8rem; cursor: pointer;
  }
  .controls {
    max-width: 980px; margin: 0 auto; padding: 0 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type="text"] {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 0.85rem;
  }
  input[type="text"] { flex: 1; min-width: 200px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 11px; font-size: 0.78rem; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
    user-select: none;
  }
  .chip.active { color: var(--text-primary); font-weight: 600; border-color: currentColor; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip .count { color: var(--text-muted); }
  .chip.active .count { color: inherit; }
  label.checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
  .buttons { display: flex; gap: 8px; margin-left: auto; }
  button.plain {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer;
  }
  main { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  .count-line { color: var(--text-secondary); font-size: 0.85rem; margin: 6px 0 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 4px solid var(--card-color, var(--gridline));
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer;
  }
  .card-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .card-title { font-size: 0.95rem; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 200px; }
  .badge {
    font-size: 0.7rem; padding: 2px 7px; border-radius: 999px;
    background: var(--gridline); color: var(--text-secondary); white-space: nowrap;
  }
  .badge-pertinence {
    background: rgba(12,163,12,0.16); color: #0ca30c; font-weight: 600;
  }
  .meta-line { color: var(--text-secondary); font-size: 0.78rem; margin-top: 4px; }
  .snippet { color: var(--text-secondary); font-size: 0.85rem; margin-top: 6px; }
  .details { display: none; margin-top: 10px; border-top: 1px solid var(--gridline); padding-top: 10px; font-size: 0.85rem; }
  .details.open { display: block; }
  .details dt { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; margin-top: 8px; }
  .details dd { margin: 2px 0 0; color: var(--text-primary); }
  .details a { color: var(--card-color, #2a78d6); }
  .empty { color: var(--text-muted); text-align: center; padding: 40px 0; }
  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 20px 0 8px; }
</style>

<script id="fiches-data" type="application/json">[{"titre":"Routine greenery encounters and anxiety occurrence probability: a study of component contributions in university residential greenery scenes based on mobile electroencephalography data.","auteurs":"Wang Liya, Li Zhe, Qu Siruo, Jiang Peng, Zuo Hanzhu","date":"2026-11-04","type_etude":"étude observationnelle","mecanisme_evalue":"Activité EEG liée à l'anxiété (asymétrie alpha frontale et ratio theta/bêta) en réponse à des composantes visuo-spatiales de verdure lors d'une marche quotidienne","resultat_principal":"La richesse chromatique, le taux d'ombrage, le ratio de vue sur la verdure et la visibilité étaient associés négativement (association statistique, non causale) à la probabilité d'occurrence d'anxiété (AOP) mesurée par EEG mobile, avec des seuils de rupture identifiés pour le taux d'ombrage (0,321) et la visibilité (0,451).","niveau_de_preuve_et_limites":"Étude exploratoire observationnelle sur un seul campus, une seule saison (été), un parcours fixe de 45 m, sans route contrôle non-végétalisée ; échantillon réduit (35 étudiants sur 38 inclus après exclusion des données invalides) ; les auteurs soulignent explicitement l'absence de causalité, le caractère spécifique au contexte des seuils estimés, et la nécessité de validation sur des échantillons plus larges, multi-sites et multi-saisons ; problèmes de multicolinéarité mentionnés pour les composantes structurelles.","angle_brana_sana":"Les résultats suggèrent que certaines caractéristiques visuelles concrètes des sentiers (ombrage, diversité chromatique, dégagement de vue sur la végétation) pourraient être pensées lors de la conception ou de l'aménagement des parcours de bain de forêt à Braña Sana, en privilégiant des zones avec un bon ratio de vue sur la verdure et un ombrage modéré plutôt qu'une simple densité végétale.","pertinence_brana_sana":2,"doi":"10.3389/fpubh.2026.1939310","lien":"https://pubmed.ncbi.nlm.nih.gov/43054326/","source":"PubMed","pmid":"43054326","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Health-Related Outcomes of Stand-Up Paddle Across Diverse Populations: A Scoping Review","auteurs":"Bento Teresa, Frazão Henrique, Couto Nuno, Freitas João","date":"2026 Nov 01","type_etude":"revue systématique","mecanisme_evalue":"Effets physiques (conditionnement cardiovasculaire, force musculosquelettique, équilibre) et psychologiques (bien-être mental, changements de mindset à long terme) liés à la pratique du stand-up paddle","resultat_principal":"Sur 11 études incluses (2013-2026), la pratique du SUP est associée à des bénéfices potentiels dans quatre domaines thématiques (conditionnement physique/cardiovasculaire, force musculosquelettique/équilibre, santé mentale/bien-être psychologique, impact à long terme sur le mindset), mais aucune preuve causale robuste n'est établie.","niveau_de_preuve_et_limites":"Niveau de preuve faible : les auteurs signalent explicitement des tailles d'échantillon réduites, une hétérogénéité méthodologique importante entre les 11 études incluses, et l'absence totale d'essais contrôlés randomisés. Il s'agit d'une revue de portée (scoping review), pas d'une méta-analyse quantitative, et les résultats sont descriptifs par thématique.","angle_brana_sana":"Le SUP n'est pas une activité proposée à Braña Sana (centre situé en Asturies, sans mention d'activités nautiques dans les piliers décrits), et l'étude porte sur une pratique sportive aquatique spécifique plutôt que sur le bain de forêt ou le contact passif avec la nature. Le lien avec les piliers du centre (shinrin-yoku, repos, mindfulness, travail manuel, nutrition) reste trop indirect pour justifier une application concrète.","pertinence_brana_sana":0,"doi":"10.3390/healthcare14213705","lien":"https://pubmed.ncbi.nlm.nih.gov/43028726/","source":"PubMed","pmid":"43028726","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"High Per-capita Area of Accessible Urban Green Space and Lower Self-reported Anxiety/Depression Problems among Older Adults in Korea: A Nationwide Multilevel Study","auteurs":"Ju Yeong Jun, Kim Woorim, Lim Hyungryul, Lee Soon Young","date":"2026 Nov 13","type_etude":"étude observationnelle","mecanisme_evalue":"Anxiété/dépression auto-rapportée (dimension EQ-5D-3L) en lien avec l'exposition aux espaces verts/forêts urbaines de proximité","resultat_principal":"Chez des personnes âgées coréennes (n=79 931), une surface de forêt urbaine par habitant élevée au niveau du district (≥31,8 m²/personne) est associée à des probabilités plus faibles de problèmes d'anxiété/dépression auto-rapportés par rapport au quartile le plus bas (OR ajusté 0,74 ; IC95% 0,63-0,87), sans association significative pour les quartiles intermédiaires ; il s'agit d'une association statistique transversale, non d'une preuve d'effet causal.","niveau_de_preuve_et_limites":"Étude observationnelle transversale à grande échelle (n=79 931) avec modèle multiniveau ajusté sur covariables individuelles, mais l'exposition est mesurée au niveau du district (et non individuellement), la relation n'est pas dose-dépendante (absence d'effet significatif pour les quartiles intermédiaires), et le design transversal ne permet pas d'établir de causalité. Les auteurs ne précisent pas d'autres limites spécifiques dans le résumé fourni.","angle_brana_sana":"Cette étude porte sur la planification urbaine et l'accès quotidien aux espaces verts en milieu urbain, un contexte différent du bain de forêt immersif pratiqué à Braña Sana en milieu rural/naturel ; le lien direct avec les ateliers ou séjours proposés reste ténu et ne justifie pas un rapprochement concret.","pertinence_brana_sana":0,"doi":"10.1007/s11524-026-01168-x","lien":"https://pubmed.ncbi.nlm.nih.gov/43026471/","source":"PubMed","pmid":"43026471","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Feasibility, acceptability, and tolerability of operation calm: a mixed-methods evaluation with children, parents, and clinicians.","auteurs":"Benchimol-Elkaim Brandon, Khoury Bassam, Tsimicalis Argerie","date":"2026-10-28","type_etude":"essai en cours","mecanisme_evalue":"Anxiété procédurale pédiatrique et autorégulation via exposition virtuelle à des scènes naturelles combinée à de la pleine conscience (VR immersive + nature + mindfulness)","resultat_principal":"Ce protocole décrit une étude de faisabilité pré-post à bras unique (non encore résultats) visant à évaluer la faisabilité, l'acceptabilité et la tolérabilité d'une intervention combinant réalité virtuelle, scènes naturelles à 360° et narration de pleine conscience chez des enfants/adolescents, parents et cliniciens ; aucun résultat d'efficacité n'est encore disponible.","niveau_de_preuve_et_limites":"Il s'agit d'un protocole d'étude de faisabilité (pas encore de résultats), sans groupe contrôle, conception à bras unique avec échantillon limité (environ 50 enfants, 50 parents, 50 cliniciens). Les auteurs précisent explicitement que les changements pré-post immédiats seront exploratoires et n'établiront pas d'efficacité ; les profils par scène seront descriptifs et non confirmatoires.","angle_brana_sana":"L'intervention utilise des scènes naturelles immersives (360°) associées à de la pleine conscience pour induire un effet calmant à court terme chez des enfants en contexte médical/dentaire ; le concept d'exposition virtuelle à la nature combinée à la mindfulness fait écho à l'approche bain de forêt/mindfulness de Braña Sana, mais il s'agit ici de VR en milieu clinique pédiatrique, pas d'immersion réelle en forêt, et aucune preuve d'efficacité n'est encore disponible — le lien reste donc conceptuel et prospectif plutôt que directement applicable au programme actuel.","pertinence_brana_sana":1,"doi":"10.3389/frhs.2026.1912318","lien":"https://pubmed.ncbi.nlm.nih.gov/43017151/","source":"PubMed","pmid":"43017151","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Impacts of Nature-Based Interventions on Healthcare Workers' Stress, Burnout, and Performance: A Systematic Literature Review","auteurs":"Park Seokyung, Khandan Parya, Johnson Elizabeth, Zhu Xuemei","date":"2026 Nov 10","type_etude":"revue systématique","mecanisme_evalue":"Stress psychologique et physiologique, burnout (épuisement émotionnel, dépersonnalisation, accomplissement personnel), et performance (mindfulness, résilience, fonctions cognitives) chez des professionnels de santé exposés à des interventions basées sur la nature","resultat_principal":"Les interventions basées sur la nature (activité en extérieur, réalité virtuelle, stimulation sensorielle réelle, accès visuel à la nature) réduisent de façon cohérente le stress psychologique et physiologique des professionnels de santé et améliorent certains indicateurs de performance, mais les effets sur le burnout sont mitigés, avec un bénéfice plus net sur l'épuisement et la dépersonnalisation que sur le sentiment d'accomplissement personnel.","niveau_de_preuve_et_limites":"Revue systématique synthétisant 20 études empiriques (jusqu'à octobre 2024) couvrant quatre domaines distincts d'interventions (nature réelle, réalité virtuelle, stimulation sensorielle, accès visuel), ce qui implique une hétérogénéité méthodologique importante entre les études incluses (types d'interventions, populations, mesures). Les résultats sur le burnout sont explicitement qualifiés de mitigés par les auteurs. Le résumé ne précise pas la qualité méthodologique individuelle des 20 études ni la présence ou non de groupes contrôles dans chacune d'elles.","angle_brana_sana":"Bien que centrée sur le milieu hospitalier/professionnel de santé plutôt que sur un contexte de retraite bien-être, cette revue conforte l'approche du bain de forêt pour la réduction du stress : elle suggère que l'exposition immersive à des éléments naturels (plutôt que simplement passive) produit des effets plus marqués, ce qui peut orienter la conception des parcours de sentier et des espaces de pause à Braña Sana vers une immersion sensorielle active plutôt que de simples vues sur la nature.","doi":"10.1177/19375867261481141","lien":"https://pubmed.ncbi.nlm.nih.gov/43006709/","source":"PubMed","pmid":"43006709","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Host specificity, seasonality, and urbanicity shape the gut microbiome of a synanthropic insect.","auteurs":"Noyes Hanna, Anika Nur-E-Jannat, Combs Julia, Khan Tamheeda, Just Josefine, Fitzpatrick Su, Angelini Rowan Graham, Angelini David R","date":"2026 Oct 31","type_etude":"autre","mecanisme_evalue":"Composition et diversité du microbiome intestinal d'un insecte (Jadera haematoloma) en fonction de l'hôte végétal, de la saisonnalité et du gradient d'urbanisation","resultat_principal":"Le microbiome intestinal de cet insecte est principalement structuré par la plante hôte (diversité plus élevée sur l'hôte ancestral vs dominance d'un seul ASV sur l'hôte introduit), avec des variations saisonnières des taxons accessoires, et l'urbanisation est associée à une plus grande dispersion (variance) de la composition microbienne, suggérant un stress environnemental, sans modification systématique de la richesse taxonomique.","niveau_de_preuve_et_limites":"Étude observationnelle en preprint (non encore évaluée par les pairs) sur un insecte (Jadera haematoloma), donc résultats non directement transposables à l'humain ou à d'autres écosystèmes. Le résumé ne précise pas la taille d'échantillon ni l'absence de groupe contrôle ; les associations décrites (urbanisation-dispersion, hôte-composition) sont corrélationnelles et non causales, comme le reconnaissent implicitement les auteurs (\"may be an indicator\").","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.64898/2026.10.28.762591","lien":"https://pubmed.ncbi.nlm.nih.gov/42990373/","source":"PubMed","pmid":"42990373","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Effects of a Virtual Nature-Based Intervention on Nursing Students' Academic Stress and Performance.","auteurs":"Zimmerman Stephanie, Manansingh Sherry, Brocker David, Cino Kathleen","date":"2026 Nov 02","type_etude":"autre","mecanisme_evalue":"Stress académique, anxiété de performance (test anxiety), résilience et performance académique (scores d'examen) en lien avec une exposition virtuelle à la nature","resultat_principal":"L'intervention virtuelle basée sur la nature (NBI) a été associée à une amélioration statistiquement significative des scores d'examen, mais sans changement significatif de l'anxiété de test, de la résilience ou du stress académique après l'intervention.","niveau_de_preuve_et_limites":"Échantillon réduit (44 participants), absence de groupe contrôle mentionnée dans le résumé, intervention virtuelle (pas d'exposition réelle à la nature), et le résumé ne précise pas la méthodologie de randomisation ni le suivi dans le temps ; les auteurs soulignent eux-mêmes le besoin de recherches supplémentaires.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1097/01.NEP.0000000000001629","lien":"https://pubmed.ncbi.nlm.nih.gov/42969570/","source":"PubMed","pmid":"42969570","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Association between household crowding at birth and mental health outcomes in school-aged children: retrospective analysis of data from the Born in Bradford cohort, UK.","auteurs":"Klaptocz Joanna, Blake Helen Abigail, Krenz Kimon, Knamiller Cathy, McEachan Rosemary Rc, Ucci Marcella, Sheringham Jessica","date":"2026-10-29","type_etude":"étude observationnelle","mecanisme_evalue":"Santé mentale infantile (score SDQ) en lien avec la densité d'occupation du logement (crowding) à la naissance, avec exploration d'un effet modificateur de la satisfaction parentale vis-à-vis des espaces verts environnants","resultat_principal":"Aucune association significative n'a été observée entre le niveau de surpeuplement du logement à la naissance et un score SDQ plus élevé 7 à 14 ans plus tard (OR ajusté 0,89, IC95% 0,76–1,05), et aucun effet modificateur de l'ethnicité ou de la satisfaction parentale envers les espaces verts n'a été détecté.","niveau_de_preuve_et_limites":"Étude de cohorte longitudinale observationnelle (n=3543) basée sur des données autodéclarées (nombre de personnes par chambre) et sur un questionnaire parental (SDQ) ; résultat principal négatif (absence d'association), ce qui limite toute conclusion causale ; les auteurs soulignent eux-mêmes la complexité de la relation et le rôle probable d'autres facteurs non mesurés ou insuffisamment capturés (composition du foyer, âge, état du logement, soutien familial et communautaire) ; la mesure de l'espace vert repose sur la satisfaction parentale déclarée au moment de la mesure du résultat, et non sur une mesure objective ou mesurée au moment de l'exposition initiale, ce qui limite la portée de l'absence d'effet modificateur observée.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1136/bmjph-2026-005483","lien":"https://pubmed.ncbi.nlm.nih.gov/42968915/","source":"PubMed","pmid":"42968915","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Green exercise as a potential pathway to promoting mental health in children and adolescents: a narrative review.","auteurs":"Huang Huihuang, Peng Xu","date":"2026-10-16","type_etude":"revue systématique","mecanisme_evalue":"Santé mentale chez l'enfant/l'adolescent via l'exercice en nature (restauration psychologique, régulation du stress, maîtrise/autonomie, engagement comportemental, soutien social et contextuel)","resultat_principal":"L'exercice en milieu naturel (\"green exercise\") est associé chez les enfants et adolescents à davantage d'affect positif, de satisfaction de vie, de bonheur et d'estime de soi, et dans certains contextes à moins de stress, d'anxiété ou de symptômes psychosomatiques, mais les effets varient fortement selon le type d'activité, la durée, les préférences individuelles et le contexte, sans qu'un effet causal universel ne soit démontré.","niveau_de_preuve_et_limites":"Revue narrative portant sur 12 études empiriques en anglais publiées depuis 2000 ; la majorité des preuves sont observationnelles ou basées sur l'auto-déclaration, l'exposition à la nature est caractérisée de manière incohérente selon les études, les mécanismes proposés sont rarement testés de façon prospective, les dimensions culturelles de la nature restent largement inexplorées, et les expériences brèves ne montrent pas de bénéfice psychologique additionnel constant lié à des environnements plus verts (contrairement aux études observationnelles ou interventions de plusieurs jours). Les auteurs soulignent que l'intensité, la fréquence et les conditions environnementales optimales restent incertaines.","angle_brana_sana":"Les activités physiques en extérieur proposées à Braña Sana (randonnée, travail de jardin, ateliers manuels en plein air) pourraient être présentées comme favorisant le bien-être émotionnel des jeunes participants, en insistant sur une pratique régulière et adaptée au contexte plutôt que sur un effet garanti ou universel.","pertinence_brana_sana":2,"doi":"10.3389/fpsyt.2026.1948114","lien":"https://pubmed.ncbi.nlm.nih.gov/42964678/","source":"PubMed","pmid":"42964678","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Exploring \"equigenesis\" in the association between the natural outdoor environment, mental health and death by suicide before and during the COVID-19 pandemic: a population-based cohort study of more than 2 million records in Northern Ireland.","auteurs":"Wang Ruoyu, Feng Zhiqiang, Pearce Jamie, Fry Rich, Maguire Aideen, Hunter Ruth F","date":"2026 Dec 15","type_etude":"étude observationnelle","mecanisme_evalue":"Association entre exposition à l'environnement naturel extérieur (espaces verts et bleus) et santé mentale (prescriptions psychiatriques, hospitalisations liées à la santé mentale, décès par suicide), avec effet modérateur de la défavorisation socioéconomique","resultat_principal":"Une plus forte proportion d'espaces verts/bleus dans le quartier est associée à une probabilité réduite de prescriptions liées à la santé mentale et à un risque réduit de décès par suicide (avant et pendant la pandémie), mais aucune association significative n'est observée avec les hospitalisations psychiatriques ; l'effet protecteur (\"equigenesis\") sur les inégalités socioéconomiques est plus marqué pour les prescriptions et hospitalisations pendant la pandémie, mais n'apparaît pour le suicide qu'avant la pandémie.","niveau_de_preuve_et_limites":"Étude de cohorte observationnelle à grande échelle (plus de 2 millions de participants en Irlande du Nord, 2017-2022) utilisant des modèles de Cox multiniveaux et des régressions logistiques ; il s'agit d'associations statistiques et non de preuves causales. Le résumé ne précise pas de limites méthodologiques explicites (biais de mesure de l'exposition au niveau du quartier plutôt qu'individuel, facteurs de confusion résiduels possibles, absence de données sur l'usage effectif des espaces naturels) — ces éléments ne sont pas mentionnés dans le résumé ; non précisé dans le résumé pour le reste.","doi":"10.1016/j.envres.2026.126054","lien":"https://pubmed.ncbi.nlm.nih.gov/42957027/","source":"PubMed","pmid":"42957027","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Do quality parks attract more users? A study of park quality, features, and usership following citywide park renovations in low-income urban areas.","auteurs":"Hong Houlin, Dunlap Ann, Wyka Katarzyna E, Thompson Rachel L, Rouyard Thomas, Thorpe Lorna E, Evenson Kelly R, Huang Terry T-K","date":"2026 Oct 23","type_etude":"étude observationnelle","mecanisme_evalue":"Qualité des parcs urbains (infrastructure, sécurité, esthétique, espaces verts) et son association avec la fréquentation/usage des espaces (usership), via indice de qualité (CPAT) et observation comportementale (SOPARC)","resultat_principal":"Après rénovation, les parcs ayant bénéficié du programme présentaient un indice de qualité significativement plus élevé que les parcs contrôles, et parmi les parcs rénovés, ceux avec une fréquentation accrue avaient de meilleurs scores d'espaces verts/esthétiques ainsi que des aménagements spécifiques (éclairage, paysagisme) plus fréquents — il s'agit d'associations, pas d'une démonstration causale directe de l'effet de chaque caractéristique sur l'usage.","niveau_de_preuve_et_limites":"Étude quasi-expérimentale avec groupe contrôle apparié (33 parcs intervention vs 21 parcs contrôle sociodémographiquement appariés), ce qui renforce la comparabilité mais reste observationnel sans randomisation ; le résumé ne précise pas la durée de suivi, la représentativité temporelle des observations SOPARC (saisonnalité, heures de la journée), ni d'ajustement statistique détaillé pour d'autres facteurs confondants (ex. changements démographiques du quartier) — ces éléments ne sont pas mentionnés et ne doivent pas être supposés.","doi":"10.1016/j.ufug.2026.129613","lien":"https://pubmed.ncbi.nlm.nih.gov/42948734/","source":"PubMed","pmid":"42948734","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"From therapeutic landscape perception to revisit intention: the mediating role of restorative experience in Palandöken Urban Forest","auteurs":"Göral Murat","date":"2026-10-13","type_etude":"étude observationnelle","mecanisme_evalue":"Perception du paysage thérapeutique (dimensions naturelle, esthétique, sociale), expérience restaurative perçue, satisfaction du visiteur et intention de revisite","resultat_principal":"Les dimensions de perception du paysage thérapeutique sont associées positivement à l'expérience restaurative, elle-même associée positivement à la satisfaction et à l'intention de revisite, avec des effets indirects significatifs mais des associations directes paysage→revisite statistiquement significatives mais de très faible ampleur (f²=0,010-0,017) ; il s'agit d'associations issues d'un modèle PLS-SEM, non d'une preuve d'effet causal.","niveau_de_preuve_et_limites":"Étude transversale (cross-sectional) sur 413 visiteurs, données auto-rapportées collectées au même moment pour toutes les variables, ce qui empêche toute interprétation causale ou temporelle (les auteurs le précisent explicitement) ; pas de groupe contrôle ; mesure par questionnaire en face-à-face, modèle PLS-SEM avec variance expliquée modérée (48,7%-54,7%) ; satisfaction et intention de revisite sont traitées comme des résultats touristiques/récréatifs, pas comme des résultats de santé.","angle_brana_sana":"La perception de qualités paysagères (naturelles, esthétiques, sociales) et l'expérience restaurative ressentie semblent associées à l'envie de revenir sur un site naturel accessible — un signal cohérent avec l'intérêt de soigner la conception des sentiers et espaces de bain de forêt à Braña Sana (diversité paysagère, esthétique, convivialité) pour favoriser une expérience restaurative perçue et la fidélisation des visiteurs, sans que cela constitue une preuve d'effet sur la santé.","pertinence_brana_sana":2,"doi":"10.3389/fpubh.2026.1946982","lien":"https://pubmed.ncbi.nlm.nih.gov/42947813/","source":"PubMed","pmid":"42947813","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Greener but not always more comfortable: Supply-perception mismatch and urban background heterogeneity in street thermal-acoustic comfort.","auteurs":"Wu Yuwei, Liu Chen, Li Qianqian, Jia Weiyi, Zhang Man","date":"2026 Nov 26","type_etude":"étude observationnelle","mecanisme_evalue":"Confort thermo-acoustique objectif vs perçu en milieu urbain, et modulation de cette relation par les caractéristiques de l'espace vert de rue (densité piétonne visuelle, taux d'ombrage)","resultat_principal":"L'étude montre une hétérogénéité spatiale marquée du décalage entre confort thermo-acoustique objectif et perçu (DOSM), avec un mismatch de type \"surplus de perception\" dominant dans les zones commerciales denses (45,2%), et identifie des seuils non linéaires de certaines caractéristiques végétales de rue (ex. densité piétonne visuelle ≥0,65, taux d'ombrage 0,65-0,82) associés à une réduction du DOSM de 9,3% à 9,6% ; il s'agit d'associations statistiques issues d'un modèle (LightGBM-SHAP), pas d'une démonstration causale.","niveau_de_preuve_et_limites":"Étude observationnelle menée uniquement à Hangzhou (Chine), basée sur des données multi-sources et un cadre analytique (SPMD/LightGBM-SHAP) ; nature corrélationnelle et contextuelle (un seul site urbain), limitant la généralisation à d'autres contextes culturels/climatiques ou à des environnements non urbains ; le résumé ne précise pas la taille d'échantillon, l'absence de groupe contrôle n'est pas discutée explicitement, ni d'autres biais méthodologiques — non précisé dans le résumé au-delà de ces éléments.","angle_brana_sana":"Cette étude porte sur l'optimisation du verdissement et du confort thermo-acoustique dans des rues urbaines denses en Chine, un contexte très différent du cadre naturel et rural de Braña Sana (sentiers en forêt, Asturies) ; aucun lien concret et honnête ne se justifie avec les pratiques de bain de forêt ou l'aménagement des sentiers du centre.","doi":"10.1016/j.jenvman.2026.131242","lien":"https://pubmed.ncbi.nlm.nih.gov/42933355/","source":"PubMed","pmid":"42933355","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Exposomic Determinants in Heart Failure Among Older Adults - Mechanistic Links, Clinical Evidence, and Future Perspectives.","auteurs":"Hahad O, Münzel T, Zheng J, Valar A, Hrytseniuk Y, Ramasamy B, Ghosh A, Mishra M, Das T, Lurz P, Daiber A, Kuntic M","date":"2026 Oct 24","type_etude":"revue systématique","mecanisme_evalue":"Convergence de l'exposome (pollution de l'air, bruit, température, métaux/chimiques, lumière artificielle nocturne, environnement social, verdure/marchabilité) avec le vieillissement cardiovasculaire via stress oxydatif, dysfonction mitochondriale, inflammaging, altération de l'autophagie/protéostase, altérations génomiques/épigénétiques, sénescence cellulaire, dérégulation neurohormonale et circadienne, et fibrose/remodelage maladaptatif","resultat_principal":"Les auteurs proposent, à partir d'une synthèse de la littérature, que de multiples facteurs environnementaux chroniques (dont le faible accès aux espaces verts et la faible marchabilité) sont associés à l'incidence, aux décompensations et au pronostic de l'insuffisance cardiaque chez les personnes âgées, et que ces facteurs convergent avec le vieillissement biologique sur des voies mécanistiques communes ; il s'agit d'une association épidémiologique et d'un cadre conceptuel mécanistique, non d'une démonstration causale directe.","niveau_de_preuve_et_limites":"Revue narrative/perspective synthétisant des études épidémiologiques et mécanistiques hétérogènes ; non précisé dans le résumé quant au nombre d'études incluses, à une méthodologie systématique formelle, ou à la qualité méthodologique des études sources. Les liens exposome-HF rapportés sont principalement des associations épidémiologiques, les mécanismes biologiques étant en partie extrapolés de données précliniques ; aucune limite quantitative (taille d'échantillon, biais spécifiques) n'est mentionnée dans le résumé.","doi":"10.1007/s11897-026-00781-w","lien":"https://pubmed.ncbi.nlm.nih.gov/42925369/","source":"PubMed","pmid":"42925369","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"From static supply to time-weighted path-based dynamic blue-green exposure: spatial mismatches between blue-green environments and platform-recorded walking use in Tianjin.","auteurs":"Jia Xiaohan, Chen Yujia","date":"2026-10-08","type_etude":"étude observationnelle","mecanisme_evalue":"Exposition environnementale aux espaces bleus-verts (supply statique vs exposition dynamique pondérée par trajet) et son rapport spatial avec l'activité de marche enregistrée sur plateforme (stress environnemental, usage)","resultat_principal":"L'étude montre, par des coefficients de Gini pondérés par population et une analyse de mismatch par quadrants, que l'offre statique de ressources bleu-vert (SBG), l'exposition dynamique basée sur les trajets (DBG) et le stress environnemental (ES) présentent des patterns spatiaux distincts par rapport à la densité d'activité de marche (WAD) ; les modèles de machine learning expliquent très peu de variance (R2≈0,051), suggérant une association exploratoire plutôt qu'une preuve robuste de lien causal.","niveau_de_preuve_et_limites":"Étude observationnelle transversale basée sur des données de trajectoires de marche partagées publiquement (application Keep), street-view, télédétection et données socio-économiques à Tianjin ; pas de groupe contrôle ni de design expérimental ; performance prédictive du Random Forest très faible (R² = 0,051 ± 0,027), explicitement qualifiée par les auteurs d'exploratoire et complémentaire plutôt que confirmatoire ; les utilisateurs de l'app Keep ne représentent probablement pas l'ensemble de la population (biais de sélection potentiel, non discuté explicitement comme tel mais implicite au choix de données de plateforme) ; résultats descriptifs destinés à orienter une vérification de terrain ultérieure, non à établir un effet causal.","doi":"10.3389/fpubh.2026.1967963","lien":"https://pubmed.ncbi.nlm.nih.gov/42923157/","source":"PubMed","pmid":"42923157","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Age-Dependent Heterogeneity Trends in the Associations between Urban Green Space and Cardiovascular Health in a Humid-Subtropical Megacity","auteurs":"Wang Chengkang, Pei Xinyu, Mao Yajing, Kang Lina, Xu Biao, Jin Jun, Cao Jiajie, Liang Huilin","date":"2026 Sep 22","type_etude":"étude observationnelle","mecanisme_evalue":"Associations entre espaces verts urbains, qualité de l'air (NO2, SO2, PM2.5), marqueurs métaboliques et hémodynamiques, et santé cardiovasculaire (cardiopathie ischémique chronique, insuffisance cardiaque)","resultat_principal":"Dans une cohorte clinique de 23 312 patients à Nanjing, les voies liées à la qualité de l'air expliquent plus de 75% de la contribution statistique relative aux modèles, avec des associations distinctes entre végétation et pathologies cardiovasculaires (effet inverse avec NO2/SO2 pour la cardiopathie ischémique chronique), mais les analyses stratifiées par âge montrent une hétérogénéité non significative et des tailles d'effet très faibles.","niveau_de_preuve_et_limites":"Étude observationnelle basée sur une modélisation statistique (gradient boosting + équations structurelles) sans groupe contrôle expérimental ; les auteurs précisent explicitement que l'interprétation d'un effet \"aérodynamique\" reste spéculative faute de données morphologiques ou de dynamique des fluides ; les pentes des sous-groupes d'âge sont non significatives et les effets sont qualifiés de \"fragiles\" par les auteurs eux-mêmes ; association statistique uniquement, aucune preuve causale établie.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1021/acs.est.6c08296","lien":"https://pubmed.ncbi.nlm.nih.gov/42916220/","source":"PubMed","pmid":"42916220","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Primary Care Physicians' Perspectives on Implementing Cognitive Behavioral Therapy for Insomnia in Japan: A Qualitative Study Using the Consolidated Framework for Implementation Research.","auteurs":"Shinno Seina, Sakata Masatsugu, Honda Yukiko, Shinohara Kiyomi, Sahker Ethan, Kusukawa Kazuko, Yamamura Masako, Takamura Akiteru, Furukawa Toshi A, Hayashi Hiroyuki","date":"2026 Nov 18","type_etude":"autre","mecanisme_evalue":"Perceptions et pratiques des médecins généralistes concernant la mise en œuvre de la thérapie cognitivo-comportementale pour l'insomnie (CBT-I), traitement non pharmacologique du sommeil","resultat_principal":"Les médecins généralistes japonais valorisent les soins comportementaux pour l'insomnie et souhaitent réduire le recours aux médicaments, mais manquent de confiance et de parcours concret pour délivrer la CBT-I en routine, et demandent des outils simplifiés, formations et soutien interprofessionnel.","niveau_de_preuve_et_limites":"Étude qualitative descriptive (entretiens semi-structurés) portant sur 22 médecins généralistes de différentes régions et contextes cliniques au Japon ; approche inductive-déductive avec analyse thématique mappée sur le cadre CFIR. Il s'agit d'un recueil de perceptions, non d'une mesure d'efficacité clinique de la CBT-I elle-même ; les résultats sont spécifiques au contexte japonais et reposent sur un échantillon limité et des données auto-rapportées, sans groupe contrôle ni mesure quantitative d'impact.","doi":"10.1002/jgf2.70203","lien":"https://pubmed.ncbi.nlm.nih.gov/43054856/","source":"PubMed","pmid":"43054856","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Melatonin, brain clearance, and dementia prevention: Revisiting the pineal-perivascular Axis.","auteurs":"Dabiry Ghezal, Mohamed Doha, Kumar Kavipriya Dev Sabareeswara, Fazah Yousra Ali, Ghazali Zainabbul, Ahad Abiya","date":"2026 Nov 18","type_etude":"revue systématique","mecanisme_evalue":"Mélatonine (endogène pinéale vs administrée), transport périvasculaire et clairance cérébrale de l'amyloïde-β et de la tau","resultat_principal":"La revue critique conclut qu'aucune étude identifiée n'a testé le rôle causal de la mélatonine endogène pinéale sur la clairance cérébrale (aucune manipulation de la mélatonine endogène combinée à une mesure de clairance, ni d'antagoniste des récepteurs testé) ; les données positives disponibles proviennent uniquement d'administrations pharmacologiques de mélatonine à des doses très supérieures aux doses cliniques standard (40 à 900 fois après normalisation par surface corporelle), ce qui limite fortement l'extrapolation à la supplémentation courante ou à un effet préventif sur la démence.","niveau_de_preuve_et_limites":"Revue narrative critique (pas de méta-analyse quantitative) basée sur recherche systématique (MEDLINE, Scopus, Cochrane) jusqu'à fin octobre 2026. Limites explicitement signalées par les auteurs : absence totale d'études manipulant la mélatonine endogène avec mesure de clairance ; absence d'essais combinant antagoniste/délétion des récepteurs avec un critère de clairance ; doses précliniques positives très supérieures aux doses humaines standard (2 à 4 ordres de grandeur en poids corporel, 40-900x en surface corporelle) ; différences de timing de sécrétion de mélatonine entre rongeurs nocturnes et humains diurnes limitant la translation ; absence chez l'humain d'une mesure non invasive validée de la clairance cérébrale. Le rôle causal de la mélatonine endogène reste non testé.","doi":"10.1016/j.yfrne.2026.101301","lien":"https://pubmed.ncbi.nlm.nih.gov/43051465/","source":"PubMed","pmid":"43051465","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Chronotype, Mediterranean diet adherence, and FINDRISK score in adults: A cross-sectional mediation analysis.","auteurs":"Baspinar Busra","date":"2026 Nov 18","type_etude":"étude observationnelle","mecanisme_evalue":"Chronotype (matinalité/vespéralité), adhérence au régime méditerranéen, et risque de diabète (score FINDRISK)","resultat_principal":"Un chronotype plus matinal est associé à une meilleure adhérence au régime méditerranéen et à un score de risque de diabète plus faible, avec une petite association indirecte statistiquement significative entre chronotype et risque de diabète passant par l'adhérence alimentaire ; ces associations sont statistiques et non causales.","niveau_de_preuve_et_limites":"Étude transversale (n=2302) avec échantillonnage en boule de neige (non représentatif), ne permettant pas d'établir de causalité. Les auteurs soulignent un chevauchement conceptuel entre les échelles MEDAS-14 et FINDRISK, et qualifient le résultat de médiation comme générateur d'hypothèses nécessitant confirmation par des études longitudinales avec des critères de jugement indépendants du médiateur proposé.","angle_brana_sana":"Lien plausible avec les piliers sommeil et nutrition/longévité : pourrait appuyer une sensibilisation sur l'importance d'un rythme circadien régulier (horaires de repas, exposition lumière, sommeil) en lien avec les choix alimentaires méditerranéens proposés au centre, mais la preuve reste corrélationnelle et transversale, donc à présenter avec prudence sans affirmer d'effet causal.","pertinence_brana_sana":2,"doi":"10.1080/07420528.2026.2763619","lien":"https://pubmed.ncbi.nlm.nih.gov/43049164/","source":"PubMed","pmid":"43049164","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Understanding Sleep in Ultramarathon Runners: An Exploratory Assessment during a Training Week.","auteurs":"Daniel Natália Vilela Silva, Belli Taisa, Esteves Andrea Maculano","date":"2026 Dec 17","type_etude":"étude observationnelle","mecanisme_evalue":"Sommeil (chronotype, qualité du sommeil, comportements liés au sommeil, somnolence diurne, jetlag social) chez des athlètes d'ultramarathon","resultat_principal":"Sur 15 coureurs d'ultramarathon suivis pendant une semaine d'entraînement typique, la majorité étaient des chronotypes du matin, se couchaient et se levaient plus tôt les jours de travail que les jours libres, dormaient souvent moins de 8 heures par nuit, et près de la moitié présentaient une mauvaise qualité de sommeil ou de mauvais comportements liés au sommeil, bien que la plupart ne rapportaient pas de somnolence diurne excessive — un profil de santé du sommeil hétérogène et multidimensionnel.","niveau_de_preuve_et_limites":"Étude exploratoire observationnelle portant sur un très petit échantillon (n=15), exclusivement masculin, sans groupe contrôle ; les données reposent sur des questionnaires auto-rapportés et un journal de sommeil sur une seule semaine, ce qui limite la généralisabilité et ne permet pas d'établir de lien causal entre pratique de l'ultramarathon et qualité du sommeil.","angle_brana_sana":"Les résultats illustrent l'impact du décalage entre rythme imposé par l'entraînement/travail et rythme circadien naturel (jetlag social) sur la qualité du sommeil, ce qui peut nourrir une réflexion dans le programme repos/sommeil de Braña Sana sur l'importance de respecter le chronotype individuel et d'accompagner les pratiquants d'activités physiques intenses (randonneurs, travailleurs manuels) vers une meilleure hygiène de sommeil pendant leur séjour.","pertinence_brana_sana":2,"doi":"10.1055/s-0046-1829896","lien":"https://pubmed.ncbi.nlm.nih.gov/43048722/","source":"PubMed","pmid":"43048722","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Suspected Functional Adrenal Insufficiency and Unmasking of Hashimoto's Thyroiditis: A Case for Diagnostic and Therapeutic Restraint.","auteurs":"Waqas Nishat, Thula Poorvaja, Ravipati Shivani, Agarwal Tanya, Singh Tejinder","date":"2026-10-18","type_etude":"cas clinique","mecanisme_evalue":"Axe hypothalamo-hypophyso-surrénalien (cortisol, ACTH) et interaction cortisol-TSH, en lien avec la perturbation du rythme circadien par le travail de nuit et la migration","resultat_principal":"Chez un patient dont le cycle veille-sommeil a été perturbé par le travail de nuit et la migration, un tableau évocateur d'insuffisance surrénalienne secondaire s'est résolu complètement après arrêt du travail de nuit, restauration du sommeil et réhabilitation nutritionnelle, sans corticothérapie ; une thyroïdite de Hashimoto auparavant masquée a ensuite été révélée à 6 mois.","niveau_de_preuve_et_limites":"Il s'agit d'un cas clinique unique (n=1), sans groupe contrôle, ce qui ne permet aucune généralisation ni établissement de causalité ; les auteurs eux-mêmes présentent ce cas comme illustratif et appellent à la prudence diagnostique et thérapeutique plutôt qu'à une conclusion ferme sur le mécanisme physiopathologique.","angle_brana_sana":"Ce cas illustre, de façon anecdotique mais parlante, comment la restauration d'un rythme veille-sommeil régulier et une réalimentation adaptée peuvent accompagner la résolution de troubles fonctionnels de l'axe surrénalien liés à la désynchronisation circadienne (travail de nuit, décalage horaire) — cohérent avec l'approche du pilier repos/sommeil de Braña Sana, sans toutefois constituer une preuve clinique généralisable.","pertinence_brana_sana":2,"doi":"10.1177/11795514261500543","lien":"https://pubmed.ncbi.nlm.nih.gov/43048033/","source":"PubMed","pmid":"43048033","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Effect of a Nurse-Led Sleep Hygiene and Progressive Muscle Relaxation Intervention on Sleep Quality Among Obese Pregnant Women: A Randomized Controlled Trial.","auteurs":"Mohamed Mohamed Yehia Ali, Shokr Eman A, Zabin Loai M, Ahmed Asmaa Abdallah, Abdeldaiem Nabila Abdelkader, Fatehallah Reham Samir, Hegazy Mona Abd El-Kareem, Behery Ebtesam Abdel Nabi Abdel Hamid","date":"2026-11-17","type_etude":"RCT","mecanisme_evalue":"Qualité du sommeil, hygiène du sommeil et troubles du sommeil via relaxation musculaire progressive et éducation à l'hygiène du sommeil (évalués par PSQI, GSAQ, SHI)","resultat_principal":"Chez des femmes enceintes obèses souffrant de troubles du sommeil, une intervention combinant relaxation musculaire progressive et éducation à l'hygiène du sommeil, menée par des infirmières, a amélioré significativement la qualité du sommeil, les troubles du sommeil et les pratiques d'hygiène du sommeil par rapport aux soins prénataux standards, avec des tailles d'effet larges et un risque de mauvaise qualité de sommeil réduit de moitié dans le groupe intervention.","niveau_de_preuve_et_limites":"Essai contrôlé randomisé avec échantillon modeste (100 participantes, population spécifique de femmes enceintes obèses), évaluation du sommeil basée uniquement sur des questionnaires auto-rapportés (pas de mesure objective comme l'actigraphie ou la polysomnographie), et absence de suivi à long terme mentionnée explicitement par les auteurs comme limite ; ces derniers recommandent des recherches futures avec évaluations objectives du sommeil et suivi prolongé.","doi":"10.1155/nrp/2552295","lien":"https://pubmed.ncbi.nlm.nih.gov/43047746/","source":"PubMed","pmid":"43047746","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Sleep regularity associates with brain health in older adults.","auteurs":"Rocha Salma C, Callies Lana S, Olzinski Molly, Chen Coty, Diaz Valentina E, Lo Carina, Licata Sophia, Buxton Jessica, Pandher Natalie, Li Esther, Yack Leslie, Coppola Quentin, Cobigo Yann, Staffaroni Adam M, Rabinovici Gil D, Saloner Rowan, Neylan Thomas C, Kramer Joel H, Walsh Christine M, Casaletto Kaitlin B, Paolillo Emily W","date":"2026 Nov 28","type_etude":"étude observationnelle","mecanisme_evalue":"Régularité du sommeil (consistance jour-à-jour des horaires veille/sommeil mesurée par actigraphie) et son association avec le vieillissement cérébral : cognition, volumes cérébraux, hyperintensités de la substance blanche, intégrité de la substance blanche, symptômes dépressifs","resultat_principal":"Chez 149 adultes âgés sans démence, une plus grande régularité des horaires de sommeil (mesurée sur 30 jours d'actigraphie) est associée à une meilleure cognition globale, fonction exécutive et mémoire, moins de symptômes dépressifs, des volumes cérébraux plus importants, moins d'hyperintensités de la substance blanche et une meilleure intégrité de la substance blanche ; la régularité du sommeil est un prédicteur plus fort que la durée moyenne ou la variabilité de durée du sommeil pour l'ensemble de ces résultats.","niveau_de_preuve_et_limites":"Étude observationnelle transversale (régressions linéaires) sur un échantillon modéré de 149 participants fonctionnellement non altérés ; les résultats sont des associations statistiques et ne démontrent pas de lien causal entre régularité du sommeil et santé cérébrale. Le résumé ne précise pas d'autres limites (pas de mention de groupe contrôle distinct, d'hétérogénéité méthodologique particulière ou de biais spécifiques au-delà de la nature corrélationnelle) ; l'absence de suivi longitudinal n'est pas explicitement mentionnée mais le design semble être une coupe transversale avec mesure actigraphique de 30 jours.","doi":"10.1002/alz.72009","lien":"https://pubmed.ncbi.nlm.nih.gov/43046883/","source":"PubMed","pmid":"43046883","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Wearable sensor-based measures on light at day and night, rest-activity circadian rhythm and sleep, and mental health among Hong Kong nurses: a 7-day repeated-measures study","auteurs":"Weng Xueqiong, Liu Yufei, Tang Natalie Hy, Ma Julie Yt, Wang Feng, Li Beixi, Liao Gengze, Li Wenzhen, Wong Samuel Yeung-Shan, Ho Amy Wing-Yin, Ho Chung Shun, Arrandale Victoria H, Tse Lap Ah","date":"2026 Nov 17","type_etude":"étude observationnelle","mecanisme_evalue":"Rythme circadien repos-activité, exposition à la lumière jour/nuit, sommeil et santé mentale (mesurés par capteurs portables)","resultat_principal":"Aucun résumé disponible — seul le titre indique une étude en mesures répétées sur 7 jours chez des infirmières de Hong Kong examinant l'association entre exposition lumineuse, rythme circadien repos-activité, sommeil et santé mentale ; aucun résultat chiffré ou conclusion ne peut être extrait sans l'abstract.","niveau_de_preuve_et_limites":"Non précisé dans le résumé — aucun résumé (abstract) n'était disponible pour cette fiche ; seules les informations du titre et des métadonnées ont été utilisées. Le design en mesures répétées sur 7 jours suggère une étude observationnelle de petite durée, mais la taille d'échantillon, la présence d'un groupe contrôle, les biais potentiels et les limites méthodologiques ne sont pas connus faute de résumé disponible.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1136/oemed-2026-111199","lien":"https://pubmed.ncbi.nlm.nih.gov/43045497/","source":"PubMed","pmid":"43045497","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Sleep and Neurodegenerative Diseases: Understanding the Bidirectional Relationship","auteurs":"Baumgartner Alexander J, Feuerstein Jeanne S, Resman Kathleen, Downton Katherine D, Lum Hillary D, Amara Amy W","date":"2027 Feb 03","type_etude":"revue systématique","mecanisme_evalue":"Sommeil et rythmes circadiens en lien avec la neurodégénérescence (protéostase, neuroinflammation, stress oxydatif, clairance glymphatique) dans les maladies à corps de Lewy","resultat_principal":"La revue synthétise des preuves cliniques, épidémiologiques et neurobiologiques suggérant une relation bidirectionnelle entre troubles du sommeil/rythme circadien et neurodégénérescence dans les maladies à corps de Lewy, sans établir de causalité directe.","niveau_de_preuve_et_limites":"Il s'agit d'une revue narrative synthétisant des études hétérogènes (cliniques, épidémiologiques, neurobiologiques) ; le résumé ne précise pas de méthodologie systématique explicite (critères d'inclusion, évaluation de la qualité des études), ni de taille d'échantillon globale, ni de groupe contrôle — niveau de preuve de type synthèse qualitative, non quantitative.","angle_brana_sana":"Le lien entre qualité du sommeil et santé neurologique à long terme renforce l'intérêt d'un programme de repos structuré (hygiène du sommeil, rythmes circadiens, réduction du stress) comme axe de prévention dans une approche de santé préventive globale, sans prétendre à un effet thérapeutique sur les maladies neurodégénératives elles-mêmes.","pertinence_brana_sana":2,"doi":"10.1016/j.ncl.2026.07.010","lien":"https://pubmed.ncbi.nlm.nih.gov/43045443/","source":"PubMed","pmid":"43045443","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Circadian Rhythm Disruptions: Causes, Consequences, and Treatment Approaches.","auteurs":"Aristova Maria, Abbott Sabra M","date":"2027 Feb 08","type_etude":"revue systématique","mecanisme_evalue":"Rythmes circadiens (noyau suprachiasmatique, gènes horloges CLOCK, BMAL1, PER, CRY) et leur régulation par des zeitgebers (lumière, repas, exercice, interactions sociales), impactant sommeil, métabolisme, système cardiovasculaire et santé neuropsychiatrique","resultat_principal":"La revue synthétise les mécanismes de régulation circadienne et montre que leur dérèglement est associé à des troubles du sommeil, métaboliques, cardiovasculaires, neurodégénératifs, psychiatriques et au risque de cancer ; l'optimisation des zeitgebers (lumière, mélatonine) est présentée comme approche thérapeutique pour restaurer l'alignement circadien.","niveau_de_preuve_et_limites":"Il s'agit d'une revue narrative/synthèse (pas une méta-analyse quantitative) compilant des données issues de multiples études de mécanismes et d'observations cliniques ; le résumé ne précise pas de méthodologie systématique explicite (critères d'inclusion, nombre d'études analysées) ni de limites spécifiques — non précisé dans le résumé. Les liens entre dérèglement circadien et pathologies (métabolique, cardiovasculaire, cancer) sont présentés comme des associations issues de la littérature, non comme des preuves causales directes établies par cette revue elle-même.","angle_brana_sana":"Cette revue conforte l'approche du pilier repos/sommeil de Braña Sana : l'importance de l'exposition lumineuse naturelle (notamment lors des sentiers de bain de forêt en extérieur), la régularité des horaires de repas et d'activité, et la limitation de la lumière artificielle le soir peuvent être présentées aux visiteurs comme des leviers simples pour soutenir l'alignement circadien, en cohérence avec les programmes de repos proposés.","pertinence_brana_sana":3,"doi":"10.1016/j.ncl.2026.07.012","lien":"https://pubmed.ncbi.nlm.nih.gov/43045440/","source":"PubMed","pmid":"43045440","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Neuroscience-informed psychoeducation for sleep disorders in psychiatry.","auteurs":"Nami Mohammad","date":"2026-10-05","type_etude":"revue systématique","mecanisme_evalue":"Mécanismes de régulation du sommeil (rythmes circadiens, homéostasie du sommeil, systèmes de neurotransmetteurs, réseaux cérébraux) et leur lien bidirectionnel avec des troubles psychiatriques (dépression, anxiété, PTSD, TDAH)","resultat_principal":"Ce chapitre narratif présente une approche de psychoéducation informée par les neurosciences (NIPE), combinée à la TCC pour l'insomnie, des stratégies de mindfulness et des outils numériques personnalisés, et argumente qu'elle constitue une stratégie clinique pertinente pour améliorer l'engagement des patients et les résultats liés aux troubles du sommeil.","niveau_de_preuve_et_limites":"Il s'agit d'un chapitre de revue narrative (non une méta-analyse ou un essai contrôlé) qui synthétise des mécanismes et une approche conceptuelle ; le résumé ne précise pas de données quantitatives, de taille d'échantillon, de méthodologie de sélection des études, ni de limites méthodologiques explicites — à noter que les affirmations sur l'efficacité de la NIPE reposent sur une synthèse théorique plutôt que sur des résultats empiriques consolidés présentés dans l'abstract.","angle_brana_sana":"Les composantes mentionnées (psychoéducation sur le sommeil, stratégies de mindfulness, approche transdiagnostique du sommeil perturbé) résonnent avec un programme de repos/sommeil incluant des sessions d'information sur l'hygiène du sommeil et de pleine conscience, mais l'étude ne porte pas sur un contexte de nature ou de retraite et reste à un niveau conceptuel/clinique psychiatrique, donc le lien doit rester prudent et non direct.","pertinence_brana_sana":2,"doi":"10.1016/bs.pbr.2026.08.006","lien":"https://pubmed.ncbi.nlm.nih.gov/43045220/","source":"PubMed","pmid":"43045220","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Depression, but Not Anxiety, Is Associated With Poorer Working Memory in Adolescent Psychiatric Patients.","auteurs":"Hwang Kyu-Sic, Yang Chan-Mo, Kim Hoyoung","date":"2026 Nov 04","type_etude":"étude observationnelle","mecanisme_evalue":"Mémoire de travail (WMI) en lien avec les symptômes dépressifs (dont symptômes physiologiques type sommeil/énergie) et anxieux chez des adolescents psychiatriques ; hypothèses mécanistiques évoquées : perturbation du rythme circadien, dysfonction du réseau dorsolatéral préfrontal/frontopariétal, déficits de substance blanche.","resultat_principal":"Chez 82 adolescents en soins psychiatriques, seule la dépression (et non l'anxiété) était significativement corrélée négativement à la mémoire de travail, et parmi les sous-échelles de dépression, c'est spécifiquement la sous-échelle physiologique (incluant les troubles du sommeil, la baisse d'activité et d'énergie) qui prédisait significativement un WMI plus faible — il s'agit d'une association statistique, pas d'une preuve de causalité.","niveau_de_preuve_et_limites":"Étude observationnelle transversale sur un échantillon réduit (n=82) issu d'une population clinique unique (hôpital universitaire), sans groupe contrôle sain mentionné ; les corrélations rapportées sont modestes (r=-0.24) et de type associatif, ne permettant pas d'établir de lien causal ; le résumé ne précise pas d'autres limites méthodologiques (ex. design longitudinal absent, biais de sélection potentiel).","angle_brana_sana":"Ce résultat suggère que les symptômes physiologiques dépressifs liés au sommeil et à l'énergie pourraient être associés à des difficultés cognitives chez les adolescents ; un programme de repos/sommeil structuré pourrait théoriquement constituer un axe complémentaire d'intervention, mais cela reste une population clinique spécifique (adolescents en soins psychiatriques) et l'étude ne teste aucune intervention de sommeil — le lien avec les activités de Braña Sana reste donc indirect et prudent.","pertinence_brana_sana":1,"doi":"10.30773/pi.2026.0295","lien":"https://pubmed.ncbi.nlm.nih.gov/43041084/","source":"PubMed","pmid":"43041084","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Climate change anxiety and insomnia in nursing students: implications for health promotion?","auteurs":"Okuyan Canan Birimoglu, Uzun Sevda, Yanik Derya, Ediz Çiçek","date":"2026 Nov 16","type_etude":"étude observationnelle","mecanisme_evalue":"Anxiété liée au changement climatique et sévérité de l'insomnie (sommeil)","resultat_principal":"Une relation positive modérée est observée entre l'anxiété climatique (CCAS) et la sévérité de l'insomnie (ISI) chez des étudiants infirmiers (r=0,372, p<0,001), l'anxiété climatique expliquant 13,9% de la variance de l'insomnie dans un modèle de régression — association statistique, non une preuve de causalité.","niveau_de_preuve_et_limites":"Étude transversale descriptive (n=512) menée dans une seule région (Méditerranée turque) sur une population spécifique (étudiants infirmiers), ce qui limite la généralisabilité ; design corrélationnel sans groupe contrôle ni suivi longitudinal, empêchant toute inférence causale ; les auteurs eux-mêmes appellent à des études longitudinales et multicentriques pour confirmer les résultats. Autres facteurs confondants possibles (durée de sommeil, tabagisme, troubles mentaux chroniques, exposition aux écrans) mentionnés mais non isolés statistiquement dans le résumé.","angle_brana_sana":"Illustre l'importance d'intégrer une dimension éco-anxiété/stress environnemental dans les programmes de sommeil et de gestion du stress proposés à Braña Sana (ateliers d'hygiène du sommeil, mindfulness et reconnexion à la nature comme leviers potentiels de résilience face à l'anxiété climatique), bien que l'étude ne teste aucune intervention de ce type.","pertinence_brana_sana":2,"doi":"10.1177/17579759261496894","lien":"https://pubmed.ncbi.nlm.nih.gov/43037250/","source":"PubMed","pmid":"43037250","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Exploring the role of nicotine and smoking in sleep behaviours: A multi-variable Mendelian randomisation study","auteurs":"Page Stephanie, Gibson Mark, Munafò Marcus, Khouja Jasmine, Richmond Rebecca","date":"2026 Nov 11","type_etude":"autre","mecanisme_evalue":"Métabolisme de la nicotine (ratio métabolite nicotinique) et intensité tabagique en lien avec le chronotype, la facilité de réveil, la sieste, les symptômes d'insomnie, la somnolence diurne et la durée de sommeil, via randomisation mendélienne multivariable","resultat_principal":"Chez les fumeurs actuels, un métabolisme de la nicotine plus rapide (NMR plus élevé) est associé causalement à une moindre probabilité d'être \"du soir\", à une facilité accrue de se lever le matin et à une probabilité accrue de faire la sieste, indépendamment de l'intensité tabagique ; aucune preuve cohérente d'effet causal sur l'insomnie ou la durée de sommeil, mais une durée de sommeil plus longue semble réduire le NMR.","niveau_de_preuve_et_limites":"Étude de randomisation mendélienne (pas un essai contrôlé), basée sur des données GWAS summary-level et UK Biobank chez des fumeurs actuels d'ascendance européenne, taille d'échantillon variable selon les analyses (N=5185 à 487153) ; les résultats reflètent des associations causales estimées par MR, avec des hypothèses méthodologiques propres à cette approche (pléiotropie, instruments génétiques) non détaillées comme limites explicites dans le résumé ; population restreinte aux fumeurs actuels, limitant la généralisabilité aux non-fumeurs.","angle_brana_sana":"Aucun lien concret et honnête avec les piliers Braña Sana (sieste, marche) : l'étude porte spécifiquement sur le métabolisme de la nicotine chez les fumeurs et ses effets sur des comportements de sommeil, sans rapport avec les pratiques de sieste ou de marche promues par le centre.","pertinence_brana_sana":0,"doi":"10.1111/add.70696","lien":"https://pubmed.ncbi.nlm.nih.gov/43012143/","source":"PubMed","pmid":"43012143","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Effects of a wearable-assisted walking program on longitudinal trajectories of cognitive function and loneliness in older adults: a randomized controlled trial.","auteurs":"Wu Cheng-En, Huang Wei-Yang","date":"2026 Aug 13","type_etude":"RCT","mecanisme_evalue":"Fonction cognitive (MoCA) et sentiment de solitude (échelle UCLA 8 items), en lien avec la masse musculaire squelettique appendiculaire et la mobilité fonctionnelle (timed up-and-go) de base","resultat_principal":"Chez des seniors vivant en communauté, un programme de marche assistée par dispositif connecté pendant 12 semaines est associé à une trajectoire plus favorable (amélioration cognitive plus marquée et réduction plus forte de la solitude) comparé à un groupe contrôle sans intervention structurée de marche, les deux trajectoires apparaissant partiellement distinctes.","niveau_de_preuve_et_limites":"Essai contrôlé randomisé à deux bras avec échantillon modéré (n=120, 60/60), suivi sur 12 semaines avec 4 points de mesure, analysé par modélisation de croissance latente en processus parallèle ajustée sur l'âge et l'éducation. Limites explicites mentionnées : enregistrement rétrospectif de l'essai sur ClinicalTrials.gov (NCT07650292, enregistré après le début probable de l'étude), ce qui constitue un biais méthodologique notable. Durée d'intervention relativement courte (12 semaines) et absence de suivi à plus long terme pour juger de la pérennité des effets. Le résumé ne précise pas d'autres limites (par ex. taux d'adhésion au port du dispositif, insu des évaluateurs, représentativité de l'échantillon) — non précisé dans le résumé.","doi":"10.1186/s12877-026-08109-y","lien":"https://pubmed.ncbi.nlm.nih.gov/43009810/","source":"PubMed","pmid":"43009810","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Objective sleep characteristics and longitudinal change in financial and health literacy in older adults.","auteurs":"Du Lianlian, Yu Lei, Wang Tianhao, Buchman Aron S, Lim Andrew S P, Bennett David A, Boyle Patricia A","date":"2026 Oct 30","type_etude":"étude observationnelle","mecanisme_evalue":"Sommeil (durée nocturne subjective et actigraphique, sieste diurne actigraphique) et son association avec le déclin de la littératie financière et de santé chez des personnes âgées sans démence","resultat_principal":"Chez 765 participants sans démence suivis annuellement, une durée de sommeil nocturne objective plus longue était associée à une littératie de base plus élevée et à un déclin plus lent en analyse simple, mais cette association sur le déclin disparaissait après ajustement sur la sieste diurne ; une sieste diurne plus importante était elle associée à un déclin plus lent (mais pas à la littératie de base), tandis que le sommeil auto-rapporté n'était pas lié aux trajectoires de littératie (sauf un sommeil court <6h lié à une littératie de base plus faible) — il s'agit d'associations, non de preuves causales.","niveau_de_preuve_et_limites":"Étude observationnelle longitudinale avec échantillon modéré (N=765), issue d'une cohorte spécifique (Rush Memory and Aging Project) limitant la généralisabilité ; l'association entre sommeil nocturne objectif et déclin était atténuée et perdait sa significativité après ajustement sur la sieste, suggérant une possible confusion entre ces deux mesures de sommeil ; le résumé ne précise pas d'autres limites méthodologiques (biais, hétérogénéité) au-delà de cette observation.","angle_brana_sana":"Les résultats suggèrent un lien entre comportements de sommeil (durée nocturne et sieste diurne) et capacités de décision/littératie chez les personnes âgées, ce qui pourrait indirectement appuyer l'intérêt d'un programme structuré de repos (sieste encadrée, hygiène du sommeil) proposé à Braña Sana pour des publics seniors, en restant prudent sur le caractère associatif (non causal) de ces données.","pertinence_brana_sana":2,"doi":"10.1002/alz.71948","lien":"https://pubmed.ncbi.nlm.nih.gov/42967585/","source":"PubMed","pmid":"42967585","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Pilot study of duloxetine plus aerobic exercise for pain and depressive symptoms in knee osteoarthritis","auteurs":"Rathbun Alan M, Ryan Alice S, Dong Yu, Beamer Brock A, Luborsky Mark, Shardell Michelle D, Golden Justine, Campbell Claudia M, Lo Grace H, Peer Jason E, Hochberg Marc C","date":"2026-10-06","type_etude":"autre","mecanisme_evalue":"Douleur, symptômes dépressifs et fonction physique chez des patients atteints d'arthrose du genou, via un programme combiné de marche/exercice aérobie et duloxétine","resultat_principal":"Dans cette étude pilote à bras unique de 12 semaines combinant marche aérobie supervisée et duloxétine, les participants ont montré une amélioration de la douleur (score KOOS +14,2 points), une réduction des symptômes dépressifs (échelle Hamilton -5,5 points) et une amélioration de la fonction physique (test de marche de 6 min, vitesse de marche, lever de chaise) ; il s'agit de résultats préliminaires de faisabilité, non d'une preuve d'efficacité comparative.","niveau_de_preuve_et_limites":"Étude pilote monocentrique à bras unique (sans groupe contrôle), effectif réduit (34 inclus, 21 ayant débuté le traitement, 17 ayant complété le protocole), ce qui limite fortement la portée causale des résultats ; les auteurs soulignent explicitement le besoin d'essais randomisés contrôlés de plus grande taille pour confirmer ces signaux préliminaires d'efficacité.","angle_brana_sana":"Bien que l'intervention combine un médicament (duloxétine) et un programme de marche structuré, le volet marche/exercice aérobie régulier associé à une amélioration conjointe de la douleur, de l'humeur et de la fonction physique peut nourrir une réflexion sur l'intégration de parcours de marche progressifs dans un programme de bien-être ciblant douleur chronique et humeur — à nuancer car l'effet ne peut être isolé du traitement pharmacologique associé.","pertinence_brana_sana":1,"doi":"10.1093/rap/rkag116","lien":"https://pubmed.ncbi.nlm.nih.gov/42936867/","source":"PubMed","pmid":"42936867","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Regular napping mitigates the onset of cognitive fatigue and protects against stress-inflammatory responses to real-world sleep debt.","auteurs":"Belhout Sarah, Poudevigne Laura, Mouton Lili, Servonnet Aurélie, Le Coz Christine, Gaudin Mariette, Chennaoui Mounir, Léger Damien, Rabat Arnaud, Faraut Brice","date":"2026 Dec 13","type_etude":"étude observationnelle","mecanisme_evalue":"Fatigue cognitive (vigilance psychomotrice, fonction exécutive), réponse neuro-immune (IL-1β, IL-6, cortisol matinal) et neurotrophique (BDNF) liées à la dette de sommeil chronique et à la sieste diurne","resultat_principal":"En conditions écologiques, la dette de sommeil chronique est associée à une fatigabilité attentionnelle accrue et à des altérations neuro-immunes (cortisol matinal émoussé, hausse IL-1β/IL-6, baisse BDNF), et la pratique régulière de siestes l'après-midi atténue partiellement ces effets, avec une corrélation entre fréquence des siestes et réduction des lapses attentionnels.","niveau_de_preuve_et_limites":"Étude observationnelle en conditions de vie réelle (ecologically valid), basée sur des corrélations entre marqueurs biologiques et performances cognitives ; le résumé ne précise pas la taille d'échantillon, l'absence/présence de randomisation entre groupes napping vs non-napping, ni d'éventuels biais de sélection (les participants choisissant ou non de faire la sieste) — ces éléments ne sont pas détaillés dans le résumé fourni.","angle_brana_sana":"Appui scientifique pour intégrer des créneaux de sieste courte l'après-midi dans les programmes de repos/sommeil de Braña Sana, en complément des activités de marche/sentier, comme levier concret pour limiter la fatigue cognitive et le stress inflammatoire chez les personnes en dette de sommeil chronique (profil urbain stressé, cible typique du centre).","pertinence_brana_sana":3,"doi":"10.1016/j.bbih.2026.101390","lien":"https://pubmed.ncbi.nlm.nih.gov/42935556/","source":"PubMed","pmid":"42935556","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Exploratory Temporal Dynamics of Heart-Rate Variability During a Prolonged 2-Back Task Under Nap-Deprivation Conditions","auteurs":"Meng Di, Yu Luyao, Min Tianjiao, Zhang Jing, Zhu Liufeng, Gong Hengcong, Feng Yifei, He Ying","date":"2026 Sep 25","type_etude":"étude observationnelle","mecanisme_evalue":"Variabilité de la fréquence cardiaque (HRV), fatigue mentale et temps de réaction pendant une tâche cognitive prolongée (2-back de 60 min) en privation de sieste","resultat_principal":"La fatigue mentale subjective (FSAS) et le temps de réaction augmentent significativement après la tâche prolongée, mais aucun des 19 marqueurs HRV ne montre d'effet de phase significatif après correction pour comparaisons multiples (FDR), et les trajectoires des features HRV sont hétérogènes avec une reproductibilité limitée au niveau individuel — ce qui ne permet pas d'établir de phases physiologiques spécifiques à la fatigue ni de marqueurs diagnostiques.","niveau_de_preuve_et_limites":"Étude exploratoire à groupe unique, sans groupe contrôle, sur un échantillon réduit (26 participants initiaux, 22 inclus dans l'analyse HRV après exclusion de 4 enregistrements pour non-conformité au protocole assis). Les auteurs précisent explicitement que les changements physiologiques observés dans ce type de paradigme à groupe unique peuvent refléter plusieurs facteurs confondus (effet temps-sur-tâche, variation circadienne, privation de sieste, posture, charge cognitive) sans pouvoir les distinguer. Aucun effet HRV ne reste significatif après correction FDR, et la solution de clustering à cinq groupes n'était pas la mieux séparée, avec une reproductibilité limitée au niveau individuel. Les auteurs insistent que ces résultats ne permettent pas d'établir des marqueurs diagnostiques ou un monitoring individuel fiable.","doi":"10.3390/s26196099","lien":"https://pubmed.ncbi.nlm.nih.gov/42884299/","source":"PubMed","pmid":"42884299","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Speech-sound memory consolidation over a daytime nap in adults with and without developmental language disorder.","auteurs":"Ali S, Gurram TR, van Zelst AL, Earle FS","date":"2026-09-30","type_etude":"étude observationnelle","mecanisme_evalue":"Sommeil (fuseaux de sommeil lents, oscillations lentes, couplage SO-fuseau) et consolidation mnésique de représentations perceptivo-linguistiques (discrimination de sons de parole)","resultat_principal":"Chez 29 adultes anglophones monolingues, la densité des fuseaux lents était associée positivement à la performance de discrimination perceptive post-sieste, la densité des oscillations lentes y était associée négativement, et une force de couplage SO-fuseau plus faible était corrélée à de plus grandes difficultés langagières chez les participants présentant un trouble développemental du langage — il s'agit d'associations statistiques, non de preuves d'un effet causal du sommeil sur la consolidation.","niveau_de_preuve_et_limites":"Étude observationnelle de petite taille (n=29), sans groupe contrôle actif explicite mentionné pour isoler l'effet de la sieste elle-même ; les relations rapportées sont corrélationnelles et ne permettent pas d'établir de causalité ; absence de précision sur l'hétérogénéité méthodologique au-delà de ces éléments dans le résumé.","angle_brana_sana":"Bien que l'étude porte sur la consolidation de mémoire linguistique spécifique (discrimination de sons de parole) et un trouble développemental du langage, le lien avec un programme général de sieste/repos à Braña Sana resterait trop indirect et spéculatif pour être honnêtement établi — le public cible et le mécanisme étudié sont trop spécifiques pour justifier une application concrète.","pertinence_brana_sana":0,"doi":"10.3389/fnbeh.2026.1903903","lien":"https://pubmed.ncbi.nlm.nih.gov/42877572/","source":"PubMed","pmid":"42877572","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Napping during major depressive episodes identifies a distinct hypersomnolence phenotype.","auteurs":"Geoffroy PA, Heiligenstein C, Mauries S, Ulm J, Zehani F, Henry C, Lejoyeux M, Bourgin P, Maruani J","date":"2026-09-18","type_etude":"étude observationnelle","mecanisme_evalue":"Sommeil et rythmes circadiens au cours des épisodes dépressifs majeurs (hypersomnie, somnolence diurne, fatigue, biomarqueurs subjectifs et ac
