<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille La Borbolla — tableau de bord</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 16px 12px;
    max-width: 980px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 16px; }
  .theme-toggle {
    position: absolute; top: 16px; right: 16px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; color: var(--text-primary);
    font-size: 0.8rem; cursor: pointer;
  }
  .controls {
    max-width: 980px; margin: 0 auto; padding: 0 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type="text"] {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 0.85rem;
  }
  input[type="text"] { flex: 1; min-width: 200px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 11px; font-size: 0.78rem; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
    user-select: none;
  }
  .chip.active { color: var(--text-primary); font-weight: 600; border-color: currentColor; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip .count { color: var(--text-muted); }
  .chip.active .count { color: inherit; }
  label.checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
  .buttons { display: flex; gap: 8px; margin-left: auto; }
  button.plain {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer;
  }
  main { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  .count-line { color: var(--text-secondary); font-size: 0.85rem; margin: 6px 0 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 4px solid var(--card-color, var(--gridline));
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer;
  }
  .card-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .card-title { font-size: 0.95rem; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 200px; }
  .badge {
    font-size: 0.7rem; padding: 2px 7px; border-radius: 999px;
    background: var(--gridline); color: var(--text-secondary); white-space: nowrap;
  }
  .badge-pertinence {
    background: rgba(12,163,12,0.16); color: #0ca30c; font-weight: 600;
  }
  .meta-line { color: var(--text-secondary); font-size: 0.78rem; margin-top: 4px; }
  .snippet { color: var(--text-secondary); font-size: 0.85rem; margin-top: 6px; }
  .details { display: none; margin-top: 10px; border-top: 1px solid var(--gridline); padding-top: 10px; font-size: 0.85rem; }
  .details.open { display: block; }
  .details dt { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; margin-top: 8px; }
  .details dd { margin: 2px 0 0; color: var(--text-primary); }
  .details a { color: var(--card-color, #2a78d6); }
  .empty { color: var(--text-muted); text-align: center; padding: 40px 0; }
  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 20px 0 8px; }
</style>
</head>
<body>
<header style="position: relative;">
  <button class="theme-toggle" id="themeToggle">🌓 thème</button>
  <h1>Veille scientifique — La Borbolla</h1>
  <p class="subtitle">Tableau de bord de tri des fiches extraites depuis PubMed.</p>
</header>
<div class="controls">

    <select id="runSelect"></select>
    <input type="text" id="search" placeholder="Rechercher (titre, auteurs, résultat…)">
    <div class="buttons">
      <button class="plain" id="expandAll">Tout déplier</button>
      <button class="plain" id="collapseAll">Tout replier</button>
    </div>
  </div>
  <div class="row" id="themeChips"></div>
  <div class="row">
    <select id="typeSelect"><option value="">Tous types d'étude</option></select>
    <label class="checkbox"><input type="checkbox" id="onlyAngle"> avec angle Braña Sana renseigné</label>
  </div>
</div>
<main>
  <div class="count-line" id="countLine"></div>
  <div id="list"></div>
</main>
<script id="fiches-data" type="application/json">[{"titre":"Association between visits to blue spaces within walking distance and mental health among older adults in Japan: a cross-sectional study from the Japan Gerontological Evaluation Study","auteurs":"Matsumoto Kazuki, Chen Yu-Ru, Matsuoka Yoko, Yoshida Hiroaki, Nakagomi Atsushi, Kondo Katsunori, Hanazato Masamichi","date":"2026 Aug 27","type_etude":"étude observationnelle","mecanisme_evalue":"Santé mentale (symptômes dépressifs mesurés par la Geriatric Depression Scale-15, et bonheur subjectif) en lien avec la fréquentation d'espaces bleus (bords de mer, rivières, lacs accessibles à pied)","resultat_principal":"Chez des adultes japonais de 65 ans et plus, la fréquentation mensuelle d'espaces bleus à distance de marche est associée à une prévalence plus faible de symptômes dépressifs (ratio de prévalence : 0,79) et à des scores de bonheur plus élevés, avec une relation dose-réponse selon le nombre de visites mensuelles ; les associations sont plus marquées pour les activités de marche, d'observation du paysage et de socialisation.","niveau_de_preuve_et_limites":"Étude transversale (coupe instantanée) sur 21 339 participants dans 69 municipalités japonaises : l'association ne peut établir de causalité (pas de suivi longitudinal, pas de randomisation). Les données sur les visites et activités sont auto-déclarées (biais de déclaration possible). Les auteurs ont réalisé des analyses de sensibilité (zones intérieures uniquement, dose-réponse, analyses par catégorie d'activité, cas complets) et utilisé l'imputation multiple pour les données manquantes, renforçant la robustesse mais ne permettant pas de conclure à un effet causal. Population limitée aux adultes fonctionnellement indépendants de 65 ans et plus au Japon, limitant la généralisabilité à d'autres contextes.","doi":"10.1186/s12889-026-29233-9","lien":"https://pubmed.ncbi.nlm.nih.gov/43064951/","source":"PubMed","pmid":"43064951","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Developing an outcomes framework for greenspace programmes supporting individuals experiencing problem substance use: a scoping review and analytical synthesis","auteurs":"Falzon Danilo, Masterton Wendy, Carver Hannah, Duncan Edward, Park Kirsty, Engstrom Sandra, Lovell Rebecca, Torrance Morgan, Dumbrell Josh, Gorley Trish, Parkes Tessa","date":"2026-11-05","type_etude":"revue systématique","mecanisme_evalue":"Mood/affect, attention, stress/anxiété/dépression, concept de soi et identité, connexion sociale, connexion à la nature (outcomes psychosociaux liés aux programmes d'espaces verts)","resultat_principal":"Synthèse de 311 articles et de 33 entretiens aboutissant à un cadre de 29 résultats évaluatifs répartis en trois domaines (lié à la nature, individuel, social) pertinents pour évaluer les programmes d'espaces verts destinés aux personnes en difficulté avec l'usage de substances ; il s'agit d'un cadre d'évaluation proposé, pas d'une démonstration d'efficacité causale.","niveau_de_preuve_et_limites":"Scoping review + synthèse analytique mixte (littérature + entretiens qualitatifs) : ce type de devis ne permet pas d'établir de causalité ni d'effet quantifié. Le résumé ne précise pas le niveau de qualité méthodologique des 311 études incluses, ni d'éventuelle hétérogénéité des méthodes d'évaluation parmi elles, bien qu'il mentionne une diversité de méthodes (auto-évaluations, mesures physiologiques, approches qualitatives, designs observationnels/expérimentaux) sans évaluation critique de leur rigueur individuelle. Aucune limite supplémentaire (taille d'échantillon des entretiens, biais de sélection, absence de groupe contrôle) n'est explicitement discutée dans le résumé au-delà de la nature même de la démarche (cadre conceptuel, non essai contrôlé).","doi":"10.3389/fpubh.2026.1965592","lien":"https://pubmed.ncbi.nlm.nih.gov/43060530/","source":"PubMed","pmid":"43060530","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"The Mother Nature Programme: a single-arm mixed-methods feasibility study of a group nature-based intervention for mothers experiencing postnatal mental health difficulties and their infants.","auteurs":"Hall Katherine, Roberts Rosa, Turner Katrina, Stanton Lucinda, Elsheikh Sherien, Barnes Christopher, Shirkey Beverly, Duggan Lucy, Moran Paul, Evans Jonathan","date":"2026 Aug 27","type_etude":"autre","mecanisme_evalue":"Santé mentale postnatale (dépression, anxiété, bien-être) et lien à la nature (connectedness to nature) évalués via EPDS, GAD-7, WEMWBS et NR-6, dans le cadre d'une intervention de groupe basée sur la nature","resultat_principal":"Étude de faisabilité (sans groupe contrôle) montrant qu'un programme de groupe en extérieur de 5 semaines pour mères en difficulté de santé mentale postnatale était réalisable et bien accepté, avec des améliorations moyennes observées sur les scores de dépression, anxiété et bien-être entre le début et la fin du programme — ces résultats restent descriptifs et ne permettent pas de conclure à une efficacité de l'intervention.","niveau_de_preuve_et_limites":"Étude monobras (single-arm), sans groupe contrôle, design pré/post uniquement, explicitement destinée à évaluer la faisabilité et non l'efficacité ; échantillon modeste (43 mères recrutées, 42 ayant débuté le programme) ; les auteurs précisent eux-mêmes qu'aucune évaluation d'efficacité ou de rapport coût-efficacité n'est possible à ce stade et qu'un essai contrôlé randomisé pilote est nécessaire avant toute conclusion causale.","doi":"10.1186/s40814-026-01895-7","lien":"https://pubmed.ncbi.nlm.nih.gov/43058839/","source":"PubMed","pmid":"43058839","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Natural environments and sleep during pregnancy: Associations of green and blue spaces with prenatal sleep outcomes in a Canadian cohort","auteurs":"Singh Samarpreet, Mori Camille, Lebel Catherine, Tomfohr-Madsen Lianne, Giesbrecht Gerald F","date":"2026 Nov 19","type_etude":"étude observationnelle","mecanisme_evalue":"Sommeil prénatal (durée, perturbations, altération) en lien avec l'exposition aux espaces verts (NDVI, canopée arborée) et bleus (distance aux plans d'eau)","resultat_principal":"Une plus grande couverture arborée et un NDVI plus élevé sont associés à une durée de sommeil plus longue chez les femmes enceintes, tandis que l'éloignement des plans d'eau est également associé (de façon contre-intuitive) à une durée de sommeil plus longue et moins de perturbations du sommeil ; après ajustements supplémentaires, seule l'association avec la durée du sommeil reste significative — ce sont des associations statistiques et non des preuves d'effet causal.","niveau_de_preuve_et_limites":"Étude observationnelle transversale basée sur des données auto-rapportées (cohorte PdP, n=8583) et des indices environnementaux agrégés (NDVI, canopée, distance à l'eau) sans mesure directe de l'exposition individuelle réelle ni de groupe contrôle expérimental ; ajustements multiples effectués mais possibilité de facteurs confondants résiduels (ex. contexte pandémique COVID-19, auto-sélection du lieu de résidence) ; les associations avec les perturbations et l'altération du sommeil s'affaiblissent après ajustements supplémentaires, suggérant une robustesse limitée pour ces dimensions. Aucune limite supplémentaire sur la taille d'échantillon n'est mentionnée comme problématique par les auteurs.","doi":"10.1016/j.sleh.2026.10.011","lien":"https://pubmed.ncbi.nlm.nih.gov/43057981/","source":"PubMed","pmid":"43057981","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"An ecological momentary assessment of the reciprocal association between short-term sleep-wake variability and binge eating.","auteurs":"Bottera Angeline R, Christensen Pacella Kara A, Dougherty Elizabeth, Johnson Nicole K, De Young Kyle P","date":"2026 Nov 18","type_etude":"étude observationnelle","mecanisme_evalue":"Variabilité du rythme veille-sommeil (heure de coucher, de lever, point médian circadien) et son association bidirectionnelle avec les épisodes d'hyperphagie boulimique (binge eating)","resultat_principal":"Chez des étudiants présentant hyperphagie boulimique et troubles du sommeil, la variabilité jour-à-jour du sommeil ne prédit pas l'hyperphagie du lendemain (et inversement) au niveau intra-individuel ; en revanche, au niveau inter-individuel, une plus grande variabilité globale de l'heure de lever et du point médian circadien est associée à une probabilité réduite d'épisodes d'hyperphagie sur la période étudiée — une association statistique, pas une preuve d'effet causal.","niveau_de_preuve_et_limites":"Échantillon réduit (N=64), population spécifique (étudiants universitaires avec hyperphagie et troubles du sommeil), absence de groupe contrôle, période de suivi EMA courte (1 semaine) jugée insuffisante par les auteurs eux-mêmes pour capter des effets cumulatifs, résultats potentiellement confondus par le phénomène de sommeil de rattrapage (catch-up sleep) observé chez 68,3% des participants ; les auteurs appellent explicitement à des études avec suivi plus long.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1016/j.eatbeh.2026.102151","lien":"https://pubmed.ncbi.nlm.nih.gov/43068625/","source":"PubMed","pmid":"43068625","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Circadian Disruption and Chrono-rehabilitation After Spinal Cord Injury","auteurs":"Abdulsalam Ahmad J, Abdulsalam Mohammad, Özçakar Levent, BaHammam Ahmed S","date":"2026-11-20","type_etude":"revue systématique","mecanisme_evalue":"Rythmes circadiens : gènes horloges centraux, sécrétion de mélatonine, thermorégulation, voies autonomes reliant le noyau suprachiasmatique aux tissus périphériques, et leur impact sur la neuroplasticité, l'apprentissage moteur, l'inflammation et la réparation tissulaire","resultat_principal":"Les auteurs proposent, sur la base d'une synthèse narrative, qu'un cadre chronobiologique (évaluation du sommeil par actigraphie, luminothérapie programmée, mélatonine individualisée, timing des séances de rééducation selon les pics de performance neurocognitive/motrice) pourrait optimiser la récupération fonctionnelle après lésion médullaire, mais il s'agit d'une proposition théorique et non d'une démonstration d'effet clinique.","niveau_de_preuve_et_limites":"Revue narrative/perspective, non une méta-analyse ou RCT. Les auteurs précisent eux-mêmes que l'essentiel des preuves soutenant les interventions proposées provient de populations non-SCI ou de modèles précliniques, et que les données d'essais cliniques directs en réadaptation SCI restent limitées. Aucune taille d'échantillon propre n'est rapportée puisqu'il s'agit d'un article de synthèse/positionnement.","angle_brana_sana":"Si cette population spécifique (lésions médullaires) n'est pas le public cible de Braña Sana, le principe général — synchroniser les rythmes circadiens (lumière naturelle, horaires réguliers, exposition au rythme jour/nuit en forêt) avec les phases de repos et d'activité manuelle — résonne avec l'approche du centre sur le sommeil et le retour à un rythme naturel. L'angle concret serait d'informer la conception des programmes de repos/éveil (expositions lumineuses en extérieur, horaires d'ateliers alignés sur les pics d'attention) plutôt qu'une application clinique directe.","pertinence_brana_sana":1,"doi":"10.46292/sci26-00034","lien":"https://pubmed.ncbi.nlm.nih.gov/43066320/","source":"PubMed","pmid":"43066320","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Actimetry-Derived Sleep and Circadian Parameters in a Population-Based Sample from São Paulo: Findings from the EPISONO Cohort","auteurs":"Vallim Julia Ribeiro da Silva, Scassola Catharina Maria Carvalho, Lopes Luisa da Costa, Lima Gabriela Sant'Ana, Silva Pamela Caroline, Louzada Fernando Mazzilli, Tufik Sergio, Andersen Monica Levy, D'Almeida Vânia","date":"2026 Sep 19","type_etude":"étude observationnelle","mecanisme_evalue":"Paramètres de sommeil, rythme repos-activité, exposition à la lumière et température cutanée (mesures actimétriques et chronobiologiques)","resultat_principal":"Dans cette cohorte urbaine de São Paulo, l'âge (40 ans et +), le sexe, le statut socio-économique, l'obésité et la saison sont associés à des différences dans les patterns de sommeil et de rythme circadien (ex. : les femmes dorment plus longtemps et ont un rythme plus stable mais une exposition lumineuse altérée ; l'obésité est corrélée à une plus grande instabilité du rythme repos-activité ; le sommeil est plus court et plus tardif au printemps qu'en hiver).","niveau_de_preuve_et_limites":"Étude observationnelle transversale (sous-échantillon de 404 participants sur 769), basée sur des associations statistiques (modèles linéaires généralisés) sans groupe contrôle ni suivi longitudinal permettant d'établir une causalité. Le résumé ne précise pas d'autres limites méthodologiques (biais de sélection, représentativité, etc.) — à considérer comme non précisé dans le résumé au-delà de la nature transversale et associative des résultats.","doi":"10.1055/s-0046-1829388","lien":"https://pubmed.ncbi.nlm.nih.gov/43065338/","source":"PubMed","pmid":"43065338","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Sleep hygiene, caffeine use, and academic performance among university students: A cross-sectional study.","auteurs":"Alshaikh Razi, Jebriel Wadea, Shahrouri Mohammad, Zarura Tartil, Khouli Hasan","date":"2026-11-20","type_etude":"étude observationnelle","mecanisme_evalue":"Hygiène du sommeil (Sleep Hygiene Index), consommation de caféine et performance académique (GPA)","resultat_principal":"Une consommation de caféine plus élevée est associée à une moins bonne hygiène du sommeil (corrélation positive entre apport en caféine et score de mauvaise hygiène du sommeil), mais aucune association statistiquement significative n'a été détectée entre la caféine (ou le score d'hygiène du sommeil) et le GPA ; en régression multivariable, ce sont les heures d'étude, la régularité et la durée du sommeil, l'année et la filière académiques, ainsi que le statut tabagique qui sont associés au GPA, pas la caféine.","niveau_de_preuve_et_limites":"Étude transversale (questionnaire auto-rapporté) sur 379 participants (GPA disponible pour 354), ce qui limite toute interprétation causale, comme le précisent les auteurs eux-mêmes. L'estimation de la caféine est déclarative, et le modèle de régression n'explique qu'une faible part de la variance du GPA (R² ajusté = 0,123). Les auteurs notent aussi que l'intervalle de confiance pour l'association caféine-GPA n'exclut pas une relation négative, malgré la non-significativité.","angle_brana_sana":"Ces résultats renforcent l'intérêt d'un programme de repos/sommeil axé sur la régularité et la durée du sommeil plutôt que sur la seule réduction de la caféine : à Braña Sana, cela pourrait se traduire par des ateliers sur l'hygiène du sommeil (horaires réguliers, routines du soir) plutôt qu'un discours uniquement centré sur l'évitement de la caféine.","pertinence_brana_sana":2,"doi":"10.1371/journal.pone.0363064","lien":"https://pubmed.ncbi.nlm.nih.gov/43063151/","source":"PubMed","pmid":"43063151","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"General Practice Registrar-Led Community Lifestyle Medicine Group Consultations in Primary Care: A Quality Improvement Feasibility Evaluation.","auteurs":"Chawatama Elton, Raghvani Tanvi, Fowler Samuel, Goolamallee Tayyib, Mukherjee Bhasha, Oguz Mine, Esalo Shekinah","date":"2026 Nov 18","type_etude":"étude observationnelle","mecanisme_evalue":"Comportements de style de vie modifiables chez des patients multimorbides (activité physique, nutrition, sommeil, gestion du stress, formation d'habitudes, lien social) via un programme de consultations de groupe en soins primaires","resultat_principal":"Dans cette évaluation de faisabilité pré-post sans groupe contrôle, un programme de consultations de groupe de 4 semaines mené par des internes de médecine générale a montré une bonne faisabilité et acceptabilité (76% de rétention, 64% souhaitant poursuivre), avec des améliorations auto-rapportées dans les 7 domaines évalués (notamment exercice régulier +0.81 et confiance en hygiène du sommeil +0.62), sans qu'il soit possible de conclure à une efficacité causale.","niveau_de_preuve_et_limites":"Les auteurs signalent explicitement : design non contrôlé (single-arm, pré-post), échantillon apparié très réduit (21 répondants sur 38 participants commencés), suivi court (4 semaines), résultats basés uniquement sur l'auto-déclaration, et absence de groupe témoin. Les auteurs concluent eux-mêmes que les résultats indiquent une faisabilité et une promesse, pas une preuve d'efficacité ; une évaluation contrôlée multi-site à plus long terme est nécessaire.","doi":"10.7759/cureus.119903","lien":"https://pubmed.ncbi.nlm.nih.gov/43061686/","source":"PubMed","pmid":"43061686","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Integrated roles of regulatory non-coding RNAs in circadian gene expression and disease pathogenesis.","auteurs":"Ghosh Debakreeta","date":"2026 Nov 20","type_etude":"revue systématique","mecanisme_evalue":"Régulation moléculaire du rythme circadien par les ARN non codants (microARN, ARN longs non codants, ARN circulaires) et leur implication dans les perturbations circadiennes liées à divers facteurs (travail posté, lumière artificielle nocturne, vieillissement, stress)","resultat_principal":"Cette revue synthétise les connaissances actuelles sur le rôle des différentes classes d'ARN non codants (miARN, lncARN, circARN) dans la régulation de l'expression génique circadienne, et propose une vue intégrative de leur dysfonctionnement associé à plusieurs pathologies (cancer, troubles endocriniens, neurologiques, métaboliques), sans démontrer de relation causale directe.","niveau_de_preuve_et_limites":"Il s'agit d'une revue narrative/intégrative de littérature moléculaire fondamentale, sans méthodologie systématique précisée (pas de critères PRISMA mentionnés), sans méta-analyse de données quantitatives. Le résumé souligne lui-même que la recherche sur les circARN est encore émergente et nécessite davantage d'investigations mécanistiques. Aucune limite méthodologique supplémentaire (taille d'échantillon, biais) n'est précisée dans le résumé, car il s'agit d'une synthèse de biologie moléculaire et non d'une étude expérimentale ou clinique.","angle_brana_sana":"Cette étude est purement moléculaire et mécanistique (biologie des ARN non codants), sans lien direct ou actionnable avec les pratiques concrètes de Braña Sana (bain de forêt, programmes de repos, travail manuel). Elle renforce en arrière-plan la compréhension scientifique de l'importance du rythme circadien pour la santé, mais ne fournit aucun levier pratique applicable à un programme de repos ou de sommeil.","pertinence_brana_sana":0,"doi":"10.1080/15257770.2026.2763375","lien":"https://pubmed.ncbi.nlm.nih.gov/43059354/","source":"PubMed","pmid":"43059354","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Sleep deprivation remodels hepatic immune microenvironment via circadian gene dysregulation and promotes hepatocellular carcinoma progression","auteurs":"Yan Boyu, Lin Fangyu, Chen Limin, Ke Peng, Wu Han, Ting Chen","date":"2026 Nov 19","type_etude":"étude observationnelle","mecanisme_evalue":"Gènes liés au rythme circadien (CRGs), inflammation hépatique, infiltration immunitaire et lien avec le carcinome hépatocellulaire (ALT/AST, Cirbp, Hsp90aa1, Srebf1, Fbxo31, Btc, Dlgap1, Serpine1)","resultat_principal":"La privation de sommeil chez le rat induit une élévation des marqueurs de lésion hépatique (ALT/AST) et un remaniement de l'expression de gènes circadiens, associé à des modifications de l'infiltration immunitaire hépatique ; deux de ces gènes (Cirbp, Hsp90aa1) sont corrélés à l'infiltration immunitaire et au pronostic dans des cohortes de carcinome hépatocellulaire — il s'agit d'associations transcriptomiques/expérimentales chez l'animal et de corrélations in silico chez l'humain, non d'une démonstration causale de progression tumorale.","niveau_de_preuve_et_limites":"Étude combinant analyses bio-informatiques de jeux de données GEO, machine learning, et un modèle de privation de sommeil chez le rat ; validation humaine limitée à des corrélations statistiques (CIBERSORT, TIMER) sur données de cohortes HCC sans suivi clinique prospectif propre à l'étude. Le résumé ne précise pas la taille des échantillons animaux ni humains, ni la durée de la privation de sommeil, ni la présence d'un groupe contrôle détaillé au-delà des mesures ALT/AST — ces éléments ne sont pas précisés dans le résumé. Association statistique chez l'humain, pas de preuve causale directe du lien SD → progression du HCC.","doi":"10.1080/07420528.2026.2763621","lien":"https://pubmed.ncbi.nlm.nih.gov/43059095/","source":"PubMed","pmid":"43059095","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Electroacupuncture as an adjunctive treatment for non-dipper hypertension: study protocol for a multicentre, randomised, sham-controlled trial.","auteurs":"Chen Yiying, Lai Si-Hua, Hu Wen-Xin, Zhang Bei, Zhang Cong, Lu Lu, Zhu Bo, Chen Li","date":"2026 Nov 19","type_etude":"essai en cours","mecanisme_evalue":"Rythme circadien de la pression artérielle (profil non-dipper vs dipper), qualité du sommeil et qualité de vie, avec exploration métabolomique et transcriptomique","resultat_principal":"Il s'agit d'un protocole d'étude (pas encore de résultats) visant à évaluer si l'électroacupuncture en complément du traitement antihypertenseur peut augmenter la proportion de patients convertissant d'un profil tensionnel non-dipper à dipper après 8 semaines de traitement, comparé à une acupuncture simulée (sham).","niveau_de_preuve_et_limites":"Protocole d'essai randomisé, multicentrique, contrôlé par sham acupuncture, en aveugle patient, avec 404 participants prévus (échantillon relativement large pour ce type d'essai) ; cependant aucun résultat d'efficacité n'est encore disponible à ce stade — il s'agit uniquement du design méthodologique. Les auteurs soulignent eux-mêmes que les preuves existantes sur l'EA pour ce trouble restent insuffisantes et que les mécanismes sous-jacents sont encore mal compris, ce qui justifie cette étude.","angle_brana_sana":"Aucun lien concret et honnête ne se justifie : il s'agit d'un protocole d'essai clinique sur l'électroacupuncture pour l'hypertension non-dipper, une intervention médicale spécialisée et non reproductible dans le cadre des activités de Braña Sana (bain de forêt, repos, mindfulness, travail manuel). Le lien avec le sommeil (via le PSQI comme critère secondaire) est trop indirect et l'étude ne fournit encore aucun résultat exploitable.","pertinence_brana_sana":0,"doi":"10.1136/bmjopen-2026-120906","lien":"https://pubmed.ncbi.nlm.nih.gov/43057715/","source":"PubMed","pmid":"43057715","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Disparities in Quality of Life and Depression for People With Parkinson's Participating in Adaptango Dance or Walking","auteurs":"Rodriguez Alexander W, Shih Regina, Rafie Forouzan, Hackney Madeleine E","date":"2026 Nov 19","type_etude":"étude observationnelle","mecanisme_evalue":"Qualité de vie, dépression, soutien social et symptômes moteurs/fonctionnels chez des personnes atteintes de Parkinson participant à un programme de danse (Adaptango) ou de marche","resultat_principal":"Dans cette analyse secondaire d'un essai combinant danse et marche, le statut fonctionnel et le bien-être mental se sont davantage détériorés chez les participants noirs que chez les participants blancs après 3 mois, sans différence significative sur les autres mesures (dépression, qualité de vie globale, soutien social).","niveau_de_preuve_et_limites":"Échantillon très réduit (n=28 blancs, n=11 noirs, total 39), issu d'une analyse secondaire d'un essai (PAIRED Trial) combinant deux modalités d'exercice différentes (danse et marche) sans les distinguer, ce qui limite l'interprétation spécifique à chaque intervention ; absence de groupe contrôle non-exercice mentionné ; les auteurs appellent explicitement à des études futures pour corroborer ces résultats préliminaires.","angle_brana_sana":"","pertinence_brana_sana":0,"doi":"10.1177/07334648261500468","lien":"https://pubmed.ncbi.nlm.nih.gov/43056188/","source":"PubMed","pmid":"43056188","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"},{"titre":"Structured Paper-cutting as a Complementary Intervention for Immediate Distress Relief: a Randomized Crossover Mixed-methods Study","auteurs":"Ding Huan, Li Shuang, Zeng Huangxin","date":"2026 Nov 22","type_etude":"RCT","mecanisme_evalue":"Détresse subjective (tension/inconfort, SUDS) et fréquence cardiaque, associés à l'engagement attentionnel lors d'une activité manuelle structurée (découpage de papier) comparée au collage","resultat_principal":"Une séance unique et structurée de découpage de papier est associée à une réduction aiguë de la détresse subjective (ΔSUDS) significativement plus marquée qu'une séance de collage appariée (différence = -0.50, p<.001, dz=-0.75), les changements de fréquence cardiaque allant dans le même sens ; l'analyse qualitative pointe l'absorption attentionnelle, le sentiment de contrôle et l'achèvement de la tâche comme mécanismes expérientiels, avec la difficulté excessive et les interruptions comme freins.","niveau_de_preuve_et_limites":"Étude croisée randomisée avec échantillon vraisemblablement réduit (volet qualitatif n=12, taille de l'échantillon quantitatif non précisée dans le résumé) ; effets mesurés en intra-séance immédiat uniquement, sans indication sur la durabilité des effets à moyen ou long terme ; comparaison faite à une activité active (collage) plutôt qu'à un groupe contrôle passif strict ; les auteurs ont contrôlé les effets d'ordre et de séquence via des équations d'estimation généralisées, ce qui renforce la robustesse méthodologique, mais la généralisabilité à d'autres populations ou contextes n'est pas précisée dans le résumé.","angle_brana_sana":"Résultat directement transposable à un atelier manuel ponctuel (ex. initiation au découpage de papier ou artisanat similaire) proposé comme moment de détente rapide et accessible au sein du programme de retour au manuel, en complément d'autres pratiques (jardinage, artisanat), avec un bénéfice attendu sur la détente immédiate plutôt que sur un effet thérapeutique durable.","pertinence_brana_sana":3,"doi":"10.1016/j.ctim.2026.103486","lien":"https://pubmed.ncbi.nlm.nih.gov/43068778/","source":"PubMed","pmid":"43068778","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-23"}]</script>
<script id="theme-meta" type="application/json">{"shinrin-yoku":{"label":"Bain de forêt / shinrin-yoku","color":{"light":"#2a78d6","dark":"#3987e5"}},"sommeil":{"label":"Repos / sommeil","color":{"light":"#eb6834","dark":"#d95926"}},"sieste-marche":{"label":"Sieste & marche","color":{"light":"#1baf7a","dark":"#199e70"}},"manuel":{"label":"Retour au manuel (mains, artisanat, potager)","color":{"light":"#eda100","dark":"#c98500"}},"_non-classe":{"label":"Non classé","color":{"light":"#898781","dark":"#898781"}}}</script>
<script>
(function () {
  const fiches = JSON.parse(document.getElementById('fiches-data').textContent);
  const themeMeta = JSON.parse(document.getElementById('theme-meta').textContent);

  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

  function themeColor(id) {
    const meta = themeMeta[id] || themeMeta['_non-classe'];
    return isDark() ? meta.color.dark : meta.color.light;
  }

  // --- thème clair/sombre ---
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    render();
  });

  // --- dates de run disponibles (plus récent en premier) ---
  const runDates = [...new Set(fiches.map((f) => f.ajoute_le).filter(Boolean))].sort().reverse();
  const runSelect = document.getElementById('runSelect');
  const allOption = document.createElement('option');
  allOption.value = '__all__';
  allOption.textContent = 'Toute la base (' + fiches.length + ' fiches)';
  runSelect.appendChild(allOption);
  runDates.forEach((d) => {
    const opt = document.createElement('option');
    opt.value = d;
    const n = fiches.filter((f) => f.ajoute_le === d).length;
    opt.textContent = d + ' (' + n + ' nouvelle' + (n > 1 ? 's' : '') + ')';
    runSelect.appendChild(opt);
  });
  if (runDates.length) runSelect.value = runDates[0];

  // --- filtre types d'étude ---
  const typeSelect = document.getElementById('typeSelect');
  [...new Set(fiches.map((f) => f.type_etude).filter(Boolean))].sort().forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  });

  // --- état des filtres ---
  const state = { themes: new Set(), search: '', type: '', onlyAngle: false };
  const expanded = new Set();

  const themeChipsEl = document.getElementById('themeChips');
  const searchEl = document.getElementById('search');
  const onlyAngleEl = document.getElementById('onlyAngle');
  const listEl = document.getElementById('list');
  const countLineEl = document.getElementById('countLine');

  runSelect.addEventListener('change', render);
  typeSelect.addEventListener('change', () => { state.type = typeSelect.value; render(); });
  searchEl.addEventListener('input', () => { state.search = searchEl.value.trim().toLowerCase(); render(); });
  onlyAngleEl.addEventListener('change', () => { state.onlyAngle = onlyAngleEl.checked; render(); });
  document.getElementById('expandAll').addEventListener('click', () => {
    currentVisible().forEach((f) => expanded.add(f._key));
    render();
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    expanded.clear();
    render();
  });

  fiches.forEach((f, i) => { f._key = (f.doi || f.titre || '') + '::' + i; });

  function currentRunFiches() {
    const val = runSelect.value;
    if (val === '__all__') return fiches;
    return fiches.filter((f) => f.ajoute_le === val);
  }

  function currentVisible() {
    let list = currentRunFiches();
    if (state.themes.size) list = list.filter((f) => state.themes.has(f.thematique_id));
    if (state.type) list = list.filter((f) => f.type_etude === state.type);
    if (state.onlyAngle) list = list.filter((f) => (f.angle_brana_sana || '').trim().length > 0);
    if (state.search) {
      const q = state.search;
      list = list.filter((f) =>
        (f.titre || '').toLowerCase().includes(q) ||
        (f.auteurs || '').toLowerCase().includes(q) ||
        (f.resultat_principal || '').toLowerCase().includes(q) ||
        (f.mecanisme_evalue || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function renderChips() {
    const runFiches = currentRunFiches();
    const counts = {};
    runFiches.forEach((f) => { counts[f.thematique_id] = (counts[f.thematique_id] || 0) + 1; });
    themeChipsEl.innerHTML = '';
    Object.keys(themeMeta).forEach((id) => {
      const n = counts[id] || 0;
      if (n === 0 && !state.themes.has(id)) return;
      const chip = document.createElement('div');
      chip.className = 'chip' + (state.themes.has(id) ? ' active' : '');
      chip.innerHTML = '<span class="dot" style="background:' + themeColor(id) + '"></span>' +
        themeMeta[id].label + ' <span class="count">' + n + '</span>';
      chip.addEventListener('click', () => {
        if (state.themes.has(id)) state.themes.delete(id); else state.themes.add(id);
        render();
      });
      themeChipsEl.appendChild(chip);
    });
  }

  function fmtDate(d) {
    return d || '—';
  }

  function renderList() {
    const visible = currentVisible();
    countLineEl.textContent = visible.length + ' fiche' + (visible.length > 1 ? 's' : '') +
      (state.themes.size || state.type || state.onlyAngle || state.search ? ' (filtrées)' : '');
    listEl.innerHTML = '';
    if (!visible.length) {
      listEl.innerHTML = '<div class="empty">Aucune fiche ne correspond à ces filtres.</div>';
      return;
    }
    const byTheme = {};
    visible.forEach((f) => {
      (byTheme[f.thematique_id] = byTheme[f.thematique_id] || []).push(f);
    });
    Object.keys(byTheme)
      .sort((a, b) => (themeMeta[a]?.label || '').localeCompare(themeMeta[b]?.label || ''))
      .forEach((id) => {
        const section = document.createElement('div');
        section.className = 'section-title';
        section.textContent = (themeMeta[id]?.label || id) + ' — ' + byTheme[id].length;
        listEl.appendChild(section);
        // Les fiches avec un angle Braña Sana concret remontent en tête, triées par
        // pertinence décroissante — pour repérer vite ce qui compte parmi 60+ articles.
        byTheme[id]
          .slice()
          .sort((a, b) => (b.pertinence_brana_sana || 0) - (a.pertinence_brana_sana || 0))
          .forEach((f) => listEl.appendChild(renderCard(f, id)));
      });
  }

  function renderCard(f, themeId) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--card-color', themeColor(themeId));
    const open = expanded.has(f._key);

    const head = document.createElement('div');
    head.className = 'card-head';
    const pertinence = f.angle_brana_sana ? (f.pertinence_brana_sana || 0) : null;
    head.innerHTML =
      '<p class="card-title">' + escapeHtml(f.titre) + '</p>' +
      (pertinence ? '<span class="badge badge-pertinence">pertinence ' + pertinence + '/5</span>' : '') +
      '<span class="badge">' + escapeHtml(f.type_etude || '?') + '</span>';
    card.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'meta-line';
    meta.textContent = [f.auteurs, f.date, f.ajoute_le ? 'ajouté le ' + f.ajoute_le : null]
      .filter(Boolean).join(' · ');
    card.appendChild(meta);

    if (!open) {
      const snippet = document.createElement('div');
      snippet.className = 'snippet';
      snippet.textContent = f.resultat_principal || '';
      card.appendChild(snippet);
    } else {
      const details = document.createElement('dl');
      details.className = 'details open';
      const rows = [
        ['Mécanisme évalué', f.mecanisme_evalue],
        ['Résultat principal', f.resultat_principal],
        ['Niveau de preuve et limites', f.niveau_de_preuve_et_limites],
        ['Angle Braña Sana', f.angle_brana_sana || '(aucun angle retenu)'],
      ];
      rows.forEach(([label, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        dd.textContent = value || '—';
        details.appendChild(dt);
        details.appendChild(dd);
      });
      if (f.lien) {
        const dt = document.createElement('dt');
        dt.textContent = 'Source';
        const dd = document.createElement('dd');
        const a = document.createElement('a');
        a.href = f.lien;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = f.lien;
        dd.appendChild(a);
        details.appendChild(dt);
        details.appendChild(dd);
      }
      card.appendChild(details);
    }

    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      if (expanded.has(f._key)) expanded.delete(f._key); else expanded.add(f._key);
      render();
    });
    return card;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function render() {
    renderChips();
    renderList();
  }

  render();
})();
</script>
</body>
