<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille La Borbolla — tableau de bord</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 16px 12px;
    max-width: 980px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 16px; }
  .theme-toggle {
    position: absolute; top: 16px; right: 16px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; color: var(--text-primary);
    font-size: 0.8rem; cursor: pointer;
  }
  .controls {
    max-width: 980px; margin: 0 auto; padding: 0 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type="text"] {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 0.85rem;
  }
  input[type="text"] { flex: 1; min-width: 200px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 11px; font-size: 0.78rem; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
    user-select: none;
  }
  .chip.active { color: var(--text-primary); font-weight: 600; border-color: currentColor; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip .count { color: var(--text-muted); }
  .chip.active .count { color: inherit; }
  label.checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
  .buttons { display: flex; gap: 8px; margin-left: auto; }
  button.plain {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer;
  }
  main { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  .count-line { color: var(--text-secondary); font-size: 0.85rem; margin: 6px 0 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 4px solid var(--card-color, var(--gridline));
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer;
  }
  .card-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .card-title { font-size: 0.95rem; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 200px; }
  .badge {
    font-size: 0.7rem; padding: 2px 7px; border-radius: 999px;
    background: var(--gridline); color: var(--text-secondary); white-space: nowrap;
  }
  .badge-pertinence {
    background: rgba(12,163,12,0.16); color: #0ca30c; font-weight: 600;
  }
  .meta-line { color: var(--text-secondary); font-size: 0.78rem; margin-top: 4px; }
  .snippet { color: var(--text-secondary); font-size: 0.85rem; margin-top: 6px; }
  .details { display: none; margin-top: 10px; border-top: 1px solid var(--gridline); padding-top: 10px; font-size: 0.85rem; }
  .details.open { display: block; }
  .details dt { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; margin-top: 8px; }
  .details dd { margin: 2px 0 0; color: var(--text-primary); }
  .details a { color: var(--card-color, #2a78d6); }
  .empty { color: var(--text-muted); text-align: center; padding: 40px 0; }
  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 20px 0 8px; }
</style>
</head>
<body>
<header style="position: relative;">
  <button class="theme-toggle" id="themeToggle">🌓 thème</button>
  <h1>Veille scientifique — La Borbolla</h1>
  <p class="subtitle">Tableau de bord de tri des fiches extraites depuis PubMed.</p>
</header>
<div class="controls">
  <div class="row">
    <select id="runSelect"></select>
    <input type="text" id="search" placeholder="Rechercher (titre, auteurs, résultat…)">
    <div class="buttons">
      <button class="plain" id="expandAll">Tout déplier</button>
      <button class="plain" id="collapseAll">Tout replier</button>
    </div>
  </div>
  <div class="row" id="themeChips"></div>
  <div class="row">
    <select id="typeSelect"><option value="">Tous types d'étude</option></select>
    <label class="checkbox"><input type="checkbox" id="onlyAngle"> avec angle Braña Sana renseigné</label>
  </div>
</div>
<main>
  <div class="count-line" id="countLine"></div>
  <div id="list"></div>
</main>
<script id="fiches-data" type="application/json">[{"titre":"Virtual Reality-Based Green Exercise and State Anxiety in University Students: A Scoping Review and Psychophysiological Framework.","auteurs":"Kong Chuiqing, Yang Jian, Li Haiyi","date":"2026 Nov 03","mecanisme_evalue":"Anxiété état (state anxiety) chez des étudiants universitaires, avec mesures psychophysiologiques candidates : variabilité de la fréquence cardiaque (HRV) et spectroscopie proche infrarouge fonctionnelle (fNIRS), explorant un mécanisme autonome-préfrontal.","resultat_principal":"Sur 346 rapports retenus (306 empiriques, 40 secondaires), seuls 1 rapport \"Direct-core\" et 8 \"Near-core\" ont été identifiés comme directement alignés avec l'exercice vert en réalité virtuelle et l'anxiété état chez des étudiants ; au moins 30 rapports mesuraient la HRV et un seul rapport était positif en fNIRS, ce qui reste insuffisant pour établir des effets cohérents ou valider un mécanisme autonome-préfrontal intégré.","niveau_de_preuve_et_limites":"Revue de portée (scoping review) sur littérature hétérogène (exercice vert en réalité virtuelle, pas en nature réelle) ; les auteurs soulignent eux-mêmes que le nombre de rapports directement pertinents est très faible (1 Direct-core, 8 Near-core sur 306), que les résultats HRV/fNIRS représentent des cas positifs confirmés et non des estimations de prévalence exhaustives, et que les preuves restent insuffisantes pour établir un effet cohérent ou valider un mécanisme causal. Le cadre expérimental 2×2 proposé est explicitement qualifié d'hypothèse à tester, non de résultat établi.","angle_brana_sana":"","pertinence_brana_sana":0,"type_etude":"revue de portée","doi":"10.3390/bs16112087","lien":"https://pubmed.ncbi.nlm.nih.gov/43087386/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43087386","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"An epidemiologic review of associations between air pollution, noise, temperature, green space and multiple dimensions of cortisol regulation in children and adolescents.","auteurs":"Xu Wenyan, Hipwell Alison E, Keenan Kate E, Irene Isi, Kloog Itai, Wright Rosalind J, Wright Robert O, McGuinn Laura A","date":"2026 Nov 18","mecanisme_evalue":"Régulation du cortisol (salivaire, sanguin de cordon, capillaire/cheveux, urinaire) en lien avec l'exposition à la pollution de l'air, au bruit, aux espaces verts et à la température ambiante chez les enfants et adolescents","resultat_principal":"Sur 21 études identifiées, l'exposition prénatale aux particules et polluants gazeux est associée à un cortisol sanguin de cordon plus élevé, le bruit résidentiel/scolaire/aérien est associé à un cortisol salivaire/urinaire plus élevé ou à une variation diurne réduite, et une seule étude trouve une association entre espaces verts et cortisol sanguin plus bas (sur 4 études), les résultats restant globalement mixtes et aucune étude n'ayant évalué directement la température ambiante.","niveau_de_preuve_et_limites":"Revue de portée (scoping review) basée sur seulement 21 études, avec une forte hétérogénéité méthodologique (moment de mesure de l'exposition, type de cortisol mesuré, stade développemental) ; résultats « mixtes » et incohérents selon les études pour les enfants/adolescents ; seulement 4 études sur les espaces verts (dont 2 sans association pour le cortisol capillaire) ; absence totale d'étude sur la température ambiante ; les auteurs appellent à des recherches longitudinales supplémentaires couvrant plusieurs fenêtres développementales et des approches par mélanges d'expositions.","angle_brana_sana":"Les données limitées (4 études seulement) suggérant une association entre exposition aux espaces verts et cortisol plus bas chez l'enfant pourraient appuyer, avec prudence, l'intérêt de proposer des activités en nature (sentier, jardin) pour les familles fréquentant le centre, en gardant à l'esprit la faiblesse et l'hétérogénéité de cette preuve spécifique à la population pédiatrique.","pertinence_brana_sana":2,"type_etude":"revue de portée","doi":"10.1016/j.psyneuen.2026.108073","lien":"https://pubmed.ncbi.nlm.nih.gov/43077905/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43077905","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Green exercise and nature-based physical activity among university students: a systematic review and exploratory meta-analysis of psychological outcomes and experiences.","auteurs":"Zhao Zishan, Hashim Asha Hasnimy Mohd, Huang Jilin, Rong Yuyan","date":"2026","mecanisme_evalue":"Issues psychologiques (stress perçu, anxiété, humeur, fatigue, restauration, estime de soi, connexion à la nature) associées à l'exercice physique en environnement naturel/vert chez des étudiants universitaires","resultat_principal":"La synthèse narrative suggère des bénéfices pour le stress, l'humeur négative, la fatigue, la restauration, l'estime de soi et la connexion à la nature, mais les deux méta-analyses exploratoires (stress perçu, anxiété) restent incertaines, avec une certitude de preuve jugée très faible et des résultats peu clairs quant à l'apport spécifique du cadre naturel par rapport à l'exercice physique seul.","niveau_de_preuve_et_limites":"Revue systématique avec méta-analyse exploratoire (PRISMA 2020, protocole PROSPERO) incluant 35 rapports (34 échantillons indépendants, 14 pays/régions) ; seulement deux études indépendantes par résultat méta-analysé ; intervalle de confiance conventionnel significatif pour le stress perçu mais l'intervalle Hartung-Knapp (plus conservateur) croise le zéro ; hétérogénéité élevée pour l'anxiété (I²=74,3%) ; certitude de preuve GRADE très faible pour les deux résultats poolés ; résultats narratifs hétérogènes et mitigés pour plusieurs variables (dépression, anxiété trait, affect positif, solitude, bien-être mental, burnout) ; les auteurs soulignent explicitement que les preuves sont limitées, basées sur très peu d'études, et qu'il est difficile de distinguer l'effet de l'activité physique de celui de l'environnement naturel ; ils appellent à des études contrôlées séparant ces deux facteurs.","angle_brana_sana":"Les activités de marche ou d'exercice léger en pleine nature (sentiers, bain de forêt) pourraient soutenir le stress perçu, la fatigue et la sensation de restauration des visiteurs, mais la preuve reste très incertaine quant à la part attribuable spécifiquement au cadre naturel plutôt qu'à l'activité physique elle-même ; à présenter avec prudence, sans promesse de bénéfice anxiolytique avéré.","pertinence_brana_sana":2,"type_etude":"revue systématique","doi":"10.3389/fpsyg.2026.1966856","lien":"https://pubmed.ncbi.nlm.nih.gov/43074793/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43074793","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Sleep habits, school willingness, and health-related absenteeism: a cross-sectional study of Japanese high school students.","auteurs":"Matsui Kentaro, Masuya Jiro, Ono Miki, Inoue Yuichi, Shimura Akiyoshi","date":"2026 Nov 26","mecanisme_evalue":"Sommeil (durée, chronotype, jetlag social, qualité du sommeil) et leur association avec la motivation scolaire et l'absentéisme","resultat_principal":"Chez 2658 lycéens japonais, un jetlag social important est associé à une moindre motivation à aller à l'école mais à moins d'absences réelles (relation à double sens), tandis qu'un chronotype tardif, une mauvaise qualité du sommeil et une durée de sommeil ≥10h sont associés à davantage d'absentéisme ; une mauvaise qualité du sommeil est aussi associée à une moindre motivation.","niveau_de_preuve_et_limites":"Étude observationnelle transversale (questionnaire), ce qui ne permet pas d'établir de causalité ; les associations rapportées (odds ratios ajustés) reflètent des corrélations statistiques et non des effets prouvés. Échantillon relativement large (n=2658) limité à 7 lycées de Tokyo et Saitama, ce qui peut limiter la généralisabilité à d'autres contextes culturels ou scolaires ; aucune autre limite méthodologique (biais, hétérogénéité) n'est précisée dans le résumé. [Vérification automatique : à corriger, relire à la source avant tout usage.]","angle_brana_sana":"Sensibiliser les publics jeunes ou familles fréquentant le centre à l'importance de la régularité des horaires de sommeil (réduction du jetlag social) et de la qualité du sommeil, en lien avec les programmes de repos et de retour à des rythmes naturels proposés par Braña Sana.","pertinence_brana_sana":2,"type_etude":"étude observationnelle","doi":"10.1016/j.sleh.2026.10.010","lien":"https://pubmed.ncbi.nlm.nih.gov/43098833/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43098833","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"à corriger","raison":"L'angle d'application suggère que réduire le jetlag social améliorerait l'assiduité, alors que le résumé montre qu'un jetlag social plus faible est associé à davantage d'absentéisme (relation à double sens, non univoque). Le résultat principal est globalement fidèle mais mérite une formulation plus prudente en cohérence avec cette nuance.","journal":"bref"}},{"titre":"Classifying cases of Shift Work Disorder (SWD) in research: A systematic review of published approaches in human studies, with recommended reporting guidelines.","auteurs":"Reynolds Amy C, Bastien Célyne H, Fitton Josh, Wall Prudence L, Delage Julia-Pizzamiglio, Carrier Julie, Adams Robert J, Vallières Annie","date":"2026 Nov 13","mecanisme_evalue":"Trouble du sommeil lié au rythme circadien (trouble du travail posté) : critères diagnostiques, insomnie et somnolence excessive","resultat_principal":"La revue systématique de 93 publications (interventionnelles, observationnelles, expérimentales) montre une très grande variabilité dans les méthodes utilisées pour définir et diagnostiquer le trouble du travail posté (critères diagnostiques, outils d'évaluation, opérationnalisation des symptômes), ce qui limite la comparabilité et la traduction des résultats entre études.","niveau_de_preuve_et_limites":"Revue systématique enregistrée (CRD420250652800) portant sur 93 publications sur 22 ans ; les auteurs signalent eux-mêmes une hétérogénéité méthodologique majeure entre les études incluses (critères diagnostiques, outils de mesure, critères d'inclusion/exclusion des horaires de travail, prise en compte des diagnostics différentiels) comme limite centrale à l'interprétation des résultats agrégés.","angle_brana_sana":"","pertinence_brana_sana":0,"type_etude":"revue systématique","doi":"10.1016/j.smrv.2026.102399","lien":"https://pubmed.ncbi.nlm.nih.gov/43097807/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43097807","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Efficacy of a 12-week chronotype-aligned diet versus a standard hypocaloric diet in overweight and obese women: a randomized controlled trial.","auteurs":"Yildiz Müberra, Yıldıran Hilal, Aksoy Fatih, Özdil Ömer, Akkaya Büşra","date":"2026 Nov 26","mecanisme_evalue":"Alignement du moment des repas sur le chronotype individuel et son effet sur la perte de poids, la composition corporelle et des marqueurs biochimiques/cardiaques","resultat_principal":"Chez des femmes en surpoids ou obèses, un régime hypocalorique aligné sur le chronotype a été associé à une perte de poids significativement plus importante qu'un régime hypocalorique standard de contenu énergétique et macronutritionnel identique (différence ajustée -2,83 kg), avec des réductions plus marquées de l'IMC, du pourcentage de masse grasse et du tour de taille ; les marqueurs glycémiques et lipidiques globaux n'ont pas différé significativement entre groupes, sauf pour le LDL-C qui a diminué davantage dans le groupe aligné uniquement chez les profils du matin (p = 0,015).","niveau_de_preuve_et_limites":"Échantillon réduit (76 femmes randomisées, 62 analysées en per protocole), population limitée aux femmes de 19-53 ans, durée courte (12 semaines) ; absence d'effet significatif global sur les marqueurs glycémiques et lipidiques, avec un effet sur le LDL-C observé seulement dans une sous-strate (morningness) ; les auteurs appellent explicitement à des essais plus larges et plus longs pour confirmer les résultats et évaluer la sécurité à long terme. [Vérification automatique : à corriger, relire à la source avant tout usage.]","angle_brana_sana":"","pertinence_brana_sana":0,"type_etude":"essai contrôlé randomisé","doi":"10.1080/07420528.2026.2768332","lien":"https://pubmed.ncbi.nlm.nih.gov/43097021/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43097021","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"à corriger","raison":"Le résultat principal utilise un verbe causal (\"a entraîné\") alors que le résumé rapporte une différence observée entre groupes randomisés sans affirmation causale explicite plus forte que la comparaison statistique ; il faut reformuler en \"a été associé à\" ou \"a produit\" pour rester fidèle au ton du résumé qui conclut par \"may enhance\". Les limites omettent une réserve notable : l'absence de signification globale sur les marqueurs glycémiques/lipidiques et le fait que seule la strate \"morningness\" montre une différence significative sur le LDL-C, ce qui nuance la portée des résultats.","journal":"bref"}},{"titre":"Psychometric properties and validation of the Hungarian version of the Sleep Hygiene Index among healthcare professionals.","auteurs":"Kanizsai Peter Laszlo, Závodi Péter, Suszter Gergely, Fekete Judit, Eklics Kata, Fusz Katalin","date":"2026","mecanisme_evalue":"Hygiène du sommeil, chronotype (morningness-eveningness), sévérité de l'insomnie, stress perçu, en lien avec le travail posté","resultat_principal":"La version hongroise du Sleep Hygiene Index (SHI-H) montre une fiabilité psychométrique acceptable à excellente ; le chronotype matinal est associé à une meilleure hygiène de sommeil, les travailleurs postés rapportent une hygiène de sommeil moins bonne et une insomnie plus sévère, et l'hygiène de sommeil apparaît comme médiateur statistique de l'association entre chronotype et sévérité de l'insomnie dans ce modèle transversal.","niveau_de_preuve_et_limites":"Étude observationnelle transversale (n = 470) avec sous-échantillon test-retest limité (n = 21) ; design corrélationnel/transversal ne permettant pas d'établir de causalité, la médiation statistique rapportée reste une association indirecte et non une preuve d'effet causal ; population spécifique (professionnels de santé hongrois), limitant la généralisation.","angle_brana_sana":"Les résultats sur le lien entre chronotype, travail posté et mauvaise hygiène de sommeil peuvent informer la conception de programmes de repos à Braña Sana ciblant spécifiquement des publics à horaires irréguliers (soignants, travailleurs postés), en insistant sur des routines de sommeil adaptées au chronotype individuel.","pertinence_brana_sana":2,"type_etude":"étude observationnelle","doi":"10.3389/fpubh.2026.2017111","lien":"https://pubmed.ncbi.nlm.nih.gov/43095104/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43095104","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Association Between Vitamin Knowledge, Practices, and Sleep Quality Among Undergraduate Students at the University of Cape Coast, Ghana: A Cross-Sectional Study.","auteurs":"Tagoe Godrey Nii Armah, Atsu Perpetual Mafiamoe, Ayyub Raheema, Yeboah Aninakwah Marji, Owusu Prince Nana, Twum Benjamin Opoku, Obeng Francis, Felix Agyei Twumasi, Owusu Gabriel, Siame Dion, Eshun Henrietta, Apalebilah Safianu, Donkor David Mawutor, Boachie Joseph","date":"2026 Dec","mecanisme_evalue":"Connaissances et pratiques liées aux vitamines (B6, B12, D) et leur association avec la qualité du sommeil auto-rapportée (durée de sommeil, réveils nocturnes, fatigue diurne), via une échelle composite adaptée de l'indice de qualité du sommeil de Pittsburgh (PSQI)","resultat_principal":"Un niveau de connaissance vitaminique élevé est associé à des scores de problèmes de sommeil auto-rapportés plus faibles (plus favorables) chez les étudiants universitaires ghanéens, mais aucune association significative n'a été observée entre les pratiques alimentaires liées aux vitamines et la qualité du sommeil.","niveau_de_preuve_et_limites":"Étude transversale (n=381) basée sur un échantillonnage de convenance, avec des mesures de sommeil et de connaissances entièrement auto-rapportées (pas de validation biochimique) ; les associations observées ne permettent pas d'établir de causalité. Les auteurs eux-mêmes appellent à des recherches futures avec validation biochimique et devis longitudinaux pour confirmer ces liens.","angle_brana_sana":"","pertinence_brana_sana":0,"type_etude":"étude observationnelle","doi":"10.1002/hsr2.73556","lien":"https://pubmed.ncbi.nlm.nih.gov/43094963/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43094963","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Chronotype in children and adolescents with elevated Sluggish Cognitive Tempo symptoms with and without ADHD: A cross-sectional case-control study.","auteurs":"Tekeoğlu Uğur, Öğütlü Hakan","date":"2026 Nov 25","mecanisme_evalue":"Chronotype (matinalité/vespéralité) et somnolence diurne chez des enfants/adolescents présentant un Sluggish Cognitive Tempo (SCT) avec ou sans TDAH","resultat_principal":"Les groupes High-SCT et SCT+ADHD présentent une vespéralité significativement plus marquée et une somnolence diurne plus élevée que les contrôles sains, le groupe SCT+ADHD affichant la prévalence de vespéralité la plus forte (75%) ; au sein du sous-échantillon SCT-positif, l'association entre sévérité du SCT et chronotype n'est toutefois plus significative, suggérant que le résultat global reflète surtout des différences de seuil entre groupes plutôt qu'une relation dose-dépendante continue.","niveau_de_preuve_et_limites":"Étude observationnelle transversale cas-témoins (n=180, 60 par groupe) ; les auteurs soulignent eux-mêmes que l'association retrouvée dans l'échantillon complet n'est pas répliquée au sein du sous-groupe SCT-positif, ce qui limite l'interprétation causale ; mesures basées sur des échelles auto/hétéro-rapportées (pas de mesure circadienne objective) ; les auteurs appellent à des études longitudinales avec groupes TDAH-seul et mesures circadiennes objectives pour confirmer les résultats ; aucun effet d'intervention testé.","angle_brana_sana":"","pertinence_brana_sana":0,"type_etude":"étude observationnelle","doi":"10.1080/07420528.2026.2768334","lien":"https://pubmed.ncbi.nlm.nih.gov/43094116/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43094116","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Circadian Rhythms, Exercise, and Metabolic Remodeling in MASLD: From Chronometabolism to Muscle-Preserving Care.","auteurs":"Li Aowei, Gu Siqi, Sun Mingshan, Zhang Ziyi, Wu Zimu, Wang Mengyang, Li Kunyang, Tong Fei","date":"2026 Nov 05","mecanisme_evalue":"Rythmes circadiens hépatiques, chronométabolisme (horloge hépatique, signalisation des acides biliaires, métabolisme mitochondrial, équilibre redox), effets de l'exercice et du jeûne/alimentation chronométrée, et préservation musculaire dans la stéatose hépatique métabolique (MASLD)","resultat_principal":"Cette revue narrative critique synthétise que les perturbations du sommeil et du timing des repas sont associées à des phénotypes métaboliques défavorables, que l'exercice améliore les résultats hépatiques et métaboliques sans qu'un moment optimal universel de la séance soit établi, et que les signatures métabolomiques (lipides complexes, acylcarnitines, acides biliaires, corps cétoniques, acides aminés) nécessitent une validation standardisée avant usage clinique.","niveau_de_preuve_et_limites":"Revue narrative critique (non systématique au sens strict d'une méta-analyse, bien que basée sur une recherche structurée multi-bases avec traçage de citations jusqu'au 30 septembre 2026). Les auteurs précisent explicitement que les preuves causales spécifiques à la MASLD concernant le sommeil et le timing des repas restent limitées, qu'aucun moment optimal d'exercice n'est établi, et que les concentrations circulantes de métabolites ne doivent pas être assimilées à un flux tissulaire ou à un bénéfice thérapeutique ; ils appellent à des essais futurs combinant mesures métaboliques répétées et résultats cliniques (foie, composition corporelle, force, fonction physique).","angle_brana_sana":"Le lien entre qualité du sommeil, timing des repas et activité physique régulière (marche, travail manuel) souligné dans cette revue peut nourrir une approche de sensibilisation sur l'importance du rythme veille-sommeil et de l'activité physique modérée régulière dans un programme de repos global, sans viser de preuve clinique directe sur la MASLD.","pertinence_brana_sana":2,"type_etude":"revue narrative","doi":"10.3390/metabo16110857","lien":"https://pubmed.ncbi.nlm.nih.gov/43090394/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43090394","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Association of Maternal Preconception Chronodisruption and Oocyte m6A Modification with Multi-Organ Phenotypic Alterations in Offspring.","auteurs":"He Renke, Zhu Kejing, Jiang Zhaoying, Yu Jiaen, Wu Haiyan, Luo Qinyu, Zhao Tianxin, Zuo Liandong, Chen Zhongzhong, Huang Hefeng","date":"2026 Oct 29","mecanisme_evalue":"Perturbation du cycle lumière-obscurité (chronodisruption) en période préconceptionnelle maternelle, modifications épigénétiques m6A des ovocytes, et effets sur le développement multi-organes (cardiovasculaire, métabolique, cérébral/comportemental) de la descendance","resultat_principal":"Chez le rat, une exposition maternelle continue à la lumière avant conception est associée à des anomalies multisystémiques chez la descendance (prise de poids, altération de la fonction cardiaque, épaississement vasculaire, hypertension, résistance à l'insuline, troubles comportementaux et cognitifs), potentiellement liées à des modifications de la méthylation m6A dans les ovocytes maternels.","niveau_de_preuve_et_limites":"Étude animale (modèle rat) explorant une association, pas une preuve de causalité directe chez l'humain ; le résumé ne précise pas la taille de l'échantillon, l'absence ou présence de groupe contrôle n'est pas explicitement détaillée, et aucune limite méthodologique n'est mentionnée dans le résumé — à noter que les résultats sur modèle animal ne sont pas directement transposables à l'humain.","angle_brana_sana":"Bien que l'étude porte sur la perturbation du cycle lumière-obscurité et ses effets transgénérationnels chez le rat, elle renforce indirectement l'importance de la régulation de l'exposition lumineuse et du respect des rythmes circadiens naturels, un principe cohérent avec les programmes de repos et de sommeil proposés à Braña Sana (limitation de la lumière artificielle, respect du cycle jour/nuit pendant les séjours).","pertinence_brana_sana":1,"type_etude":"étude observationnelle","doi":"10.3390/cimb48111132","lien":"https://pubmed.ncbi.nlm.nih.gov/43088434/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43088434","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Afternoon Spectral Reddening of Daylight as a Candidate Physical Cue for Sundowning Syndrome: A Computational Hypothesis.","auteurs":"Artun Erbil Can, Siddiki Afif","date":"2026 Oct 28","mecanisme_evalue":"Composition spectrale de la lumière du jour en fin d'après-midi et sa stimulation mélanopique (cellules ganglionnaires rétiniennes à mélanopsine), proposée comme signal physique candidat du syndrome du coucher de soleil (\"sundowning\")","resultat_principal":"Un modèle computationnel (géométrie solaire, radiance du ciel clair, pondérations CIE) montre que le ratio d'efficacité mélanopique de la lumière diurne diminue fortement en fin d'après-midi (de ~1,33 à midi solaire à ~0,89 près de l'horizon) alors que l'éclairement total varie beaucoup moins, ce qui amène les auteurs à proposer le \"rougissement spectral\" (et non l'obscurité elle-même) comme signal physique candidat du sundowning, une hypothèse testable mais non vérifiée empiriquement ici.","niveau_de_preuve_et_limites":"Il s'agit d'une hypothèse purement computationnelle/théorique : aucune donnée patient, aucune mesure physiologique réelle n'a été collectée. Les auteurs précisent eux-mêmes que ce sont des estimations de composition spectrale modélisées, les moins certaines près de l'horizon, et non des mesures de stimulation mélanopique physiologique réelle. Aucun lien causal avec le sundowning n'est démontré ; il s'agit d'une proposition à tester expérimentalement.","angle_brana_sana":"La notion que la composition spectrale de la lumière (et pas seulement son intensité) varie fortement en fin de journée pourrait éclairer la conception des espaces de repos et des activités en extérieur (ex. moment de la marche ou du bain de forêt en fin d'après-midi, orientation des fenêtres des espaces de sieste) pour accompagner en douceur la transition jour/soir, bien que l'hypothèse reste théorique et non validée sur des personnes.","pertinence_brana_sana":2,"type_etude":"article théorique ou perspective","doi":"10.3390/brainsci16111168","lien":"https://pubmed.ncbi.nlm.nih.gov/43088284/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43088284","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Prevalence, Changes, and Factors Associated with Long COVID in Mainland China after the Policy Shift: Findings from a Two-Wave Cross-Sectional Study.","auteurs":"Ruan Xiaoli, Yuan Yang, Wang Yujie, Zhang Yujing, Li Jinfeng, Liu Jie, Zhang Zechen, Zhang Xiao, Li Zhiwei, Zhang Xiaolin, Ma Yuxia, Liu Mengyang","date":"2026 Sep 14","mecanisme_evalue":"Prévalence et facteurs associés au COVID long (dont régularité du sommeil-éveil, alimentation, exposition solaire, relations sociales, vaccination)","resultat_principal":"Sur 47 464 participants, la prévalence du COVID long était de 52,34% (en baisse dans le temps), la fatigue étant le symptôme le plus fréquent ; un sommeil-éveil régulier était associé à une réduction du risque de COVID long (OR 0,81 [0,77-0,84]), de même que d'autres facteurs comme une alimentation équilibrée, l'exposition solaire, un bon environnement social et la vaccination, tandis que le sexe féminin, l'âge 18-59 ans, les maladies chroniques/mentales et la consommation d'alcool étaient associés à un risque accru.","niveau_de_preuve_et_limites":"Étude observationnelle transversale répétée (deux vagues), basée sur un questionnaire en ligne auto-rapporté ; les associations rapportées (odds ratios) ne permettent pas d'établir de lien causal ; le résumé ne précise pas de limites méthodologiques explicites (biais de déclaration, représentativité de l'échantillon, absence de groupe contrôle) — non précisé dans le résumé.","angle_brana_sana":"Le lien statistique (association, non causal) entre régularité du cycle sommeil-éveil et réduction du risque de symptômes persistants post-COVID peut appuyer, avec prudence, un discours sur l'importance d'une hygiène de sommeil régulière dans les programmes de repos proposés par Braña Sana, sans prétendre à un effet thérapeutique démontré.","pertinence_brana_sana":2,"type_etude":"étude observationnelle","doi":"10.1007/s44197-026-00642-8","lien":"https://pubmed.ncbi.nlm.nih.gov/43083955/","source":"PubMed","niveau_de_preuve":"non évalué","pmid":"43083955","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","verification":{"statut":"confirmé","raison":"","journal":"une"}},{"titre":"Correction: Responsiveness of ThymoDream® as a natural modulator of the circadian axis: a comparative RCT with melatonin supplementation employing melatonin profiling and actigraphy.","auteurs":"Harshith C S, Jestin Thomas V, Syam Das S, Prathibha Prabhakaran, Allimuthu Nithyanandam, Abhirami N, Radhika A, Krishnakumar I M, Ayyappan Janeesh Plakkal","date":"2026","mecanisme_evalue":"non précisé dans le résumé","resultat_principal":"le résumé ne fait que signaler <script>
(function () {
  const fiches = JSON.parse(document.getElementById('fiches-data').textContent);
  const themeMeta = JSON.parse(document.getElementById('theme-meta').textContent);

  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

  function themeColor(id) {
    const meta = themeMeta[id] || themeMeta['_non-classe'];
    return isDark() ? meta.color.dark : meta.color.light;
  }

  // --- thème clair/sombre ---
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    render();
  });

  // --- dates de run disponibles (plus récent en premier) ---
  const runDates = [...new Set(fiches.map((f) => f.ajoute_le).filter(Boolean))].sort().reverse();
  const runSelect = document.getElementById('runSelect');
  const allOption = document.createElement('option');
  allOption.value = '__all__';
  allOption.textContent = 'Toute la base (' + fiches.length + ' fiches)';
  runSelect.appendChild(allOption);
  runDates.forEach((d) => {
    const opt = document.createElement('option');
    opt.value = d;
    const n = fiches.filter((f) => f.ajoute_le === d).length;
    opt.textContent = d + ' (' + n + ' nouvelle' + (n > 1 ? 's' : '') + ')';
    runSelect.appendChild(opt);
  });
  if (runDates.length) runSelect.value = runDates[0];

  // --- filtre types d'étude ---
  const typeSelect = document.getElementById('typeSelect');
  [...new Set(fiches.map((f) => f.type_etude).filter(Boolean))].sort().forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  });

  // --- état des filtres ---
  const state = { themes: new Set(), search: '', type: '', onlyAngle: false };
  const expanded = new Set();

  const themeChipsEl = document.getElementById('themeChips');
  const searchEl = document.getElementById('search');
  const onlyAngleEl = document.getElementById('onlyAngle');
  const listEl = document.getElementById('list');
  const countLineEl = document.getElementById('countLine');

  runSelect.addEventListener('change', render);
  typeSelect.addEventListener('change', () => { state.type = typeSelect.value; render(); });
  searchEl.addEventListener('input', () => { state.search = searchEl.value.trim().toLowerCase(); render(); });
  onlyAngleEl.addEventListener('change', () => { state.onlyAngle = onlyAngleEl.checked; render(); });
  document.getElementById('expandAll').addEventListener('click', () => {
    currentVisible().forEach((f) => expanded.add(f._key));
    render();
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    expanded.clear();
    render();
  });

  fiches.forEach((f, i) => { f._key = (f.doi || f.titre || '') + '::' + i; });

  function currentRunFiches() {
    const val = runSelect.value;
    if (val === '__all__') return fiches;
    return fiches.filter((f) => f.ajoute_le === val);
  }

  function currentVisible() {
    let list = currentRunFiches();
    if (state.themes.size) list = list.filter((f) => state.themes.has(f.thematique_id));
    if (state.type) list = list.filter((f) => f.type_etude === state.type);
    if (state.onlyAngle) list = list.filter((f) => (f.angle_brana_sana || '').trim().length > 0);
    if (state.search) {
      const q = state.search;
      list = list.filter((f) =>
        (f.titre || '').toLowerCase().includes(q) ||
        (f.auteurs || '').toLowerCase().includes(q) ||
        (f.resultat_principal || '').toLowerCase().includes(q) ||
        (f.mecanisme_evalue || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function renderChips() {
    const runFiches = currentRunFiches();
    const counts = {};
    runFiches.forEach((f) => { counts[f.thematique_id] = (counts[f.thematique_id] || 0) + 1; });
    themeChipsEl.innerHTML = '';
    Object.keys(themeMeta).forEach((id) => {
      const n = counts[id] || 0;
      if (n === 0 && !state.themes.has(id)) return;
      const chip = document.createElement('div');
      chip.className = 'chip' + (state.themes.has(id) ? ' active' : '');
      chip.innerHTML = '<span class="dot" style="background:' + themeColor(id) + '"></span>' +
        escapeHtml(themeMeta[id].label) + ' <span class="count">' + Number(n) + '</span>';
      chip.addEventListener('click', () => {
        if (state.themes.has(id)) state.themes.delete(id); else state.themes.add(id);
        render();
      });
      themeChipsEl.appendChild(chip);
    });
  }

  function fmtDate(d) {
    return d || '—';
  }

  function renderList() {
    const visible = currentVisible();
    countLineEl.textContent = visible.length + ' fiche' + (visible.length > 1 ? 's' : '') +
      (state.themes.size || state.type || state.onlyAngle || state.search ? ' (filtrées)' : '');
    listEl.innerHTML = '';
    if (!visible.length) {
      listEl.innerHTML = '<div class="empty">Aucune fiche ne correspond à ces filtres.</div>';
      return;
    }
    const byTheme = {};
    visible.forEach((f) => {
      (byTheme[f.thematique_id] = byTheme[f.thematique_id] || []).push(f);
    });
    Object.keys(byTheme)
      .sort((a, b) => (themeMeta[a]?.label || '').localeCompare(themeMeta[b]?.label || ''))
      .forEach((id) => {
        const section = document.createElement('div');
        section.className = 'section-title';
        section.textContent = (themeMeta[id]?.label || id) + ' — ' + byTheme[id].length;
        listEl.appendChild(section);
        // Les fiches avec un angle Braña Sana concret remontent en tête, triées par
        // pertinence décroissante — pour repérer vite ce qui compte parmi 60+ articles.
        byTheme[id]
          .slice()
          .sort((a, b) => (b.pertinence_brana_sana || 0) - (a.pertinence_brana_sana || 0))
          .forEach((f) => listEl.appendChild(renderCard(f, id)));
      });
  }

  function renderCard(f, themeId) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--card-color', themeColor(themeId));
    const open = expanded.has(f._key);

    const head = document.createElement('div');
    head.className = 'card-head';
    const pertinence = f.angle_brana_sana ? (Number(f.pertinence_brana_sana) || 0) : null;
    head.innerHTML =
      '<p class="card-title">' + escapeHtml(f.titre) + '</p>' +
      (pertinence ? '<span class="badge badge-pertinence">pertinence ' + pertinence + '/5</span>' : '') +
      '<span class="badge">' + escapeHtml(f.type_etude || '?') + '</span>';
    card.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'meta-line';
    meta.textContent = [f.auteurs, f.date, f.ajoute_le ? 'ajouté le ' + f.ajoute_le : null]
      .filter(Boolean).join(' · ');
    card.appendChild(meta);

    if (!open) {
      const snippet = document.createElement('div');
      snippet.className = 'snippet';
      snippet.textContent = f.resultat_principal || '';
      card.appendChild(snippet);
    } else {
      const details = document.createElement('dl');
      details.className = 'details open';
      const rows = [
        ['Mécanisme évalué', f.mecanisme_evalue],
        ['Résultat principal', f.resultat_principal],
        ['Niveau de preuve et limites', f.niveau_de_preuve_et_limites],
        ['Angle Braña Sana', f.angle_brana_sana || '(aucun angle retenu)'],
      ];
      rows.forEach(([label, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        dd.textContent = value || '—';
        details.appendChild(dt);
        details.appendChild(dd);
      });
      // Liens web uniquement : jamais de javascript: ni de data:.
      if (/^https?:\/\//i.test(f.lien || '')) {
        const dt = document.createElement('dt');
        dt.textContent = 'Source';
        const dd = document.createElement('dd');
        const a = document.createElement('a');
        a.href = f.lien;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = f.lien;
        dd.appendChild(a);
        details.appendChild(dt);
        details.appendChild(dd);
      }
      card.appendChild(details);
    }

    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      if (expanded.has(f._key)) expanded.delete(f._key); else expanded.add(f._key);
      render();
    });
    return card;
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function render() {
    renderChips();
    renderList();
  }

  render();
})();
</script>
</body>
</html>
