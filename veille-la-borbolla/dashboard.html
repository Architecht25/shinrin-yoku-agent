tigraphiques)","resultat_principal":"Chez des patients en épisode dépressif majeur, la présence de siestes diurnes est associée à un profil clinique distinct caractérisé par plus d'hypersomnie, de somnolence diurne, de fatigue, de prise de poids et de culpabilité, mais l'actigraphie objective n'a pas révélé de différences significatives entre groupes.","niveau_de_preuve_et_limites":"Étude observationnelle comparative (pas d'essai contrôlé randomisé, pas de lien causal établi) ; les mesures objectives par actigraphie n'étaient disponibles que pour un sous-échantillon utilisable de N=90, ce qui limite la puissance statistique de cette partie de l'analyse ; les résultats reposent en grande partie sur des échelles subjectives (HSI, PSQI) et des auto-déclarations, avec des sous-groupes (unipolaire/bipolaire) de taille probablement réduite ; aucune autre limite méthodologique explicite n'est précisée dans le résumé.","angle_brana_sana":"Cette étude concerne spécifiquement un phénotype clinique de dépression majeure avec hypersomnolence pathologique, un contexte très différent de la sieste occasionnelle ou de la marche pratiquées dans un cadre de bien-être préventif. Il n'y a pas de lien concret et honnête à établir avec les programmes sieste/marche de Braña Sana sans risquer une confusion entre repos récréatif et symptôme clinique de trouble de l'humeur.","pertinence_brana_sana":0,"doi":"10.1093/sleepadvances/zpag097","lien":"https://pubmed.ncbi.nlm.nih.gov/42871667/","source":"PubMed","pmid":"42871667","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Does attention matter more than exposure? A pilot RCT of nature-based mindfulness for mental well-being and stress.","auteurs":"Huemer Sabine V, Hu Zhirui, Aiona-Agra Makena","date":"2026-09-24","type_etude":"RCT","mecanisme_evalue":"Bien-être mental, stress perçu et connexion à la nature, en lien avec la qualité de l'engagement attentionnel (mindfulness) versus la quantité d'exposition à la nature","resultat_principal":"Les estimations ponctuelles favorisaient le groupe mindfulness en nature structurée par rapport à la marche libre non structurée pour le bien-être mental et le stress perçu, mais aucune différence entre groupes n'a atteint la significativité statistique ; les deux groupes ont augmenté leur connexion à la nature sans différence significative entre eux, et cette connexion ne médiait pas les effets observés.","niveau_de_preuve_et_limites":"Essai pilote avec échantillon très réduit (N=35), explicitement sous-dimensionné pour détecter des effets de cette ampleur avec une puissance statistique adéquate selon les auteurs eux-mêmes ; la durée d'exposition à la nature n'a pas été manipulée indépendamment, ce qui limite l'interprétation causale du lien entre attention et exposition ; les auteurs qualifient ces résultats de préliminaires, davantage générateurs d'hypothèses que probants.","angle_brana_sana":"Résultat pertinent pour affiner les protocoles de sentier de bain de forêt et de mindfulness du centre : suggère qu'une courte session guidée de pleine conscience en nature (15 min) pourrait être au moins aussi bénéfique qu'une marche libre plus longue, avec un bénéfice potentiellement plus marqué pour les visiteurs ayant un niveau de bien-être initial plus bas — à prendre comme piste à explorer plutôt que comme preuve établie, vu la taille d'échantillon très limitée.","pertinence_brana_sana":2,"doi":"10.3389/fpsyg.2026.1905841","lien":"https://pubmed.ncbi.nlm.nih.gov/42851293/","source":"PubMed","pmid":"42851293","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Comparable memory retention following brief periods of wakeful rest and napping: A pilot study.","auteurs":"Weng Linman, Xie Ruyue, Cao Zhongqian, Wang Siyu, Chen Yuanyuan, Jülich Simon Theodor, Lei Xu","date":"2026 Oct 07","type_etude":"RCT","mecanisme_evalue":"Mémoire de reconnaissance (rétention mnésique) après repos éveillé vs sieste légère, avec marqueurs électrophysiologiques (ERP FN400/LPC, décodage multivarié EEG)","resultat_principal":"Sur un court intervalle post-encodage (20 min), la rétention mnésique générale après repos éveillé était comparable à celle observée après une courte sieste, toutes deux supérieures à une condition de jeu vidéo, avec des patterns électrophysiologiques (FN400, LPC, décodage EEG) également similaires entre les deux groupes.","niveau_de_preuve_et_limites":"Étude pilote avec échantillon modeste (90 participants répartis en 3 groupes de 20 min de délai), ce qui limite la puissance statistique ; les auteurs utilisent des tests d'équivalence bayésienne (preuve \"modérée\") plutôt que des tests de supériorité classiques, ce qui reste une évidence d'équivalence et non une démonstration causale forte ; l'intervalle testé est court (20 min), donc les résultats ne sont pas généralisables à des délais plus longs ou à une récupération mnésique à long terme ; absence de précision sur la diversité de l'échantillon (âge, population) dans le résumé fourni.","angle_brana_sana":"Ce résultat suggère qu'une courte pause de repos éveillé (sans sommeil), par exemple lors d'un temps calme en pleine nature ou d'un moment de mindfulness après un atelier, pourrait offrir un bénéfice de consolidation mnésique comparable à une sieste courte — un argument pour proposer des temps de repos éveillé encadrés (bain de forêt silencieux, pause contemplative) comme alternative accessible à la sieste dans les programmes où celle-ci n'est pas pratique.","pertinence_brana_sana":2,"doi":"10.1016/j.biopsycho.2026.109411","lien":"https://pubmed.ncbi.nlm.nih.gov/42843778/","source":"PubMed","pmid":"42843778","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"The associations among athlete status, sleep, and well-being in a large national sample of college students.","auteurs":"O'Neil Bridget, O'Rourke Casandra, Linss Hannah, Anderson Austen R","date":"2026 Oct 01","type_etude":"étude observationnelle","mecanisme_evalue":"Sommeil (durée, qualité, siestes) et son rôle médiateur dans l'association entre statut d'athlète et bien-être (flourishing)","resultat_principal":"Par rapport aux non-athlètes, les étudiants athlètes rapportent une meilleure qualité de sommeil, une durée de sommeil plus longue, moins de différence semaine/week-end, et des siestes plus fréquentes et plus longues ; ces facteurs de sommeil sont associés au bien-être (flourishing), mais les associations indirectes sont faibles (β < .06), ce qui relève d'une association statistique et non d'une preuve d'effet causal.","niveau_de_preuve_et_limites":"Étude observationnelle transversale basée sur des données auto-rapportées (National College Health Assessment, N=28 608) et modèles d'équations structurelles ; grande taille d'échantillon mais nature corrélationnelle empêchant toute inférence causale, absence de groupe contrôle expérimental, et effets indirects rapportés comme petits (β < .06) ; aucune autre limite méthodologique (hétérogénéité, biais spécifiques) n'est précisée dans le résumé.","angle_brana_sana":"La sieste et la régularité du sommeil comme leviers associés au bien-être pourraient inspirer un volet du programme repos/sommeil de Braña Sana (ex. ateliers sur l'hygiène du sommeil et la sieste), bien que l'effet mesuré ici soit faible et issu d'une population étudiante/athlète spécifique, nécessitant prudence dans la transposition.","pertinence_brana_sana":2,"doi":"10.1080/07448481.2026.2737809","lien":"https://pubmed.ncbi.nlm.nih.gov/42821838/","source":"PubMed","pmid":"42821838","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"The effects of 10,000 steps on well-being, cognition and behaviour: A 14-day walking experiment.","auteurs":"Goh Adalia Y H, Chen Claudia R X, Koay Michelle L M, Han Isabelle, Hartanto Andree","date":"2026 Sep 25","type_etude":"RCT","mecanisme_evalue":"Affect négatif, défaillances cognitives (cognitive failures), procrastination/autorégulation en lien avec un objectif quotidien de 10 000 pas","resultat_principal":"Un objectif quotidien de 10 000 pas pendant 14 jours avec rappels quotidiens a augmenté le nombre moyen de pas (d=0.55) et a été associé à une réduction de l'affect négatif (d=-0.41), des défaillances cognitives (d=-0.43) et de la procrastination (d=-0.48) par rapport à un groupe contrôle en liste d'attente.","niveau_de_preuve_et_limites":"Essai randomisé entre sujets de 14 jours sur un échantillon d'étudiants universitaires (N=195, intervention n=90, contrôle n=105) ; population spécifique (étudiants), durée courte (14 jours) limitant la généralisabilité et la pérennité des effets ; le groupe contrôle était en liste d'attente (absence de condition active comparable, possible effet de nouveauté/attention dans le groupe intervention) ; non précisé dans le résumé concernant d'autres biais méthodologiques ou mesures de suivi à long terme.","angle_brana_sana":"La marche quotidienne structurée (objectif de pas, rappels) pourrait s'intégrer comme complément simple et peu coûteux aux parcours de sentier et aux programmes de repos de Braña Sana, en appui à la réduction du stress perçu et au soutien de l'autorégulation chez les participants, en complément du bain de forêt et non comme substitut.","pertinence_brana_sana":3,"doi":"10.1177/13591053261487794","lien":"https://pubmed.ncbi.nlm.nih.gov/42788380/","source":"PubMed","pmid":"42788380","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Comparing the Effects of a Short Nap and Non-Sleep Deep Rest on Perceptual, Cognitive, and Physical Performance in Active Adults","auteurs":"Boukhris Omar, Suppiah Haresh, Driller Matthew","date":"2026 Aug 28","type_etude":"RCT","mecanisme_evalue":"Sommeil/récupération - effets d'une courte sieste (25 min) versus repos profond sans sommeil (NSDR, 10 min) sur la somnolence, la fatigue, la préparation perçue (readiness), la force de préhension et la performance cognitive (temps de réaction, précision)","resultat_principal":"À 40 min post-intervention, le groupe sieste a rapporté une fatigue plus faible et une meilleure préparation perçue à l'effort que les groupes contrôle et NSDR, alors qu'aucun effet significatif n'a été observé pour le NSDR sur les mesures perceptuelles, cognitives ou physiques, et aucune différence significative de force de préhension n'a été trouvée entre groupes malgré une interaction groupe×temps significative.","niveau_de_preuve_et_limites":"Essai contrôlé randomisé avec échantillon modéré (n=60, 20 par groupe) d'adultes jeunes physiquement actifs ; les auteurs ajustent statistiquement pour le sexe, le sommeil de la nuit précédente et l'activité physique hebdomadaire, ce qui renforce la rigueur méthodologique. Cependant, le résumé ne précise pas d'autres limites (durée de suivi courte limitée à 40 min, population spécifique de jeunes adultes actifs, absence de données sur la généralisabilité à d'autres populations) — non précisé dans le résumé au-delà de ces éléments.","angle_brana_sana":"Cette étude appuie l'intégration d'une courte sieste (~25 min) plutôt qu'une séance de repos profond sans sommeil (NSDR) dans un programme de repos à Braña Sana visant à réduire la fatigue perçue et améliorer la sensation de préparation avant une activité physique ou manuelle, avec un effet mesurable après une période de latence de 20-40 minutes.","pertinence_brana_sana":3,"doi":"10.3390/clockssleep8030052","lien":"https://pubmed.ncbi.nlm.nih.gov/42783005/","source":"PubMed","pmid":"42783005","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"New mothers' perceptions of navigating fatigue and driving risks: a qualitative pilot study","auteurs":"Bachmann A, Thorne H, Vincent GE, Ferguson SA, Thomas MJW, Miller DJ, Gupta CC, Kahn M, Deans EJ, Smith RG, Sprajcer M","date":"2026 Dec 15","type_etude":"étude observationnelle","mecanisme_evalue":"Perception subjective de la fatigue liée au manque de sommeil chez les jeunes mères et son impact sur la conduite automobile (vigilance, comportements de compensation)","resultat_principal":"L'analyse thématique de 12 entretiens semi-structurés révèle que la conduite en état de fatigue et les expériences de conduite à risque (quasi-accidents, erreurs) sont fréquentes chez les jeunes mères, qui utilisent un mélange de contre-mesures validées (sieste, arrêt sur le bas-côté) et non validées scientifiquement (musique, baisser la vitre), et expriment un besoin d'éducation pratique sur le sujet.","niveau_de_preuve_et_limites":"Étude qualitative pilote avec un échantillon très restreint (n=12), limité à des mères australiennes avec un enfant de moins de 12 mois ; les résultats sont descriptifs et exploratoires, non généralisables, sans groupe contrôle, et reposent sur des perceptions autorapportées plutôt que sur des mesures objectives de fatigue ou de performance de conduite.","angle_brana_sana":"Cette étude souligne l'efficacité perçue et reconnue de la sieste comme contre-mesure validée contre la fatigue, ce qui conforte l'intérêt d'intégrer des temps de sieste courte et un programme de repos structuré au sein de Braña Sana, notamment pour les parents de jeunes enfants en quête de récupération ; toutefois le lien avec la marche ou le bain de forêt n'est pas directement abordé dans ce résumé.","pertinence_brana_sana":2,"doi":"10.1016/j.sleep.2026.109270","lien":"https://pubmed.ncbi.nlm.nih.gov/42762628/","source":"PubMed","pmid":"42762628","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Napping improves interhemispheric functional coordination during night shifts in nurses: analysis of voxel-mirrored homotopic connectivity","auteurs":"Cai Li-Min, Huang Zhe-Yi, Lin Hong-Yu, Zhang Xiao-Hong, Dong Qiu-Yi, Chen Hua-Jun, Lin Yan-Juan","date":"2026-08-20","type_etude":"étude observationnelle","mecanisme_evalue":"Coordination fonctionnelle interhémisphérique cérébrale (connectivité homotopique en IRMf au repos, VMHC) et performance neurocognitive en lien avec la privation de sommeil et la sieste","resultat_principal":"Chez 21 infirmières, la privation de sommeil (24h) a augmenté la connectivité homotopique interhémisphérique (VMHC) dans de nombreuses régions cérébrales, tandis qu'une sieste de deux heures pendant le travail de nuit a réduit cette VMHC dans ces mêmes régions ; ces changements de VMHC étaient corrélés à une amélioration des performances neurocognitives, suggérant une association entre sieste, réorganisation de la connectivité cérébrale et récupération cognitive.","niveau_de_preuve_et_limites":"Étude de petite taille (21 participantes, toutes des femmes infirmières), design intra-sujet avec trois sessions (RW, SD, NAP) sans groupe contrôle externe distinct ; les auteurs eux-mêmes indiquent que les liens neuro-cognitifs observés sont préliminaires (\"tentatively\") et nécessitent une validation sur des cohortes élargies. Il s'agit d'une association statistique entre modifications de connectivité et performance cognitive, et non d'une preuve de causalité directe.","angle_brana_sana":"Cette étude apporte un éclairage neuroscientifique sur les bénéfices cognitifs d'une sieste de récupération après privation de sommeil, ce qui peut appuyer le discours de Braña Sana sur l'intégration de temps de sieste/repos structurés dans les programmes de sommeil et de régénération, bien que le contexte spécifique (travail de nuit chez des infirmières) diffère du public général du centre.","pertinence_brana_sana":2,"doi":"10.3389/fneur.2026.1889180","lien":"https://pubmed.ncbi.nlm.nih.gov/42694886/","source":"PubMed","pmid":"42694886","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Snoozing While Cruising: Nap Frequency as a Fatigue-Management Indicator and Risk Marker in Naval Operations","auteurs":"Russell Dale W, Germain Anne","date":"2026 Sep 03","type_etude":"étude observationnelle","mecanisme_evalue":"Sommeil / fatigue : fréquence de sieste et son association avec stress occupationnel, burnout, fonctionnement et santé mentale/physique","resultat_principal":"Une fréquence de sieste plus élevée est associée à des probabilités plus faibles de stress professionnel élevé et de fonctionnement altéré, mais aussi à des probabilités plus élevées de burnout et, pour les siestes ≥5 jours/semaine, à davantage de jours de mauvaise santé mentale ; aucune association significative n'a été trouvée avec le nombre de jours de mauvaise santé physique.","niveau_de_preuve_et_limites":"Étude observationnelle transversale sur un large échantillon de marins actifs de l'US Navy ; les résultats sont des associations statistiques et non des preuves d'effet causal. Le résumé ne précise pas de limites méthodologiques spécifiques (taille exacte de l'échantillon, biais de déclaration, absence de groupe contrôle) — non précisé dans le résumé.","angle_brana_sana":"Les résultats nuancent l'usage de la sieste comme outil de gestion de la fatigue dans un programme de repos : elle peut être utile en complément ponctuel quand le temps de sommeil nocturne est limité, mais ne doit pas être présentée comme un substitut à un sommeil suffisant ni comme solution isolée au stress chronique — utile pour calibrer honnêtement les recommandations du pilier sommeil/repos de Braña Sana.","pertinence_brana_sana":2,"doi":"10.1111/jsr.70420","lien":"https://pubmed.ncbi.nlm.nih.gov/42692480/","source":"PubMed","pmid":"42692480","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Physiological and psychological outcomes of a community-based Kurort Health Walking program: A before-after study.","auteurs":"Miura Saori, Horikawa Shinji, Morizono Kana, Miyazaki Miyu, Torii Hiroki, Kuroda Hiromi, Matsuura Emi","date":"2026-09-03","type_etude":"étude observationnelle","mecanisme_evalue":"Tension artérielle, fréquence cardiaque, variabilité de la fréquence cardiaque (ratio LF/HF, puissance HF) et états de l'humeur (vigueur, convivialité, plaisir, relaxation, anxiété)","resultat_principal":"La participation à un programme de marche de santé de type \"Kurort\" en forêt est associée à une baisse significative de la tension artérielle systolique et diastolique, à une amélioration de l'humeur (hausse de la vigueur, convivialité, plaisir, relaxation) et à une baisse de l'anxiété, sans changement significatif des indices de variabilité cardiaque (LF/HF, HF).","niveau_de_preuve_et_limites":"Étude avant-après sans groupe contrôle, sur 90 participants ; les auteurs précisent explicitement que l'absence de groupe contrôle empêche de distinguer les contributions respectives de l'environnement forestier, de l'activité physique et d'autres facteurs contextuels. Il s'agit donc d'une association observée à court terme, non d'une preuve d'effet causal attribuable spécifiquement à la forêt.","angle_brana_sana":"Pertinent pour un programme de marche encadrée sur les sentiers de Braña Sana, en tant qu'activité combinant mouvement doux et immersion naturelle favorisant détente et amélioration de l'humeur à court terme — à présenter avec prudence, sans affirmer un effet spécifique de la forêt isolé de la marche elle-même.","pertinence_brana_sana":3,"doi":"10.1371/journal.pone.0357733","lien":"https://pubmed.ncbi.nlm.nih.gov/42691065/","source":"PubMed","pmid":"42691065","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Prevalence and Risk of Mild Cognitive Impairment Among Chinese Adults Aged 60 Years and Above: A Cross-Sectional Study Based on National Data.","auteurs":"Wen Qingpan, Zhou Xinli, Xie Changyi, Pan Hongying, Zhou Huan, Bialas Marcin, Dai Bifen, Lei Jiepeng","date":"2026 Aug 15","type_etude":"étude observationnelle","mecanisme_evalue":"Déclin cognitif léger (MCI) et facteurs associés : dépression (score CESD), sommeil (sieste et sommeil nocturne), mémoire, genre, milieu de vie (rural/urbain)","resultat_principal":"Dans cet échantillon transversal d'adultes chinois âgés de 60 ans et plus, la prévalence du MCI était de 14,54%, et un score de dépression (CESD) élevé, le fait de vivre en zone rurale, la pratique de la sieste, un sommeil nocturne altéré, le genre féminin et le niveau de mémoire étaient associés de façon statistiquement significative à un risque accru de MCI (associations, non causalité).","niveau_de_preuve_et_limites":"Étude observationnelle transversale (données 2018, Wave 4) ; échantillon final réduit à 694 individus répondant aux critères d'inclusion sur un échantillon initial de 19 744 puis 4773 valides, ce qui suggère une forte réduction et un possible biais de sélection ; nature transversale empêchant toute inférence causale (seules des corrélations/associations sont rapportées) ; absence de groupe contrôle explicite ; aucune autre limite méthodologique n'est précisée dans le résumé.","angle_brana_sana":"L'association observée entre sieste diurne et risque accru de MCI invite à la prudence dans la manière dont Braña Sana présente la sieste dans ses programmes de repos : plutôt que de la promouvoir sans nuance comme bénéfique, il serait honnête de contextualiser son rôle (ex. sieste compensatoire d'un sommeil nocturne perturbé) et de privilégier une approche globale associant qualité du sommeil nocturne, activité physique et soutien de l'humeur, en cohérence avec le pilier repos/sommeil du centre.","pertinence_brana_sana":2,"doi":"10.62641/aep.v54i4.2096","lien":"https://pubmed.ncbi.nlm.nih.gov/42633529/","source":"PubMed","pmid":"42633529","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Effects of community-based daytime napping on cognitive performance and daytime functioning in adolescents with insufficient sleep - A field-based experimental study.","auteurs":"Ho Chung Wai, Chan Ngan Yin, Li Shirley Xin","date":"2026 Dec 11","type_etude":"RCT","mecanisme_evalue":"Somnolence diurne, affect (positif/négatif), attention soutenue, contrôle inhibiteur et sommeil nocturne subséquent chez des adolescents en dette de sommeil","resultat_principal":"Une sieste communautaire de 30 minutes à l'heure du déjeuner réduit significativement la somnolence, maintient l'affect positif et améliore l'attention soutenue par rapport à un simple repos éveillé, sans perturber le sommeil nocturne ultérieur, mais sans effet significatif sur l'affect négatif, le contrôle inhibiteur ou le contrôle du conflit émotionnel.","niveau_de_preuve_et_limites":"Essai contrôlé randomisé en conditions réelles (field-based) avec échantillon modéré (N=111, ~55 par groupe), mesures objectives du sommeil par actigraphie et groupe contrôle actif (repos éveillé) ; cependant il s'agit d'un effet à court terme mesuré le jour même, la généralisabilité à d'autres contextes culturels/scolaires et la durabilité des effets sur le long terme ne sont pas précisées dans le résumé.","angle_brana_sana":"Pertinent pour le pilier repos/sommeil : illustre qu'une courte sieste structurée (30 min) en milieu de journée peut être intégrée à un programme de repos pour restaurer vigilance et humeur positive sans nuire au sommeil nocturne — transposable à des temps de pause proposés aux participants des séjours Braña Sana, notamment après une matinée d'activité (bain de forêt, travail manuel).","pertinence_brana_sana":3,"doi":"10.1016/j.sleep.2026.109210","lien":"https://pubmed.ncbi.nlm.nih.gov/42617247/","source":"PubMed","pmid":"42617247","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Causal association between sleep phenotypes and susceptibility to childhood asthma: A two-sample Mendelian randomization study.","auteurs":"Yin Li, Zhang Feifei, Li Fang, Gao Mimi, Liu Anna, Wang Xue","date":"2026 Aug 13","type_etude":"autre","mecanisme_evalue":"Relations causales génétiquement inférées entre phénotypes de sommeil (sieste diurne, troubles du sommeil, chronotype, fatigue) et risque d'asthme infantile, via randomisation mendélienne à deux échantillons","resultat_principal":"La randomisation mendélienne suggère que la susceptibilité génétique à la sieste diurne (OR=1.76), aux troubles du sommeil (OR=1.35) et à la fatigue fréquente (OR=2.94) augmente le risque d'asthme infantile, tandis que le chronotype matinal serait protecteur (OR=0.76).","niveau_de_preuve_et_limites":"Étude de randomisation mendélienne (approche d'inférence causale indirecte, non un essai clinique) basée sur des données GWAS de populations d'ascendance européenne uniquement ; analyses de sensibilité (MR-Egger, MR-PRESSO) ne montrant pas de pléiotropie ou causalité inverse selon les auteurs, mais les résultats dépendent de la validité des instruments génétiques utilisés et restent des associations génétiquement prédites plutôt que des preuves d'effet direct observées cliniquement ; population restreinte à l'ascendance européenne limitant la généralisabilité ; aucune limite liée à la taille d'échantillon ou à l'hétérogénéité méthodologique n'est précisée dans le résumé au-delà de ces points.","angle_brana_sana":"Cette étude porte sur un contexte pédiatrique très spécifique (asthme infantile) via une méthode d'inférence génétique indirecte, sans lien direct avec les pratiques de sieste, repos ou marche proposées à Braña Sana pour des adultes en contexte de bien-être préventif ; un rapprochement serait forcé et non honnête.","pertinence_brana_sana":0,"doi":"10.1111/pai.70446","lien":"https://pubmed.ncbi.nlm.nih.gov/42605205/","source":"PubMed","pmid":"42605205","thematique_id":"sieste-marche","thematique":"Sieste & marche","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Clay Connections: reciprocal ceramic making to support wellbeing, agency and community in contexts of brain change, dementia and mental health.","auteurs":"Wallace J, Briggs P, Kindleysides M, Bowman R, Hoffman K, Hall C, Appleby C, Marston B","date":"2026 Nov 19","type_etude":"autre","mecanisme_evalue":"Bien-être psychologique, sentiment d'agentivité et de communauté via la pratique créative manuelle (poterie réciproque)","resultat_principal":"Un projet qualitatif de 12 semaines de création réciproque de céramique entre personnes vivant avec un changement cérébral/démence et usagers de services de santé mentale suggère que le fait de fabriquer un objet pour autrui (plutôt que de recevoir des soins) favorise un sentiment de bien-être, d'agentivité et de connexion sociale, les participants se percevant comme capables d'apporter du soin à d'autres plutôt que d'être uniquement destinataires de soins.","niveau_de_preuve_et_limites":"Étude qualitative de type recherche par le design (research-through-design) avec un très petit échantillon (12 participants au total, deux groupes de 6), sans groupe contrôle, basée sur des vignettes narratives et des réflexions générales plutôt que sur une analyse statistique ; les résultats ne sont pas généralisables et relèvent d'une exploration de cas plutôt que d'une preuve d'effet causal.","angle_brana_sana":"Illustre comment un atelier manuel structuré autour de la réciprocité (fabriquer quelque chose pour une autre personne, pas seulement pour soi) peut renforcer le sentiment d'utilité, de connexion et de bien-être — un principe transposable à des ateliers d'artisanat ou de poterie à Braña Sana conçus autour de l'échange entre participants plutôt que de la seule pratique individuelle.","pertinence_brana_sana":2,"doi":"10.1177/17579139261506270","lien":"https://pubmed.ncbi.nlm.nih.gov/43055613/","source":"PubMed","pmid":"43055613","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Feasibility and Preliminary Outcomes of Gardening-Based Immersive Virtual Reality Cognitive Training in Older Adults With Dementia: Single-Group Pretest-Posttest Analysis","auteurs":"Chuang I-Ching, Wu Hui-Ju, Wu Yih-Ru, Hsu Jung Lung, Wu Ching-Yi","date":"2026 Nov 17","type_etude":"étude observationnelle","mecanisme_evalue":"Cognition globale et domaines cognitifs spécifiques, acceptation/tolérance de la réalité virtuelle, réponses émotionnelles, et mesures secondaires (activités de vie quotidienne, symptômes dépressifs, symptômes comportementaux et psychologiques de la démence, qualité de vie, bien-être)","resultat_principal":"Chez 15-16 personnes âgées atteintes de démence légère à modérée, un programme de 15 séances de réalité virtuelle immersive basée sur le jardinage s'est montré faisable, acceptable et bien toléré, avec une augmentation significative de l'acceptation de la VR, une diminution du mal des transducteurs simulés, et une amélioration de la cognition globale (MoCA) entre avant et après intervention ; aucune différence significative n'a été observée sur les mesures cognitives spécifiques par domaine, les activités de vie quotidienne, la qualité de vie ou les résultats psychosociaux.","niveau_de_preuve_et_limites":"Étude à groupe unique avec comparaison avant-après (pretest-posttest), sans groupe contrôle pour cette analyse (les données de la période liste d'attente-contrôle de l'essai croisé randomisé en cours n'ont pas été incluses dans ce rapport) ; échantillon très réduit (16 participants recrutés, 15 ayant complété l'intervention) ; recrutement par échantillonnage de convenance basé sur référencement, ce qui limite la généralisabilité ; de multiples comparaisons ont nécessité une correction de Holm-Bonferroni, suggérant un risque de faux positifs sans cette correction ; résultats décrits explicitement comme préliminaires par les auteurs, nécessitant des études contrôlées de plus grande envergure pour confirmation.","doi":"10.2196/98062","lien":"https://pubmed.ncbi.nlm.nih.gov/43044107/","source":"PubMed","pmid":"43044107","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Reconstructing Hope Through Horticultural Therapy: A Phenomenological Study of Individuals with Post-Stroke Depression.","auteurs":"Gong Yuehua, Shen Haijian, Ren Lingli, Zhu Xiaoping","date":"2026 Oct 01","type_etude":"autre","mecanisme_evalue":"Vécu psychologique et expérientiel (auto-efficacité, espoir, connexion sociale, sentiment de valeur) chez des patients en dépression post-AVC participant à une thérapie horticole","resultat_principal":"Dans cette étude phénoménologique descriptive, les participants décrivent la thérapie horticole comme une expérience significative associée au renforcement de l'auto-efficacité, de l'espoir, de la connexion sociale et de l'engagement dans la réadaptation, bien que des pertes de plantes ou limitations physiques aient aussi suscité frustration et sentiment d'impuissance chez certains.","niveau_de_preuve_et_limites":"Étude qualitative phénoménologique à faible effectif (n=15), sans groupe contrôle, basée sur des entretiens semi-structurés analysés selon la méthode de Colaizzi ; les résultats reflètent des expériences vécues rapportées et ne permettent pas d'établir de lien causal ni de généralisation statistique. Population limitée à un programme de 6 mois à Shanghai, ce qui limite la transférabilité culturelle et contextuelle.","angle_brana_sana":"Illustre comment une activité manuelle de jardinage structurée peut favoriser l'auto-efficacité, le sentiment de valeur et la motivation chez des personnes en difficulté psychologique (ici post-AVC) — un éclairage qualitatif pertinent pour penser le pilier potager/travail manuel de Braña Sana comme vecteur de reconstruction du sens et du lien social, tout en anticipant les moments de frustration (perte de plantes, limites physiques) à accompagner.","pertinence_brana_sana":2,"doi":"10.3390/healthcare14193229","lien":"https://pubmed.ncbi.nlm.nih.gov/42881667/","source":"PubMed","pmid":"42881667","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"A culturally tailored Zhuang embroidery intervention for psychological well-being among Zhuang adults in the retirement transition in Guangxi: a waitlist-controlled quasi-experimental study","auteurs":"Li Junfeng, Xiang Junzi","date":"2026-09-17","type_etude":"autre","mecanisme_evalue":"Bien-être psychologique (échelle de Ryff), solitude, connexion sociale, bien-être général (WEMWBS, WHO-5), identité ethnique — dans le cadre d'une pratique artisanale manuelle (broderie) couplée à de la narration culturelle et des échanges de groupe","resultat_principal":"Le groupe ayant suivi l'intervention de broderie Zhuang de 8 semaines a montré une amélioration immédiate plus marquée du bien-être psychologique (Ryff) que le groupe témoin en liste d'attente, mais cet effet s'est atténué au suivi à 12 semaines, et les résultats secondaires (solitude, connexion sociale, bien-être général, identité ethnique) étaient plus faibles ou inconsistants.","niveau_de_preuve_et_limites":"Étude quasi-expérimentale avec allocation par cluster communautaire (non randomisée au niveau individuel), échantillon réduit (n=80), groupe témoin en liste d'attente (pas de contrôle actif). Les auteurs précisent explicitement que l'allocation en cluster et la nature intégrée de l'intervention (broderie + narration culturelle + échanges de groupe) empêchent de distinguer les effets spécifiques de l'artisanat des effets de différences communautaires, d'attentes des participants (effet d'expectation) ou de composantes spécifiques. L'effet sur le critère principal s'atténue au suivi à 12 semaines. Les auteurs appellent à des études plus larges, multi-communautaires, avec séparation des composantes et suivi plus long avant de conclure à une efficacité confirmée.","doi":"10.3389/fpubh.2026.1945265","lien":"https://pubmed.ncbi.nlm.nih.gov/42823976/","source":"PubMed","pmid":"42823976","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Exploring the therapeutic benefits of a community garden and nature-based project designed for people experiencing homelessness: A qualitative study.","auteurs":"van Bekkum Jennifer E, Malden Stephen, McDougall Craig W, Hawkins Katie, Williams Andrew J, Thompson Catharine Ward","date":"2026 Nov 23","type_etude":"étude observationnelle","mecanisme_evalue":"Bien-être psychologique et social perçu (processus thérapeutiques liés au contact avec la nature, au rapport à soi et au lien social) dans le cadre d'un programme de prescription sociale verte","resultat_principal":"Les entretiens qualitatifs avec clients et personnel suggèrent que ce programme de jardin communautaire et d'activités nature, adapté aux personnes en situation de sans-abrisme, est perçu comme bénéfique sur le plan du bien-être, à travers cinq thèmes liés à la nature, au soi individuel et au soi social — il s'agit d'une association de perceptions rapportées, non d'une preuve d'effet mesuré.","niveau_de_preuve_et_limites":"Étude qualitative à très petit échantillon (11 clients, 3 membres du personnel), sans groupe contrôle, basée sur des entretiens semi-structurés et une analyse thématique réflexive ; les résultats reflètent des expériences vécues et perçues, non des mesures quantitatives objectives, et ne sont pas généralisables au-delà de ce contexte spécifique (un centre de soins primaires en Écosse, population en situation de sans-abrisme).","angle_brana_sana":"Bien que le contexte (population en situation de sans-abrisme, prescription sociale verte en milieu médical) diffère largement du public de Braña Sana, l'étude confirme qualitativement que le travail manuel au jardin et le contact avec la nature peuvent soutenir le bien-être individuel et le lien social — un principe transposable, avec prudence, à la conception des ateliers potager/manuel du centre, à condition d'adapter l'activité aux capacités et au rythme de chaque participant.","pertinence_brana_sana":2,"doi":"10.1016/j.socscimed.2026.119873","lien":"https://pubmed.ncbi.nlm.nih.gov/42800188/","source":"PubMed","pmid":"42800188","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Improving Pain management for children and young people attended by Ambulance (PANDA): protocol for a realist evaluation and consensus workshops.","auteurs":"Whitley Gregory Adam, Nicholls Georgie, Baliousis Michael, Bujor Tatiana, Hodgson Jessica, Leighton Paul, Lord Bill, Redsell Sarah, Sumera Kacper, Siriwardena Aloysius Niroshan","date":"2025-08-13","type_etude":"autre","mecanisme_evalue":"Gestion de la douleur aiguë préhospitalière chez les enfants et jeunes transportés par ambulance (processus de soins, pas un mécanisme physiologique)","resultat_principal":"Ce protocole décrit une évaluation réaliste (entretiens, journaux, données cliniques) et des ateliers de consensus visant à comprendre pourquoi la gestion de la douleur des enfants en ambulance est souvent insuffisante, et à prioriser des composantes d'intervention futures ; aucun résultat d'efficacité n'est encore rapporté puisqu'il s'agit d'un protocole d'étude.","niveau_de_preuve_et_limites":"Il s'agit d'un protocole d'étude (pas de résultats), décrivant une méthodologie qualitative (étude de cas multiples, théorie du programme) combinée à des données cliniques de routine et des ateliers de consensus par technique de groupe nominal modifiée. Aucune limite méthodologique propre aux résultats n'est mentionnée puisque l'étude n'a pas encore produit de données ; non précisé dans le résumé concernant d'éventuels biais de recrutement ou de représentativité.","angle_brana_sana":"Aucun lien concret avec le retour au manuel (mains, artisanat, potager) : cette étude porte sur la gestion de la douleur aiguë pédiatrique en contexte d'urgence préhospitalière, un domaine médical d'urgence sans rapport avec les ateliers manuels, l'artisanat ou le jardinage proposés par Braña Sana.","pertinence_brana_sana":0,"doi":"10.3310/nihropenres.14025.3","lien":"https://pubmed.ncbi.nlm.nih.gov/42728929/","source":"PubMed","pmid":"42728929","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Nature-based interventions for people living with dementia and their carers: a scoping review.","auteurs":"Gill Manpreet K, Thekkan Shareefa, Irwin Danine","date":"2026-08-24","type_etude":"revue systématique","mecanisme_evalue":"Bien-être psychosocial, participation sociale, engagement significatif et identité chez les personnes vivant avec une démence et leurs aidants, via l'exposition à la nature et les activités horticoles/jardinage","resultat_principal":"Sur 108 études analysées, l'engagement avec la nature (jardins thérapeutiques, horticulture, fermes de soins vertes, exposition à la nature) est associé de manière consistante à des bénéfices en termes de bien-être, de participation sociale et d'activité significative pour les personnes vivant avec une démence et leurs aidants, sans qu'une relation causale ne soit établie.","niveau_de_preuve_et_limites":"Revue de portée (scoping review) suivant le cadre Arksey et O'Malley et les guidelines PRISMA-ScR, basée sur une synthèse narrative de 108 études hétérogènes en termes de type d'intervention, de contexte et de mesures de résultats. Les auteurs signalent eux-mêmes que la base de preuves reste inégalement développée, avec des lacunes importantes concernant l'implémentation, les espaces bleus, les approches technologiques et les populations sous-représentées. Aucune évaluation de la qualité méthodologique des études individuelles n'est mentionnée, ce qui limite la portée causale des conclusions.","angle_brana_sana":"Les thèmes identifiés (jardins thérapeutiques, interventions horticoles, exposition à la nature) renforcent la pertinence d'un espace potager/jardin accessible et d'activités manuelles de jardinage comme vecteurs de bien-être, de participation sociale et de maintien d'identité — applicable notamment à des publics vulnérables ou âgés accueillis à Braña Sana, en insistant sur l'accessibilité et la continuité de participation dans la vie quotidienne plutôt que sur un effet thérapeutique ciblé sur la démence elle-même.","pertinence_brana_sana":3,"doi":"10.3389/frdem.2026.1818223","lien":"https://pubmed.ncbi.nlm.nih.gov/42707993/","source":"PubMed","pmid":"42707993","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Comparison of online versus in-person education of lumbopelvic manipulation: a mixed methods study","auteurs":"Chapple Cathy M, Farrell Gerard, Karas Steve, Keen Donna, Kovanur Sampath Kesava","date":"2026 Dec 06","type_etude":"RCT","mecanisme_evalue":"Apprentissage d'une compétence manuelle (manipulation lombopelvienne) et confiance en soi associée, comparaison entre enseignement en ligne et en présentiel","resultat_principal":"La confiance en soi des étudiants en physiothérapie a augmenté après les deux formats d'enseignement, avec une augmentation plus marquée lorsque la séance en présentiel suivait la séance en ligne ; les étudiants ont exprimé une préférence qualitative pour l'apprentissage en présentiel en raison du feedback personnalisé, des échanges et de la pratique guidée, tout en valorisant les ressources en ligne comme compléments utiles (notamment les vidéos rejouables) mais insuffisantes seules.","niveau_de_preuve_et_limites":"Échantillon très réduit (25 étudiants pour les données quantitatives, 21 pour les focus groups), population spécifique (étudiants en physiothérapie) limitant la généralisabilité, design croisé randomisé mais mesures auto-rapportées de confiance (subjectives) sans évaluation objective indépendante de la compétence manuelle réelle ni de rétention à long terme ; non précisé dans le résumé si un groupe contrôle sans aucune formation a été inclus.","angle_brana_sana":"Cette étude porte sur l'enseignement de gestes manuels thérapeutiques en contexte clinique (manipulation physiothérapeutique), ce qui diffère substantiellement de l'apprentissage de gestes artisanaux ou de jardinage visés par le pilier \"retour au manuel\" de Braña Sana ; le mécanisme (confiance motrice, importance du présentiel et du feedback humain pour les compétences manuelles complexes) pourrait néanmoins inspirer une réflexion générale sur la pédagogie des ateliers manuels en présentiel, mais le lien direct reste ténu et ne doit pas être surinterprété.","pertinence_brana_sana":1,"doi":"10.1080/10669817.2026.2723977","lien":"https://pubmed.ncbi.nlm.nih.gov/42702844/","source":"PubMed","pmid":"42702844","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Patient-reported knee osteoarthritis problems and rehabilitation goals: A qualitative study.","auteurs":"Haber Travis, Ahler Jonas R, Campbell Penny K, Bennell Kim L, Bhuller Rhenu, Hinman Rana S","date":"2026-09-02","type_etude":"étude observationnelle","mecanisme_evalue":"Perception subjective des symptômes et des objectifs de réhabilitation chez des patients atteints d'arthrose du genou (douleur, limitations d'activité, restrictions de participation selon le cadre CIF)","resultat_principal":"Les participants atteints d'arthrose du genou rapportent des problèmes très variés (douleur, sommeil, marche, escaliers, activités comme le jardinage ou le temps en famille) et des objectifs de réadaptation à 3 mois centrés principalement sur la marche, l'activité physique, les activités de la vie quotidienne et le bien-être général, sans qu'une preuve d'effet d'une intervention ne soit établie — il s'agit d'une analyse qualitative descriptive des priorités perçues par les patients.","niveau_de_preuve_et_limites":"Étude qualitative avec analyse de contenu sur données issues de réponses ouvertes pré-consultation de 387 participants d'un essai contrôlé randomisé comparant physiothérapie en présentiel et télésanté ; il s'agit d'une analyse secondaire descriptive sans groupe contrôle pour cette question spécifique, basée sur des réponses textuelles courtes et auto-rapportées, ce qui limite la profondeur de l'analyse qualitative habituelle (pas d'entretiens approfondis) ; l'hétérogénéité des objectifs rapportés est elle-même soulignée par les auteurs comme un résultat clé plutôt qu'une limite méthodologique classique.","doi":"10.1016/j.bjpt.2026.101624","lien":"https://pubmed.ncbi.nlm.nih.gov/42685385/","source":"PubMed","pmid":"42685385","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Does Handicraft Provide Better Mental Health?","auteurs":"Sundbeck Mats","date":"2026 Aug 21","type_etude":"étude observationnelle","mecanisme_evalue":"Santé mentale (anxiété, inquiétude, tension, stress) en lien avec la pratique de l'artisanat manuel (handicraft)","resultat_principal":"Une fréquence élevée et une longue expérience de pratique artisanale sont associées à une meilleure santé mentale rapportée (moins d'anxiété, d'inquiétude, de tension et de stress), mais d'autres facteurs (âge, sécurité financière, occupation, activités quotidiennes) apparaissent comme plus déterminants que l'artisanat lui-même.","niveau_de_preuve_et_limites":"Étude transversale par questionnaire en ligne sur un échantillon de convenance de 6 756 femmes suédoises se définissant comme pratiquantes d'artisanat ; le caractère transversal et l'échantillon de convenance ne permettent pas d'établir de lien causal, seulement une association ; population limitée aux femmes suédoises, limitant la généralisabilité ; les auteurs soulignent eux-mêmes que d'autres facteurs de fond (âge, situation financière, occupation) pèsent davantage que la pratique artisanale sur la santé mentale.","angle_brana_sana":"Pertinent pour l'atelier manuel/artisanat de Braña Sana : les résultats suggèrent qu'un engagement régulier et prolongé dans une pratique manuelle (tissage, poterie, travail du bois, etc.) peut s'associer à un mieux-être perçu, ce qui conforte l'intérêt de proposer des ateliers réguliers plutôt que ponctuels — à présenter toutefois comme une association et non une preuve d'effet thérapeutique.","pertinence_brana_sana":3,"doi":"10.1080/01612840.2026.2705389","lien":"https://pubmed.ncbi.nlm.nih.gov/42627736/","source":"PubMed","pmid":"42627736","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"},{"titre":"Alleviating academic stress and enhancing interdisciplinary self-efficacy in university libraries: an exploratory mixed-methods study on restorative built-environment interventions.","auteurs":"Chen Yu, Chen Kai, Lyu Yanxia, Qian Ruicheng","date":"2026-07-30","type_etude":"étude observationnelle","mecanisme_evalue":"Stress académique, rumination cognitive, fonctionnement du Default Mode Network (DMN), self-efficacy interdisciplinaire, via interventions sensori-motrices et artisanales (découplage cognitif)","resultat_principal":"Une intervention combinant espaces biophiliques calmes et activités dynamiques (artisanat incarné, check-ins physiques) est associée à une augmentation significative du temps de lecture focalisée continue (228,49 ± 75,58 min vs 86,80 ± 95,56 min, p<0,001) et à l'émergence de deux facteurs de \"capacité liquide\" (cognitive et sociale) mesurés par un questionnaire auto-développé, suggérant un mécanisme de \"découpage sensori-moteur\" interrompant les boucles de rumination liées au DMN — association observée, non une démonstration causale stricte.","niveau_de_preuve_et_limites":"Étude exploratoire mixte (quantitatif + qualitatif), design séquentiel non randomisé avec comparaison pré-test/post-test plutôt qu'un essai contrôlé randomisé ; échantillon final restreint (N=122 sur 871 inscrits) issu d'une population volontaire, avec un biais de sélection volontaire explicitement quantifié par les auteurs (~23-25% d'inflation des effets naïfs, nécessitant correction par double machine learning/DML) ; l'un des deux facteurs du questionnaire (LCI-Cognitive, α=0.724) présente une fiabilité seulement modérée ; le questionnaire est auto-développé et non validé antérieurement ; contexte limité à une seule bibliothèque universitaire chinoise, ce qui limite la généralisabilité ; les mécanismes neurocognitifs (DMN, découplage) sont inférés via analyse thématique qualitative et non mesurés directement (pas de neuro-imagerie).","doi":"10.3389/fpsyg.2026.1904029","lien":"https://pubmed.ncbi.nlm.nih.gov/42597472/","source":"PubMed","pmid":"42597472","thematique_id":"manuel","thematique":"Retour au manuel (mains, artisanat, potager)","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-19"}]</script>
<script id="theme-meta" type="application/json">{"shinrin-yoku":{"label":"Bain de forêt / shinrin-yoku","color":{"light":"#2a78d6","dark":"#3987e5"}},"sommeil":{"label":"Repos / sommeil","color":{"light":"#eb6834","dark":"#d95926"}},"sieste-marche":{"label":"Sieste & marche","color":{"light":"#1baf7a","dark":"#199e70"}},"manuel":{"label":"Retour au manuel (mains, artisanat, potager)","color":{"light":"#eda100","dark":"#c98500"}},"_non-classe":{"label":"Non classé","color":{"light":"#898781","dark":"#898781"}}}</script>
<script>
(function () {
  const fiches = JSON.parse(document.getElementById('fiches-data').textContent);
  const themeMeta = JSON.parse(document.getElementById('theme-meta').textContent);

  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

  function themeColor(id) {
    const meta = themeMeta[id] || themeMeta['_non-classe'];
    return isDark() ? meta.color.dark : meta.color.light;
  }

  // --- thème clair/sombre ---
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    render();
  });

  // --- dates de run disponibles (plus récent en premier) ---
  const runDates = [...new Set(fiches.map((f) => f.ajoute_le).filter(Boolean))].sort().reverse();
  const runSelect = document.getElementById('runSelect');
  const allOption = document.createElement('option');
  allOption.value = '__all__';
  allOption.textContent = 'Toute la base (' + fiches.length + ' fiches)';
  runSelect.appendChild(allOption);
  runDates.forEach((d) => {
    const opt = document.createElement('option');
    opt.value = d;
    const n = fiches.filter((f) => f.ajoute_le === d).length;
    opt.textContent = d + ' (' + n + ' nouvelle' + (n > 1 ? 's' : '') + ')';
    runSelect.appendChild(opt);
  });
  if (runDates.length) runSelect.value = runDates[0];

  // --- filtre types d'étude ---
  const typeSelect = document.getElementById('typeSelect');
  [...new Set(fiches.map((f) => f.type_etude).filter(Boolean))].sort().forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  });

  // --- état des filtres ---
  const state = { themes: new Set(), search: '', type: '', onlyAngle: false };
  const expanded = new Set();

  const themeChipsEl = document.getElementById('themeChips');
  const searchEl = document.getElementById('search');
  const onlyAngleEl = document.getElementById('onlyAngle');
  const listEl = document.getElementById('list');
  const countLineEl = document.getElementById('countLine');

  runSelect.addEventListener('change', render);
  typeSelect.addEventListener('change', () => { state.type = typeSelect.value; render(); });
  searchEl.addEventListener('input', () => { state.search = searchEl.value.trim().toLowerCase(); render(); });
  onlyAngleEl.addEventListener('change', () => { state.onlyAngle = onlyAngleEl.checked; render(); });
  document.getElementById('expandAll').addEventListener('click', () => {
    currentVisible().forEach((f) => expanded.add(f._key));
    render();
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    expanded.clear();
    render();
  });

  fiches.forEach((f, i) => { f._key = (f.doi || f.titre || '') + '::' + i; });

  function currentRunFiches() {
    const val = runSelect.value;
    if (val === '__all__') return fiches;
    return fiches.filter((f) => f.ajoute_le === val);
  }

  function currentVisible() {
    let list = currentRunFiches();
    if (state.themes.size) list = list.filter((f) => state.themes.has(f.thematique_id));
    if (state.type) list = list.filter((f) => f.type_etude === state.type);
    if (state.onlyAngle) list = list.filter((f) => (f.angle_brana_sana || '').trim().length > 0);
    if (state.search) {
      const q = state.search;
      list = list.filter((f) =>
        (f.titre || '').toLowerCase().includes(q) ||
        (f.auteurs || '').toLowerCase().includes(q) ||
        (f.resultat_principal || '').toLowerCase().includes(q) ||
        (f.mecanisme_evalue || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function renderChips() {
    const runFiches = currentRunFiches();
    const counts = {};
    runFiches.forEach((f) => { counts[f.thematique_id] = (counts[f.thematique_id] || 0) + 1; });
    themeChipsEl.innerHTML = '';
    Object.keys(themeMeta).forEach((id) => {
      const n = counts[id] || 0;
      if (n === 0 && !state.themes.has(id)) return;
      const chip = document.createElement('div');
      chip.className = 'chip' + (state.themes.has(id) ? ' active' : '');
      chip.innerHTML = '<span class="dot" style="background:' + themeColor(id) + '"></span>' +
        themeMeta[id].label + ' <span class="count">' + n + '</span>';
      chip.addEventListener('click', () => {
        if (state.themes.has(id)) state.themes.delete(id); else state.themes.add(id);
        render();
      });
      themeChipsEl.appendChild(chip);
    });
  }

  function fmtDate(d) {
    return d || '—';
  }

  function renderList() {
    const visible = currentVisible();
    countLineEl.textContent = visible.length + ' fiche' + (visible.length > 1 ? 's' : '') +
      (state.themes.size || state.type || state.onlyAngle || state.search ? ' (filtrées)' : '');
    listEl.innerHTML = '';
    if (!visible.length) {
      listEl.innerHTML = '<div class="empty">Aucune fiche ne correspond à ces filtres.</div>';
      return;
    }
    const byTheme = {};
    visible.forEach((f) => {
      (byTheme[f.thematique_id] = byTheme[f.thematique_id] || []).push(f);
    });
    Object.keys(byTheme)
      .sort((a, b) => (themeMeta[a]?.label || '').localeCompare(themeMeta[b]?.label || ''))
      .forEach((id) => {
        const section = document.createElement('div');
        section.className = 'section-title';
        section.textContent = (themeMeta[id]?.label || id) + ' — ' + byTheme[id].length;
        listEl.appendChild(section);
        // Les fiches avec un angle Braña Sana concret remontent en tête, triées par
        // pertinence décroissante — pour repérer vite ce qui compte parmi 60+ articles.
        byTheme[id]
          .slice()
          .sort((a, b) => (b.pertinence_brana_sana || 0) - (a.pertinence_brana_sana || 0))
          .forEach((f) => listEl.appendChild(renderCard(f, id)));
      });
  }

  function renderCard(f, themeId) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--card-color', themeColor(themeId));
    const open = expanded.has(f._key);

    const head = document.createElement('div');
    head.className = 'card-head';
    const pertinence = f.angle_brana_sana ? (f.pertinence_brana_sana || 0) : null;
    head.innerHTML =
      '<p class="card-title">' + escapeHtml(f.titre) + '</p>' +
      (pertinence ? '<span class="badge badge-pertinence">pertinence ' + pertinence + '/5</span>' : '') +
      '<span class="badge">' + escapeHtml(f.type_etude || '?') + '</span>';
    card.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'meta-line';
    meta.textContent = [f.auteurs, f.date, f.ajoute_le ? 'ajouté le ' + f.ajoute_le : null]
      .filter(Boolean).join(' · ');
    card.appendChild(meta);

    if (!open) {
      const snippet = document.createElement('div');
      snippet.className = 'snippet';
      snippet.textContent = f.resultat_principal || '';
      card.appendChild(snippet);
    } else {
      const details = document.createElement('dl');
      details.className = 'details open';
      const rows = [
        ['Mécanisme évalué', f.mecanisme_evalue],
        ['Résultat principal', f.resultat_principal],
        ['Niveau de preuve et limites', f.niveau_de_preuve_et_limites],
        ['Angle Braña Sana', f.angle_brana_sana || '(aucun angle retenu)'],
      ];
      rows.forEach(([label, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        dd.textContent = value || '—';
        details.appendChild(dt);
        details.appendChild(dd);
      });
      if (f.lien) {
        const dt = document.createElement('dt');
        dt.textContent = 'Source';
        const dd = document.createElement('dd');
        const a = document.createElement('a');
        a.href = f.lien;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = f.lien;
        dd.appendChild(a);
        details.appendChild(dt);
        details.appendChild(dd);
      }
      card.appendChild(details);
    }

    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      if (expanded.has(f._key)) expanded.delete(f._key); else expanded.add(f._key);
      render();
    });
    return card;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function render() {
    renderChips();
    renderList();
  }

  render();
})();
</script>
</body>
</html>
