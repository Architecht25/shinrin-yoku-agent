<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille La Borbolla — tableau de bord</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 16px 12px;
    max-width: 980px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 16px; }
  .theme-toggle {
    position: absolute; top: 16px; right: 16px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; color: var(--text-primary);
    font-size: 0.8rem; cursor: pointer;
  }
  .controls {
    max-width: 980px; margin: 0 auto; padding: 0 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type="text"] {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 0.85rem;
  }
  input[type="text"] { flex: 1; min-width: 200px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 11px; font-size: 0.78rem; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
    user-select: none;
  }
  .chip.active { color: var(--text-primary); font-weight: 600; border-color: currentColor; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip .count { color: var(--text-muted); }
  .chip.active .count { color: inherit; }
  label.checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); }
  .buttons { display: flex; gap: 8px; margin-left: auto; }
  button.plain {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer;
  }
  main { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  .count-line { color: var(--text-secondary); font-size: 0.85rem; margin: 6px 0 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 4px solid var(--card-color, var(--gridline));
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer;
  }
  .card-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .card-title { font-size: 0.95rem; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 200px; }
  .badge {
    font-size: 0.7rem; padding: 2px 7px; border-radius: 999px;
    background: var(--gridline); color: var(--text-secondary); white-space: nowrap;
  }
  .badge-pertinence {
    background: rgba(12,163,12,0.16); color: #0ca30c; font-weight: 600;
  }
  .badge-retractation { background: rgba(208,59,59,0.16); color: #d03b3b; font-weight: 700; }
  .meta-line { color: var(--text-secondary); font-size: 0.78rem; margin-top: 4px; }
  .snippet { color: var(--text-secondary); font-size: 0.85rem; margin-top: 6px; }
  .details { display: none; margin-top: 10px; border-top: 1px solid var(--gridline); padding-top: 10px; font-size: 0.85rem; }
  .details.open { display: block; }
  .details dt { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; margin-top: 8px; }
  .details dd { margin: 2px 0 0; color: var(--text-primary); }
  .details a { color: var(--card-color, #2a78d6); }
  .empty { color: var(--text-muted); text-align: center; padding: 40px 0; }
  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 20px 0 8px; }
</style>
</head>
<body>
<header style="position: relative;">
  <button class="theme-toggle" id="themeToggle">🌓 thème</button>
  <h1>Veille scientifique — La Borbolla</h1>
  <p class="subtitle">Tableau de bord de tri des fiches extraites depuis PubMed.</p>
</header>
<div class="controls">
  <div class="row">
    <select id="runSelect"></select>
    <input type="text" id="search" placeholder="Rechercher (titre, auteurs, résultat…)">
    <div class="buttons">
      <button class="plain" id="expandAll">Tout déplier</button>
      <button class="plain" id="collapseAll">Tout replier</button>
    </div>
  </div>
  <div class="row" id="themeChips"></div>
  <div class="row">
    <select id="typeSelect"><option value="">Tous types d'étude</option></select>
    <label class="checkbox"><input type="checkbox" id="onlyAngle"> avec angle Braña Sana renseigné</label>
  </div>
</div>
<main>
  <div class="count-line" id="countLine"></div>
  <div id="list"></div>
</main>
<script id="fiches-data" type="application/json">[{"titre":"Evaluating Emotional Perception and Human Comfort in Urban Green Spaces Through Tree Diversity: A GIS and Survey-Based Approach.","auteurs":"Cheng Chen","date":"2026 Nov 20","mecanisme_evalue":"Perception émotionnelle et confort humain en lien avec la diversité arborée et les caractéristiques écologiques des espaces verts urbains","resultat_principal":"La diversité arborée perçue est associée à un meilleur confort émotionnel, tandis que la diversité arborée objective (indice de Shannon) ne montre pas d'association significative avec les réponses émotionnelles.","niveau_de_preuve_et_limites":"Étude observationnelle basée sur une enquête en ligne auprès de 302 participants à Karlsruhe (Allemagne), combinée à des données spatiales ; les associations rapportées sont corrélationnelles (coefficient tau, p-valeurs) et ne permettent pas d'établir de lien causal ; aucune mention de groupe contrôle ni de limites méthodologiques détaillées dans le résumé.","angle_brana_sana":"Les résultats suggèrent que la perception subjective de richesse et de diversité végétale (plutôt que la diversité objective) influence le confort ressenti, ce qui peut orienter l'aménagement des sentiers et jardins du centre pour favoriser une impression de biodiversité et de nature mature, propice au bien-être des visiteurs.","pertinence_centre":3,"type_etude":"étude observationnelle","doi":"10.3791/71726","lien":"https://pubmed.ncbi.nlm.nih.gov/43102330/","source":"PubMed","niveau_de_preuve":"observationnelle","pmid":"43102330","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","justification_niveau":"Il s'agit d'une étude par enquête transversale mesurant des associations statistiques entre perception et confort, sans manipulation expérimentale ni groupe contrôle, ce qui correspond à un niveau observationnel.","effectif":302,"verification":{"statut":"confirmé","raison":"","journal":"une"},"confiance_extraction":"vérifié"},{"titre":"[The effect of forest bathing on the mental wellbeing of children and adolescents: a scoping review].","auteurs":"De Roy A, Glazemakers I, van West D","date":"2026","mecanisme_evalue":"bien-être mental (symptômes dépressifs, stress, agitation, émotions négatives, relaxation, confiance en soi, connexion à la nature) via la théorie de la restauration de l'attention","resultat_principal":"Les études incluses rapportent de façon cohérente des effets à court terme du bain de forêt sur le bien-être mental des enfants et adolescents (réduction des symptômes dépressifs, du stress, de l'agitation et des émotions négatives ; augmentation de la relaxation, de la confiance en soi et de la connexion à la nature).","niveau_de_preuve_et_limites":"Revue de portée incluant 12 études, analyse thématique ; les auteurs précisent que les preuves actuelles restent limitées, que le concept de bain de forêt nécessite d'être mieux délimité, que les interventions varient largement en durée, activités et contexte, et qu'une recherche plus robuste est nécessaire.","angle_brana_sana":"Les activités de bain de forêt proposées par le centre pourraient intégrer des publics jeunes (enfants/adolescents) dans une logique préventive de bien-être mental, en s'inspirant des éléments récurrents identifiés (durée, activités, cadre naturel favorisant la restauration attentionnelle).","pertinence_centre":4,"type_etude":"revue de portée","doi":null,"lien":"https://pubmed.ncbi.nlm.nih.gov/43101929/","source":"PubMed","niveau_de_preuve":"synthèse d'études","pmid":"43101929","thematique_id":"shinrin-yoku","thematique":"Bain de forêt / shinrin-yoku","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","justification_niveau":"Publication Type PubMed : Scoping Review.","effectif":12,"verification":{"statut":"confirmé","raison":"","journal":"une"},"confiance_extraction":"vérifié"},{"titre":"Chronotypes in adult patients with bipolar disorder: unraveling the impact of ADHD comorbidity.","auteurs":"Tuna Turkoglu Meltem, Sair Yasan Bilge, Sevincok Levent","date":"2026 Nov 27","mecanisme_evalue":"Chronotype (rythme circadien) évalué via le Morningness-Eveningness Questionnaire (MEQ)","resultat_principal":"Chez des patients bipolaires euthymiques, la présence d'un TDAH comorbide est associée à un score MEQ plus bas (tendance au type « du soir »), et la sévérité des symptômes dépressifs, le score Wender-Utah et la durée du trouble bipolaire sont associés au score MEQ après correction FDR.","niveau_de_preuve_et_limites":"Étude transversale avec échantillon réduit (70 patients dont seulement 23 avec TDAH comorbide), ce qui limite la puissance statistique ; nature transversale ne permettant pas d'établir de causalité ; les auteurs mentionnent une correction FDR pour limiter les faux positifs mais pas d'autres limites méthodologiques explicites (ex. absence de groupe contrôle sain, pas de mesure objective du rythme circadien comme actigraphie).","angle_brana_sana":"Sensibilisation à l'importance d'adapter les rythmes de repos (horaires de sieste, coucher/lever) selon le chronotype individuel des visiteurs, notamment pour les publics ayant des troubles de l'humeur ou de l'attention, dans le cadre des programmes de repos et sommeil.","pertinence_centre":2,"type_etude":"étude observationnelle","doi":"10.1080/13651501.2026.2768536","lien":"https://pubmed.ncbi.nlm.nih.gov/43101965/","source":"PubMed","niveau_de_preuve":"observationnelle","pmid":"43101965","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","justification_niveau":"Il s'agit d'une étude transversale basée sur des corrélations et une régression, sans intervention ni suivi longitudinal, donc de niveau observationnel.","effectif":70,"verification":{"statut":"confirmé","raison":"","journal":"une"},"confiance_extraction":"vérifié"},{"titre":"Sleep quality, social jet lag, and cardiovascular risk factors in young adults.","auteurs":"Teles Sabrina Amabili Marinho, Barbosa Brena Barreto, Teixeira Lucas Ponte, Sampaio Helena Alves de Carvalho, Freire Walter Breno de Souza, Adriano Lia Silveira, Carioca Antônio Augusto Ferreira","date":"2026","mecanisme_evalue":"Qualité du sommeil, chronotype, décalage horaire social (social jet lag) et leurs liens avec des marqueurs cardiométaboliques (tour de taille, IMC, consommation alimentaire)","resultat_principal":"Chez des étudiants en nutrition, une mauvaise qualité de sommeil et un chronotype tardif sont associés à une consommation plus élevée d'aliments ultra-transformés ; le tour de taille est corrélé positivement à une moins bonne qualité de sommeil et à une durée de sommeil plus courte, et l'IMC est associé positivement à une durée de sommeil plus courte.","niveau_de_preuve_et_limites":"Étude transversale observationnelle sur 243 étudiants en nutrition d'institutions publiques et privées de Fortaleza (Brésil) ; les analyses reposent sur des corrélations et une régression linéaire multiple ajustée, ce qui ne permet pas d'établir de causalité ; le résumé ne précise pas d'autres limites méthodologiques (pas de mention explicite de biais de sélection, d'auto-déclaration ou de représentativité au-delà de la population étudiée). [Vérification automatique : à corriger, relire à la source avant tout usage.]","angle_brana_sana":"Les résultats renforcent l'importance de programmes combinant hygiène du sommeil et alimentation équilibrée (moins d'aliments transformés), en cohérence avec les séjours de repos et de reconnexion aux rythmes naturels proposés par le centre, pour un public jeune adulte sensibilisé à la prévention cardiométabolique.","pertinence_centre":3,"type_etude":"étude observationnelle","doi":"10.3389/fpubh.2026.2002110","lien":"https://pubmed.ncbi.nlm.nih.gov/43101264/","source":"PubMed","niveau_de_preuve":"observationnelle","pmid":"43101264","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","justification_niveau":"Publication Type PubMed : Observational Study.","effectif":243,"verification":{"statut":"à corriger","raison":"Le résultat principal contient une erreur factuelle : le résumé indique que l'IMC est associé à une durée de sommeil plus courte, non au tour de taille ni à une « qualité de sommeil » combinée comme présenté ; de plus la fiche omet la corrélation entre tour de taille et durée de sommeil courte mentionnée séparément dans le résumé. Le reste (type d'étude, niveau de preuve, limites) est globalement fidèle.","journal":"bref"},"confiance_extraction":"à confirmer"},{"titre":"Thin illusion: a cross-sectional study on normal weight obesity among adults in a subdivision of Northern Haryana.","auteurs":"Dalal Monu, Kumar Neeraj, Prabhakar Vikrant, Singh Parmal, Kaushik Rajan, Dalal Sapna, Jit Satpinder, Sharma Vijay Vivek","date":"2026","mecanisme_evalue":"Composition corporelle (masse grasse), hygiène de sommeil et facteurs métaboliques associés à l'obésité à poids normal (NWO)","resultat_principal":"Dans cet échantillon, 24,6% des adultes avec un IMC normal présentaient une obésité à poids normal (excès de masse grasse), et cette condition était associée entre autres à un mauvais sommeil (latence d'endormissement prolongée et durée de sommeil courte), à l'âge, au sexe féminin, au statut marital et à une activité physique/alimentation moins favorables.","niveau_de_preuve_et_limites":"Étude transversale (cross-sectional) sur 460 adultes, basée sur des associations statistiques (χ2, régression logistique multivariée) sans possibilité d'établir de causalité ; les données de sommeil et de mode de vie proviennent d'un questionnaire auto-rapporté, et le résumé ne précise pas d'autres limites méthodologiques (biais de rappel, représentativité au-delà de la zone étudiée, etc. non mentionnés). [Vérification automatique : à corriger, relire à la source avant tout usage.]","angle_brana_sana":"Le lien entre mauvaise hygiène de sommeil (latence d'endormissement longue, durée courte) et risque métabolique caché peut nourrir une réflexion sur les programmes de repos/sommeil du centre comme levier de prévention santé globale, au-delà de la seule gestion du poids.","pertinence_centre":2,"type_etude":"étude observationnelle","doi":"10.1136/bmjnph-2025-001385","lien":"https://pubmed.ncbi.nlm.nih.gov/43101137/","source":"PubMed","niveau_de_preuve":"observationnelle","pmid":"43101137","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","justification_niveau":"Il s'agit d'une étude transversale basée sur des associations statistiques (χ2 et régression logistique) sans groupe contrôle ni suivi longitudinal, ce qui correspond à un niveau de preuve observationnel.","effectif":460,"verification":{"statut":"à corriger","raison":"Le type d'étude est correct (observationnelle transversale) mais le niveau de preuve « indéterminé » est injustifié : le résumé décrit clairement une étude observationnelle transversale, ce qui permet de classer le niveau de preuve comme « observationnelle » avec justification claire. La justification actuelle invoque des « métadonnées PubMed non concluantes » alors que le résumé fournit toutes les informations nécessaires.","journal":"bref"},"confiance_extraction":"à confirmer"},{"titre":"Sleep Irregularity and Risk of Incident Hypertension in the UK Biobank.","auteurs":"Potts Kaitlin S, Kianersi Sina, Faquih Tariq, Noordam Raymond, Rutter Martin K, Sofer Tamar, Cain Sean, Windred Daniel, Burns Angus C, Phillips Andrew J K, Redline Susan, Wang Heming, Huang Tianyi","date":"2026 Nov 15","mecanisme_evalue":"Régularité du sommeil (durée et index de régularité du sommeil, SRI) et risque d'hypertension incidente","resultat_principal":"Une irrégularité du sommeil plus marquée (SD de durée de sommeil \u003e90 min, ou quintile le plus bas de SRI) est associée à un risque plus élevé d'hypertension incidente (HR 1,18 et 1,40 respectivement) par rapport aux personnes ayant un sommeil plus régulier.","niveau_de_preuve_et_limites":"Étude de cohorte prospective observationnelle (UK Biobank, n=55 572), ajustée sur de nombreux facteurs démographiques, socioéconomiques et liés au mode de vie, mais ne permettant pas d'établir de lien causal entre irrégularité du sommeil et hypertension. [Vérification automatique : à corriger, relire à la source avant tout usage.]","angle_brana_sana":"Les programmes de repos et de sommeil du centre peuvent intégrer une sensibilisation à la régularité des horaires de sommeil (et non uniquement sa durée) comme facteur potentiellement protecteur pour la santé cardiovasculaire.","pertinence_centre":4,"type_etude":"étude observationnelle","doi":"10.64898/2026.11.12.26367978","lien":"https://pubmed.ncbi.nlm.nih.gov/43060184/","source":"PubMed","niveau_de_preuve":"observationnelle","prepublication":true,"pmid":"43060184","thematique_id":"sommeil","thematique":"Repos / sommeil","origine_recherche":"mot-clé","chercheur_reference":null,"ajoute_le":"2026-11-27","justification_niveau":"Il s'agit d'une étude de cohorte prospective mesurant une association statistique ajustée entre irrégularité du sommeil et risque d'hypertension incidente, sans établir de causalité.","effectif":55572,"verification":{"statut":"à corriger","raison":"La fiche affirme à tort que l'étude est une prépublication non relue par des pairs alors que le résumé ne le précise pas (seul le type PubMed \"Preprint\" l'indique, mais rien dans le résumé ne confirme l'absence de relecture par les pairs, et ceci relève d'une inférence non fondée sur le résumé lui-même). L'angle d'application emploie le terme \"protecteur\" qui suggère une causalité non établie par cette étude observationnelle.","journal":"bref"},"confiance_extraction":"à confirmer"}]</script>
<script id="theme-meta" type="application/json">{"shinrin-yoku":{"label":"Bain de forêt / shinrin-yoku","color":{"light":"#2a78d6","dark":"#3987e5"}},"sommeil":{"label":"Repos / sommeil","color":{"light":"#eb6834","dark":"#d95926"}},"sieste-marche":{"label":"Sieste \u0026 marche","color":{"light":"#1baf7a","dark":"#199e70"}},"manuel":{"label":"Retour au manuel (mains, artisanat, potager)","color":{"light":"#eda100","dark":"#c98500"}},"_non-classe":{"label":"Non classé","color":{"light":"#898781","dark":"#898781"}}}</script>
<script>
(function () {
  const fiches = JSON.parse(document.getElementById('fiches-data').textContent);
  const themeMeta = JSON.parse(document.getElementById('theme-meta').textContent);

  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

  function themeColor(id) {
    const meta = themeMeta[id] || themeMeta['_non-classe'];
    return isDark() ? meta.color.dark : meta.color.light;
  }

  // --- thème clair/sombre ---
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    render();
  });

  // --- dates de run disponibles (plus récent en premier) ---
  const runDates = [...new Set(fiches.map((f) => f.ajoute_le).filter(Boolean))].sort().reverse();
  const runSelect = document.getElementById('runSelect');
  const allOption = document.createElement('option');
  allOption.value = '__all__';
  allOption.textContent = 'Toute la base (' + fiches.length + ' fiches)';
  runSelect.appendChild(allOption);
  runDates.forEach((d) => {
    const opt = document.createElement('option');
    opt.value = d;
    const n = fiches.filter((f) => f.ajoute_le === d).length;
    opt.textContent = d + ' (' + n + ' nouvelle' + (n > 1 ? 's' : '') + ')';
    runSelect.appendChild(opt);
  });
  if (runDates.length) runSelect.value = runDates[0];

  // --- filtre types d'étude ---
  const typeSelect = document.getElementById('typeSelect');
  [...new Set(fiches.map((f) => f.type_etude).filter(Boolean))].sort().forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  });

  // --- état des filtres ---
  const state = { themes: new Set(), search: '', type: '', onlyAngle: false };
  const expanded = new Set();

  const themeChipsEl = document.getElementById('themeChips');
  const searchEl = document.getElementById('search');
  const onlyAngleEl = document.getElementById('onlyAngle');
  const listEl = document.getElementById('list');
  const countLineEl = document.getElementById('countLine');

  runSelect.addEventListener('change', render);
  typeSelect.addEventListener('change', () => { state.type = typeSelect.value; render(); });
  searchEl.addEventListener('input', () => { state.search = searchEl.value.trim().toLowerCase(); render(); });
  onlyAngleEl.addEventListener('change', () => { state.onlyAngle = onlyAngleEl.checked; render(); });
  document.getElementById('expandAll').addEventListener('click', () => {
    currentVisible().forEach((f) => expanded.add(f._key));
    render();
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    expanded.clear();
    render();
  });

  fiches.forEach((f, i) => { f._key = (f.doi || f.titre || '') + '::' + i; });

  function currentRunFiches() {
    const val = runSelect.value;
    if (val === '__all__') return fiches;
    return fiches.filter((f) => f.ajoute_le === val);
  }

  function currentVisible() {
    let list = currentRunFiches();
    if (state.themes.size) list = list.filter((f) => state.themes.has(f.thematique_id));
    if (state.type) list = list.filter((f) => f.type_etude === state.type);
    if (state.onlyAngle) list = list.filter((f) => (f.angle_brana_sana || '').trim().length > 0);
    if (state.search) {
      const q = state.search;
      list = list.filter((f) =>
        (f.titre || '').toLowerCase().includes(q) ||
        (f.auteurs || '').toLowerCase().includes(q) ||
        (f.resultat_principal || '').toLowerCase().includes(q) ||
        (f.mecanisme_evalue || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function renderChips() {
    const runFiches = currentRunFiches();
    const counts = {};
    runFiches.forEach((f) => { counts[f.thematique_id] = (counts[f.thematique_id] || 0) + 1; });
    themeChipsEl.innerHTML = '';
    Object.keys(themeMeta).forEach((id) => {
      const n = counts[id] || 0;
      if (n === 0 && !state.themes.has(id)) return;
      const chip = document.createElement('div');
      chip.className = 'chip' + (state.themes.has(id) ? ' active' : '');
      chip.innerHTML = '<span class="dot" style="background:' + themeColor(id) + '"></span>' +
        escapeHtml(themeMeta[id].label) + ' <span class="count">' + Number(n) + '</span>';
      chip.addEventListener('click', () => {
        if (state.themes.has(id)) state.themes.delete(id); else state.themes.add(id);
        render();
      });
      themeChipsEl.appendChild(chip);
    });
  }

  function fmtDate(d) {
    return d || '—';
  }

  function renderList() {
    const visible = currentVisible();
    countLineEl.textContent = visible.length + ' fiche' + (visible.length > 1 ? 's' : '') +
      (state.themes.size || state.type || state.onlyAngle || state.search ? ' (filtrées)' : '');
    listEl.innerHTML = '';
    if (!visible.length) {
      listEl.innerHTML = '<div class="empty">Aucune fiche ne correspond à ces filtres.</div>';
      return;
    }
    const byTheme = {};
    visible.forEach((f) => {
      (byTheme[f.thematique_id] = byTheme[f.thematique_id] || []).push(f);
    });
    Object.keys(byTheme)
      .sort((a, b) => (themeMeta[a]?.label || '').localeCompare(themeMeta[b]?.label || ''))
      .forEach((id) => {
        const section = document.createElement('div');
        section.className = 'section-title';
        section.textContent = (themeMeta[id]?.label || id) + ' — ' + byTheme[id].length;
        listEl.appendChild(section);
        // Les fiches avec un angle Braña Sana concret remontent en tête, triées par
        // pertinence décroissante — pour repérer vite ce qui compte parmi 60+ articles.
        byTheme[id]
          .slice()
          .sort((a, b) => (b.pertinence_centre ?? b.pertinence_brana_sana ?? 0) - (a.pertinence_centre ?? a.pertinence_brana_sana ?? 0))
          .forEach((f) => listEl.appendChild(renderCard(f, id)));
      });
  }

  function renderCard(f, themeId) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--card-color', themeColor(themeId));
    const open = expanded.has(f._key);

    const head = document.createElement('div');
    head.className = 'card-head';
    const pertinence = f.angle_brana_sana ? (Number(f.pertinence_centre ?? f.pertinence_brana_sana) || 0) : null;
    head.innerHTML =
      '<p class="card-title">' + escapeHtml(f.titre) + '</p>' +
      (f.prepublication ? '<span class="badge badge-retractation">⚠️ prépublication, non relue par des pairs</span>' : '') +
      (f.avertissement_retractation ? '<span class="badge badge-retractation">⚠️ rétractée</span>' : '') +
      (pertinence ? '<span class="badge badge-pertinence">pertinence ' + pertinence + '/5</span>' : '') +
      '<span class="badge">' + escapeHtml(f.type_etude || '?') + '</span>' +
      '<span class="badge">niveau : ' + escapeHtml(f.niveau_de_preuve || 'non évalué') + '</span>' +
      '<span class="badge">extraction : ' + escapeHtml(f.confiance_extraction || 'non évalué') + '</span>';
    card.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'meta-line';
    meta.textContent = [f.auteurs, f.date, f.ajoute_le ? 'ajouté le ' + f.ajoute_le : null]
      .filter(Boolean).join(' · ');
    card.appendChild(meta);

    if (!open) {
      const snippet = document.createElement('div');
      snippet.className = 'snippet';
      snippet.textContent = f.resultat_principal || '';
      card.appendChild(snippet);
    } else {
      const details = document.createElement('dl');
      details.className = 'details open';
      const rows = [
        ['Mécanisme évalué', f.mecanisme_evalue],
        ['Résultat principal', f.resultat_principal],
        ['Niveau de preuve', (f.niveau_de_preuve || 'non évalué') + ' — extraction : ' + (f.confiance_extraction || 'non évalué')],
        ['Justification du niveau', f.justification_niveau],
        ['Limites', f.niveau_de_preuve_et_limites],
        ['Angle Braña Sana', f.angle_brana_sana || '(aucun angle retenu)'],
      ];
      rows.forEach(([label, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        dd.textContent = value || '—';
        details.appendChild(dt);
        details.appendChild(dd);
      });
      // Liens web uniquement : jamais de javascript: ni de data:.
      if (/^https?:\/\//i.test(f.lien || '')) {
        const dt = document.createElement('dt');
        dt.textContent = 'Source';
        const dd = document.createElement('dd');
        const a = document.createElement('a');
        a.href = f.lien;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = f.lien;
        dd.appendChild(a);
        details.appendChild(dt);
        details.appendChild(dd);
      }
      card.appendChild(details);
    }

    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      if (expanded.has(f._key)) expanded.delete(f._key); else expanded.add(f._key);
      render();
    });
    return card;
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function render() {
    renderChips();
    renderList();
  }

  render();
})();
</script>
</body>
</html>
