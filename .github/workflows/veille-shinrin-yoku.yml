name: Veille La Borbolla / Braña Sana

on:
  schedule:
    # Chaque lundi à 5h05 UTC (≈ 7h05 en été / 6h05 en hiver, Europe/Brussels)
    - cron: "5 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: node src/index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: smtp.resend.com
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USER: resend
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: "Veille La Borbolla <veille-shinrin-yoku@ren0vate.be>"
          RECIPIENT_EMAIL_1: robin@manage-green.be
          RECIPIENT_EMAIL_2: amicie@manage-green.be
          DASHBOARD_URL: "https://architecht25.github.io/shinrin-yoku-agent/"

      - name: Commit et push des nouvelles fiches
        run: |
          git config user.name "veille-shinrin-yoku-bot"
          git config user.email "veille-shinrin-yoku-bot@users.noreply.github.com"
          git add data/db.json veille-la-borbolla/
          git diff --staged --quiet || git commit -m "veille: nouvelles fiches $(date -u +%Y-%m-%d)"
          git push

      - name: Préparer le dossier de publication GitHub Pages
        run: |
          mkdir -p dist
          cp veille-la-borbolla/dashboard.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: veille
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
