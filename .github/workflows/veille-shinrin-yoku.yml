name: Veille La Borbolla / Braña Sana

on:
  schedule:
    # Chaque vendredi à 18h05 UTC (≈ 19h05 en hiver / 20h05 en été, Europe/Brussels) :
    # le contenu est prêt pour la relecture du samedi dans le hub.
    - cron: "5 18 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # Un test en échec arrête le run avant toute collecte et tout envoi.
      - run: npm test

      - name: Préparer la veille (rien n'est envoyé)
        run: node src/index.js --preparer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_URL: "https://architecht25.github.io/shinrin-yoku-agent/"

      - name: Commit et push de la base et de la file des envois
        id: enregistrement
        run: |
          git config user.name "veille-shinrin-yoku-bot"
          git config user.email "veille-shinrin-yoku-bot@users.noreply.github.com"
          git add data/ veille-la-borbolla/
          git diff --staged --quiet || git commit -m "veille: nouvelles fiches $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      # Exécuté seulement si la base est enregistrée sur GitHub (étape précédente réussie).
      - name: Envoyer (e-mail puis hub)
        run: node src/index.js --envoyer
        env:
          SMTP_HOST: smtp.resend.com
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USER: resend
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: "Veille La Borbolla <veille-shinrin-yoku@ren0vate.be>"
          RECIPIENT_EMAIL_1: robin@manage-green.be
          RECIPIENT_EMAIL_2: amicie@manage-green.be
          HUB_ENABLED: "true"
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}

      # Même si un envoi a échoué : la file garde ce qui reste à reprendre.
      - name: Commit et push de l'état des envois
        if: ${{ !cancelled() && steps.enregistrement.outcome == 'success' }}
        run: |
          git add data/
          git diff --staged --quiet || git commit -m "veille: état des envois $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Préparer le dossier de publication GitHub Pages
        run: |
          mkdir -p dist
          cp veille-la-borbolla/dashboard.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: veille
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
